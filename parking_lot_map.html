    function nightSampleStyle(sample) {
      return sample?.empowered
        ? {
            stroke: "rgba(229, 143, 112, 0.9)",
            glow: "rgba(229, 143, 112, 0.42)",
            core: "rgba(255, 190, 150, 0.92)",
            shadow: "rgba(229, 143, 112, 0.82)"
          }
        : {
            stroke: "rgba(241, 245, 249, 0.86)",
            glow: "rgba(238, 243, 255, 0.32)",
            core: "rgba(255, 255, 255, 0.88)",
            shadow: "rgba(238, 243, 255, 0.72)"
          };
    }

    function nightTrailRibbonPoints(side = 0) {
      const offset = 15 * side;
      return nightTrailSamples.map((sample, index) => {
        const prev = nightTrailSamples[Math.max(0, index - 1)];
        const next = nightTrailSamples[Math.min(nightTrailSamples.length - 1, index + 1)];
        const dx = next.x - prev.x;
        const dy = next.y - prev.y;
        const length = Math.hypot(dx, dy) || 1;
        const nx = -dy / length;
        const ny = dx / length;
        return {
          x: sample.x + nx * offset,
          y: sample.y + ny * offset,
          fade: Math.max(0, 1 - sample.age / sample.duration),
          sample
        };
      });
    }

    function drawNightTrailRibbon(side = 0, glow = false) {
      if (nightTrailSamples.length < 2) return;
      const points = nightTrailRibbonPoints(side);
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (let index = 1; index < points.length; index += 1) {
        const prev = points[index - 1];
        const current = points[index];
        const next = points[Math.min(points.length - 1, index + 1)];
        const midX = (current.x + next.x) / 2;
        const midY = (current.y + next.y) / 2;
        const fade = Math.max(0, Math.min(1, current.fade));
        const style = nightSampleStyle(current.sample);
        ctx.globalAlpha = glow ? fade * 0.26 : fade * 0.82;
        ctx.shadowColor = style.shadow;
        ctx.shadowBlur = glow ? 20 : 10;
        ctx.strokeStyle = glow ? style.glow : (side === 0 ? style.core : style.stroke);
        ctx.lineWidth = glow
          ? (side === 0 ? 6 + fade * 11 : 4 + fade * 8)
          : (side === 0 ? 1 + fade * 2.7 : 0.8 + fade * 3.6);
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        if (index < points.length - 1) {
          ctx.quadraticCurveTo(current.x, current.y, midX, midY);
        } else {
          ctx.lineTo(current.x, current.y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawNightTrailSpark(spark) {
      const t = spark.age / spark.duration;
      const alpha = Math.max(0, 1 - t);
      const radius = spark.r * (1 - t * 0.35);
      ctx.save();
      ctx.globalAlpha = alpha * 0.82;
      ctx.shadowColor = spark.glow;
      ctx.shadowBlur = 12;
      ctx.fillStyle = spark.color;
      ctx.beginPath();
      ctx.arc(spark.x, spark.y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = alpha * 0.22;
      ctx.strokeStyle = spark.color;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(spark.x, spark.y, radius * 3.2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawNightTrail() {
      if (!hasNightMirrorTrailEquipped() || (nightTrailSamples.length < 2 && !nightTrailSparks.length)) return;
      drawNightTrailRibbon(-1, true);
      drawNightTrailRibbon(1, true);
      drawNightTrailRibbon(0, true);
      drawNightTrailRibbon(-1, false);
      drawNightTrailRibbon(1, false);
      drawNightTrailRibbon(0, false);
      nightTrailSparks.forEach(drawNightTrailSpark);
    }

    function drawCatExecutionPath(points, progress, glow = false) {
      if (!points || points.length < 2 || progress <= 0) return;
      const drawTo = pointOnPolyline(points, progress);
      const segmentProgress = clamp(progress, 0, 1) * (points.length - 1);
      const fullSegments = Math.floor(segmentProgress);
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = glow ? "rgba(226, 232, 242, 0.24)" : "rgba(226, 232, 242, 0.82)";
      ctx.shadowColor = "rgba(226, 232, 242, 0.7)";
      ctx.shadowBlur = glow ? 22 : 10;
      ctx.lineWidth = glow ? 12 : 3;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let index = 1; index <= fullSegments && index < points.length; index += 1) {
        ctx.lineTo(points[index].x, points[index].y);
      }
      ctx.lineTo(drawTo.x, drawTo.y);
      ctx.stroke();
      ctx.restore();
    }

    function drawCatExecutionMark(mark) {
      const fade = mark.complete ? Math.max(0, 1 - mark.age / mark.duration) : 1;
      if (fade <= 0) return;
      ctx.save();
      ctx.globalAlpha = fade;
      drawCatExecutionPath(mark.points, mark.progress, true);
      drawCatExecutionPath(mark.points, mark.progress, false);
      if (mark.complete) {
        const pulse = 0.5 + Math.sin((performance.now() + mark.x) / 180) * 0.5;
        ctx.globalCompositeOperation = "lighter";
        const glow = ctx.createRadialGradient(mark.x, mark.y, 16, mark.x, mark.y, catExecutionStarRadius + 28);
        glow.addColorStop(0, `rgba(226, 232, 242, ${0.16 + pulse * 0.08})`);
        glow.addColorStop(0.58, `rgba(125, 191, 164, ${0.12 + pulse * 0.06})`);
        glow.addColorStop(1, "rgba(226, 232, 242, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(mark.x, mark.y, catExecutionStarRadius + 28, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawExecutionShuriken(x, y, angle, alpha = 1, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.globalAlpha = alpha;
      ctx.shadowColor = "rgba(238, 243, 255, 0.9)";
      ctx.shadowBlur = 12 * scale;
      ctx.fillStyle = "rgba(244, 248, 255, 0.96)";
      ctx.strokeStyle = "rgba(125, 191, 164, 0.88)";
      ctx.lineWidth = 1.5 * scale;
      for (let blade = 0; blade < 4; blade += 1) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(22 * scale, -5 * scale);
        ctx.lineTo(12 * scale, 9 * scale);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(7, 16, 13, 0.9)";
      ctx.beginPath();
      ctx.arc(0, 0, 3.4 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(238, 243, 255, 0.9)";
      ctx.stroke();
      ctx.globalAlpha = alpha * 0.64;
      ctx.strokeStyle = "rgba(238, 243, 255, 0.82)";
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.moveTo(-18 * scale, 0);
      ctx.lineTo(-42 * scale, 0);
      ctx.stroke();
      ctx.restore();
    }

    function drawExecutionImpact(npc, t) {
      const strike = clamp((t - 0.78) / 0.22, 0, 1);
      if (strike <= 0) return;
      const alpha = Math.sin(strike * Math.PI);
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = "rgba(241, 245, 249, 0.92)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(npc.x - 48, npc.y - 36);
      ctx.lineTo(npc.x + 50, npc.y + 34);
      ctx.moveTo(npc.x + 38, npc.y - 42);
      ctx.lineTo(npc.x - 44, npc.y + 38);
      ctx.stroke();
      ctx.strokeStyle = "rgba(125, 191, 164, 0.78)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(npc.x, npc.y, 18 + strike * 62, 0, Math.PI * 2);
      ctx.stroke();
      const flare = ctx.createRadialGradient(npc.x, npc.y, 3, npc.x, npc.y, 76);
      flare.addColorStop(0, "rgba(241, 245, 249, 0.82)");
      flare.addColorStop(0.28, "rgba(125, 191, 164, 0.34)");
      flare.addColorStop(1, "rgba(125, 191, 164, 0)");
      ctx.fillStyle = flare;
      ctx.beginPath();
      ctx.arc(npc.x, npc.y, 76, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawCatExecution() {
      catExecutionMarks.forEach(drawCatExecutionMark);
      if (!catExecutionState) return;
      const state = catExecutionState;
      const npc = state.target;
      if (!npc) return;
      const drawEnd = catExecutionApproachSeconds + catExecutionDrawSeconds;
      const shurikenEnd = drawEnd + catExecutionShurikenSeconds;
      if (state.age >= drawEnd && state.age <= shurikenEnd) {
        const t = clamp((state.age - drawEnd) / catExecutionShurikenSeconds, 0, 1);
        const cx = (player.x + npc.x) / 2;
        const cy = (player.y + npc.y) / 2;
        const radius = Math.max(28, Math.hypot(player.x - npc.x, player.y - npc.y) / 2);
        const base = Math.atan2(player.y - npc.y, player.x - npc.x);
        const orbitT = 1 - Math.pow(1 - t, 2.25);
        const angle = base + orbitT * Math.PI * 2;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.18 + t * 0.16;
        ctx.strokeStyle = "rgba(226, 232, 242, 0.62)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();
        for (let trail = 7; trail >= 1; trail -= 1) {
          if (orbitT <= trail * 0.032) continue;
          const trailT = Math.max(0, orbitT - trail * 0.032);
          const trailAngle = base + trailT * Math.PI * 2;
          const trailAlpha = (1 - trail / 8) * 0.38;
          ctx.globalAlpha = trailAlpha;
          ctx.strokeStyle = "rgba(238, 243, 255, 0.86)";
          ctx.lineWidth = 3 + trail * 0.55;
          ctx.beginPath();
          ctx.arc(cx, cy, radius, trailAngle - 0.06, trailAngle + 0.08);
          ctx.stroke();
          drawExecutionShuriken(
            cx + Math.cos(trailAngle) * radius,
            cy + Math.sin(trailAngle) * radius,
            trailAngle + skillTime * 10,
            trailAlpha * 0.72,
            0.72
          );
        }
        ctx.restore();
        const shurikenX = cx + Math.cos(angle) * radius;
        const shurikenY = cy + Math.sin(angle) * radius;
        const impactScale = 1 + Math.sin(Math.min(1, t / 0.18) * Math.PI) * 0.16 + clamp((t - 0.72) / 0.28, 0, 1) * 0.28;
        drawExecutionShuriken(shurikenX, shurikenY, angle + skillTime * 12, 1, impactScale);
        drawExecutionImpact(npc, t);
      }
      if (state.age > shurikenEnd) {
        const t = clamp((state.age - shurikenEnd) / 0.34, 0, 1);
        const alpha = (1 - t) * 0.85;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = alpha;
        const flash = ctx.createRadialGradient(player.x, player.y, 4, player.x, player.y, 42 + t * 24);
        flash.addColorStop(0, "rgba(241, 245, 249, 0.95)");
        flash.addColorStop(0.42, "rgba(125, 191, 164, 0.34)");
        flash.addColorStop(1, "rgba(125, 191, 164, 0)");
        ctx.fillStyle = flash;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 42 + t * 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawPet() {
      if (!activePetDef) return;
      const activeRatio = petDurationSeconds() > 0 ? clamp(petState.activeLeft / petDurationSeconds(), 0, 1) : 0;
      if (petState.shield > 0) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.22 + Math.sin(skillTime * 3.4) * 0.05;

        ctx.beginPath();

        ctx.arc(player.x, player.y, player.radius + 30, 0, Math.PI * 2);

      ctx.scale(1 + squash, 1 - squash * 0.55);

      shadow.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.beginPath();
      ctx.ellipse(0, 14, 28, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.28 + activeRatio * 0.32;
      const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 38 + activeRatio * 18);
      glow.addColorStop(0, activePetDef.glow);
      glow.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 38 + activeRatio * 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.fillStyle = activePetDef.color;
      ctx.strokeStyle = activeRatio > 0 ? "#f3ead6" : "rgba(7, 16, 13, 0.72)";
      ctx.lineWidth = activeRatio > 0 ? 3 : 2;
      ctx.beginPath();
      ctx.arc(0, 0, 15, 0, Math.PI * 2);

      ctx.stroke();
      ctx.save();
      ctx.lineCap = "round";

      ctx.fillStyle = activePetDef.markColor || activePetDef.color;
      ctx.lineWidth = activeRatio > 0 ? 3.4 : 2.7;
      if (selectedPet === "spark") {
        ctx.beginPath();
        ctx.moveTo(-6, 9);
        ctx.lineTo(1, -10);
        ctx.lineTo(4, -1);
        ctx.lineTo(10, -9);
        ctx.stroke();
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-10, 2);
        ctx.lineTo(-4, -5);
        ctx.moveTo(5, 9);
        ctx.lineTo(11, 2);
        ctx.stroke();
      } else if (selectedPet === "mender") {
        ctx.fillRect(-3, -10, 6, 20);
        ctx.fillRect(-10, -3, 20, 6);
        ctx.strokeStyle = "rgba(7, 16, 13, 0.42)";
        ctx.shadowBlur = 12 + activeRatio * 10;
        ctx.lineWidth = 1.2;
        ctx.strokeRect(-3, -10, 6, 20);
        ctx.strokeRect(-10, -3, 20, 6);
      } else if (selectedPet === "guard") {
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(9, -5);
        ctx.lineTo(7, 6);
        ctx.lineTo(0, 11);
        ctx.lineTo(-7, 6);
        ctx.lineTo(-9, -5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (selectedPet === "cooler") {
        ctx.beginPath();
        ctx.moveTo(-10, 4);
        ctx.quadraticCurveTo(-4, -12, 0, -3);
        ctx.quadraticCurveTo(4, -12, 10, 4);
        ctx.quadraticCurveTo(0, 12, -10, 4);
        ctx.closePath();
        ctx.stroke();
      }
      ctx.restore();
      if (activeRatio > 0) {
        ctx.strokeStyle = activePetDef.color;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 7]);
        ctx.beginPath();
        ctx.arc(0, 0, 23 + Math.sin(skillTime * 5) * 3, 0, Math.PI * 2);
        ctx.stroke();

          ctx.stroke();
          ctx.restore();
        });
      }
      if (characterId === "egg" && pvpBotSkill.eggBeamLeft > 0) {

        ctx.globalCompositeOperation = "lighter";

        light.addColorStop(1, "rgba(199, 169, 107, 0)");
        ctx.fillStyle = light;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, lightRadius, 0, Math.PI * 2);
        ctx.fill();

        const glow = ctx.createRadialGradient(orb.x, orb.y, 2, orb.x, orb.y, glowRadius);
        glow.addColorStop(0, "rgba(255, 237, 180, 0.78)");
        glow.addColorStop(0.42, "rgba(199, 169, 107, 0.26)");

        ctx.beginPath();
        ctx.arc(orb.x, orb.y, glowRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = "source-over";

          ctx.strokeStyle = "rgba(7, 16, 13, 0.62)";

    function drawNightBurnAuras() {
      availableIceTargets().forEach((npc) => {
        if (!npc.burnLeft || npc.dead || npc.active === false || !pointVisible(npc, 80)) return;
        const radius = (npc.r || npc.radius || 18) + 18;
        const pulse = 0.5 + Math.sin(performance.now() / 120 + npc.x) * 0.5;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const flameGlow = ctx.createRadialGradient(npc.x, npc.y, 4, npc.x, npc.y, radius + 34);
        flameGlow.addColorStop(0, `rgba(255, 206, 122, ${0.12 + pulse * 0.05})`);
        flameGlow.addColorStop(0.48, `rgba(229, 143, 112, ${0.18 + pulse * 0.08})`);
        flameGlow.addColorStop(1, "rgba(72, 30, 30, 0)");
        ctx.fillStyle = flameGlow;
        ctx.beginPath();
        ctx.arc(npc.x, npc.y, radius + 34, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.62 + pulse * 0.2;
        ctx.strokeStyle = "rgba(255, 178, 108, 0.9)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(npc.x, npc.y, radius, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(npc.burnLeft / nightBurnDurationSeconds, 0, 1));
        ctx.stroke();
        const now = performance.now() / 1000;
        const particleCount = npc.isBoss ? 18 : 10;
        for (let index = 0; index < particleCount; index += 1) {
          const seed = (npc.x * 0.013 + npc.y * 0.017 + index * 1.731);
          const drift = (now * (0.75 + (index % 5) * 0.08) + seed) % 1;
          const angle = seed + Math.sin(now * 1.7 + index) * 0.65;
          const spread = (npc.r || npc.radius || 18) * (0.38 + (index % 4) * 0.16);
          const x = npc.x + Math.cos(angle) * spread * (0.8 + drift * 0.4);
          const y = npc.y + Math.sin(angle) * spread - drift * (28 + (index % 3) * 7);
          const flame = index % 3 !== 0;
          ctx.globalAlpha = flame ? (1 - drift) * 0.88 : (1 - drift) * 0.48;
          ctx.fillStyle = flame ? (index % 2 ? "rgba(255, 206, 122, 0.95)" : "rgba(229, 143, 112, 0.92)") : "rgba(132, 124, 110, 0.62)";
          ctx.beginPath();
          if (flame) {
            ctx.moveTo(x, y - 8);
            ctx.quadraticCurveTo(x + 6, y, x, y + 7);
            ctx.quadraticCurveTo(x - 6, y, x, y - 8);
          } else {
            ctx.arc(x, y, 2.2 + (index % 3), 0, Math.PI * 2);
          }
          ctx.fill();
        }
        ctx.restore();
      });
    }

    function drawNightShardProjectiles() {
      nightShardProjectiles.forEach((shard) => {
        ctx.save();
        ctx.translate(shard.x, shard.y);
        ctx.rotate(Math.atan2(shard.vy, shard.vx) + shard.spin + shard.distance * 0.035);
        const empowered = shard.empowered;
        const backShard = shard.kind === "back";
        const mirrorShard = Boolean(shard.mirror);
        ctx.globalCompositeOperation = "lighter";
        ctx.shadowColor = mirrorShard
          ? "rgba(238, 243, 255, 0.96)"
          : backShard ? "rgba(229, 143, 112, 0.95)" : empowered ? "rgba(229, 143, 112, 0.82)" : "rgba(238, 243, 255, 0.72)";
        ctx.shadowBlur = mirrorShard ? 24 : backShard ? 22 : empowered ? 15 : 10;
        if (backShard) {
          ctx.save();
          ctx.globalAlpha = 0.58;
          ctx.strokeStyle = empowered ? "rgba(255, 206, 122, 0.72)" : "rgba(229, 143, 112, 0.64)";
          ctx.lineWidth = 3;
          ctx.setLineDash([4, 6]);
          ctx.beginPath();
          ctx.arc(0, 0, 25 + Math.sin(shard.distance * 0.06) * 3, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
          for (let spark = 0; spark < 4; spark += 1) {
            const angle = spark * Math.PI / 2 + shard.distance * 0.018;
            ctx.beginPath();
            ctx.moveTo(Math.cos(angle) * 18, Math.sin(angle) * 18);
            ctx.lineTo(Math.cos(angle) * 31, Math.sin(angle) * 31);
            ctx.stroke();
          }
          ctx.restore();
        }
        ctx.fillStyle = backShard
          ? mirrorShard ? "rgba(238, 243, 255, 0.44)" : empowered ? "rgba(255, 126, 98, 0.64)" : "rgba(229, 143, 112, 0.42)"
          : empowered ? "rgba(229, 143, 112, 0.42)" : "rgba(238, 243, 255, 0.28)";
        ctx.strokeStyle = backShard
          ? mirrorShard ? "rgba(238, 243, 255, 0.96)" : empowered ? "rgba(255, 222, 170, 0.98)" : "rgba(255, 188, 154, 0.92)"
          : empowered ? "rgba(255, 210, 190, 0.88)" : "rgba(238, 243, 255, 0.92)";
        ctx.lineWidth = backShard ? 2.8 : empowered ? 2 : 1.5;
        const shardScale = backShard ? 1.18 : 1;
        ctx.beginPath();
        ctx.moveTo(18 * shardScale, 0);
        ctx.lineTo(0, -14 * shardScale);
        ctx.lineTo(-18 * shardScale, 0);
        ctx.lineTo(0, 14 * shardScale);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawIceFields() {
      iceFields.forEach((field) => {

        ctx.save();
        ctx.globalAlpha = Math.max(0, 0.72 - t * 0.42);
        const gradient = ctx.createRadialGradient(field.x, field.y, 8, field.x, field.y, field.r);

        ctx.restore();

      if (selectedCharacter !== "egg" || !eggBeam.active || runEnded || searchState || pendingLoot || backpackModal.classList.contains("show")) return;
      const ux = Math.cos(eggBeam.angle);

    function drawEggBalls() {

    function drawHitBursts() {
      hitBursts.forEach((burst) => {
        const t = burst.age / 0.66;
        const skinImpact = Boolean(burst.skinImpact);
        const power = Number(burst.power ?? (skinImpact ? 0.9 : 0.26));
        const color = burst.color || (burst.label === "瞬移" || burst.label === "瞬步" ? "rgba(125, 191, 164, 0.9)" : "rgba(199, 169, 107, 0.9)");
        ctx.save();
        ctx.globalAlpha = Math.max(0, (skinImpact ? 0.92 : 0.42) - t * (skinImpact ? 0.84 : 0.34));
        if (skinImpact && burst.glow) {
          ctx.globalCompositeOperation = "lighter";
          const glow = ctx.createRadialGradient(burst.x, burst.y, 2, burst.x, burst.y, 42 + power * 18);
          glow.addColorStop(0, burst.glow);
          glow.addColorStop(1, "rgba(255, 255, 255, 0)");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(burst.x, burst.y, 42 + power * 18, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = skinImpact ? 2.4 + power : 1.2 + power;
        ctx.beginPath();
        ctx.arc(burst.x, burst.y, 10 + t * (skinImpact ? 30 + power * 16 : 16 + power * 7), 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = Math.max(0, (skinImpact ? 0.62 : 0.18) - t * (skinImpact ? 0.56 : 0.16));
        ctx.lineWidth = skinImpact ? 1.5 : 1;
        const rayCount = skinImpact ? 7 : 3;
        for (let index = 0; index < rayCount; index += 1) {
          const angle = (Math.PI * 2 * index) / rayCount + t * 0.4;
          const inner = 7 + t * (skinImpact ? 18 : 8);
          const outer = inner + (skinImpact ? 10 + power * 8 : 5 + power * 3);
          ctx.beginPath();
          ctx.moveTo(burst.x + Math.cos(angle) * inner, burst.y + Math.sin(angle) * inner);
          ctx.lineTo(burst.x + Math.cos(angle) * outer, burst.y + Math.sin(angle) * outer);
          ctx.stroke();
        }
        ctx.restore();
      });
    }

    function drawHathorEffects() {
      const fieldActive = hathorBellFieldLeft > 0;
      const shieldActive = selectedCharacter === "hathor" && hathorShield > 0;
      if (fieldActive || shieldActive) {
        const red = fieldActive ? hathorBellFieldKind === "sekhmet" : hathorSekhmetActive();
        const radius = fieldActive ? 230 : 84;
        const color = red ? "229, 88, 62" : "241, 207, 122";
        const pulse = 0.5 + Math.sin(skillTime * 3.2) * 0.5;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = `rgba(${color}, ${red ? 0.13 : 0.1})`;
        ctx.strokeStyle = `rgba(${color}, ${0.64 + pulse * 0.22})`;
        ctx.lineWidth = 3 + pulse * 2;
        ctx.beginPath();
        ctx.arc(player.x, player.y, radius + pulse * 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.setLineDash([10, 12]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x, player.y, radius * 0.74 - pulse * 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        const count = red ? 14 : 10;
        for (let index = 0; index < count; index += 1) {
          const angle = (index / count) * Math.PI * 2 + skillTime * (red ? 0.42 : 0.22);
          const x = player.x + Math.cos(angle) * (radius * 0.88);
          const y = player.y + Math.sin(angle) * (radius * 0.88);
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle + Math.PI / 2);
          ctx.globalAlpha = red ? 0.56 : 0.48;
          ctx.strokeStyle = red ? "rgba(229, 88, 62, 0.92)" : "rgba(255, 238, 190, 0.86)";
          ctx.fillStyle = red ? "rgba(229, 88, 62, 0.28)" : "rgba(241, 207, 122, 0.22)";
          ctx.lineWidth = 2;
          if (red) {
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(7, 8);
            ctx.lineTo(-7, 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.moveTo(-7, -6);
            ctx.quadraticCurveTo(0, 8, 7, -6);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 8, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
        ctx.restore();
      }

      hathorEffects.forEach((effect) => {
        const t = clamp(effect.age / effect.duration, 0, 1);
        const fade = Math.max(0, 1 - t);
        const pulse = Math.sin(t * Math.PI);
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        if (effect.type === "sun") {
          const length = Math.hypot(effect.endX - effect.x, effect.endY - effect.y);
          ctx.translate(effect.x, effect.y);
          ctx.rotate(effect.angle);
          const beam = ctx.createLinearGradient(0, 0, length, 0);
          beam.addColorStop(0, `rgba(255, 226, 132, ${0.65 * fade})`);
          beam.addColorStop(0.48, `rgba(229, 88, 62, ${0.82 * fade})`);
          beam.addColorStop(1, `rgba(229, 88, 62, ${0.05 * fade})`);
          ctx.fillStyle = beam;
          ctx.beginPath();
          ctx.moveTo(0, -24 - pulse * 22);
          ctx.lineTo(length, -76 - pulse * 26);
          ctx.lineTo(length, 76 + pulse * 26);
          ctx.lineTo(0, 24 + pulse * 22);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = `rgba(255, 236, 170, ${0.88 * fade})`;
          ctx.lineWidth = 5 + pulse * 6;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(length, 0);
          ctx.stroke();
          ctx.translate(length, 0);
          ctx.rotate(t * Math.PI * 5);
          ctx.strokeStyle = `rgba(255, 226, 132, ${0.95 * fade})`;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(0, 0, 34 + pulse * 34, 0, Math.PI * 2);
          ctx.stroke();
          for (let index = 0; index < 12; index += 1) {
            const angle = (index / 12) * Math.PI * 2;
            const inner = 18 + pulse * 18;
            const outer = 58 + pulse * 48;
            ctx.beginPath();
            ctx.moveTo(Math.cos(angle) * inner, Math.sin(angle) * inner);
            ctx.lineTo(Math.cos(angle) * outer, Math.sin(angle) * outer);
            ctx.stroke();
          }
        } else if (effect.type === "pomegranate") {
          const radius = effect.radius || 170;
          ctx.translate(player.x, player.y);
          ctx.rotate(t * Math.PI * 2.7);
          for (let index = 0; index < 5; index += 1) {
            const local = clamp(t - index * 0.08, 0, 1);
            if (local <= 0) continue;
            const arcRadius = radius * (0.2 + local * 0.65);
            ctx.globalAlpha = fade * (0.58 - index * 0.07);
            ctx.strokeStyle = index % 2 ? "rgba(229, 88, 62, 0.7)" : "rgba(112, 24, 38, 0.78)";
            ctx.lineWidth = 7 - index * 0.6;
            ctx.beginPath();
            ctx.arc(0, 0, arcRadius, -Math.PI * 0.78 + index * 0.42, Math.PI * 0.36 + index * 0.42);
            ctx.stroke();
          }
          for (let index = 0; index < 22; index += 1) {
            const seed = index * 2.19;
            const dist = radius * (0.18 + (index % 7) * 0.085) * (0.65 + t * 0.55);
            const x = Math.cos(seed + t * 3.6) * dist;
            const y = Math.sin(seed + t * 2.9) * dist;
            ctx.globalAlpha = fade * (0.5 + (index % 3) * 0.1);
            ctx.fillStyle = index % 4 === 0 ? "rgba(255, 205, 132, 0.7)" : "rgba(166, 54, 62, 0.86)";
            ctx.beginPath();
            ctx.arc(x, y, 2.4 + (index % 3), 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          const red = effect.type === "red-bell" || effect.type === "form";
          const color = red ? "229, 88, 62" : "241, 207, 122";
          const radius = effect.radius || 220;
          const ringCount = effect.type === "cup" ? 4 : 3;
          if (effect.type === "form") {
            ctx.globalAlpha = fade * (1 - t) * 0.52;
            ctx.strokeStyle = "rgba(241, 207, 122, 0.9)";
            ctx.lineWidth = 7;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, radius * (0.42 + t * 0.24), 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = Math.sin(t * Math.PI) * 0.64;
            ctx.strokeStyle = "rgba(229, 88, 62, 0.94)";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, radius * (0.26 + t * 0.62), 0, Math.PI * 2);
            ctx.stroke();
          }
          for (let index = 0; index < ringCount; index += 1) {
            const local = clamp(t - index * 0.12, 0, 1);
            if (local <= 0) continue;
            ctx.globalAlpha = fade * (0.64 - index * 0.12);
            ctx.strokeStyle = `rgba(${color}, ${0.95 - index * 0.16})`;
            ctx.lineWidth = effect.type === "form" ? 5 : 3;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, radius * (0.18 + local * 0.82), 0, Math.PI * 2);
            ctx.stroke();
          }
          if (effect.type === "cup") {
            ctx.translate(effect.x, effect.y - 8 - pulse * 22);
            ctx.globalAlpha = 0.9 * fade;
            ctx.strokeStyle = "rgba(255, 238, 190, 0.98)";
            ctx.fillStyle = "rgba(241, 207, 122, 0.26)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-42, -14);
            ctx.quadraticCurveTo(-34, 44, 0, 50);
            ctx.quadraticCurveTo(34, 44, 42, -14);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(-45, 2, 18, Math.PI * 0.55, Math.PI * 1.48);
            ctx.arc(45, 2, 18, -Math.PI * 0.48, Math.PI * 0.45);
            ctx.stroke();
          } else {
            const particleCount = red ? 28 : 18;
            for (let index = 0; index < particleCount; index += 1) {
              const seed = index * 2.399;
              const dist = radius * (0.14 + t * (0.58 + (index % 5) * 0.05));
              const x = effect.x + Math.cos(seed + t * 2.2) * dist;
              const y = effect.y + Math.sin(seed + t * 1.7) * dist - (red ? t * 22 : t * 10);
              ctx.globalAlpha = fade * (red ? 0.74 : 0.55);
              ctx.fillStyle = red
                ? (index % 3 ? "rgba(229, 88, 62, 0.92)" : "rgba(132, 124, 110, 0.62)")
                : "rgba(255, 238, 190, 0.86)";
              ctx.beginPath();
              ctx.arc(x, y, red ? 2.8 + (index % 3) : 2.2, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
        ctx.restore();
      });
    }

    function drawVictoryBroadcasts() {
      victoryBroadcasts.forEach((broadcast) => {
        const t = broadcast.age / broadcast.duration;
        const alpha = Math.max(0, 1 - t);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = "15px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const width = Math.min(320, ctx.measureText(broadcast.text).width + 34);
        const height = 30;
        const x = broadcast.x;
        const y = broadcast.y;
        ctx.fillStyle = "rgba(7, 16, 13, 0.58)";
        ctx.strokeStyle = "rgba(255, 226, 132, 0.36)";
        ctx.lineWidth = 1.5;
        const left = x - width / 2;
        const top = y - height / 2;
        const radius = 8;
        ctx.beginPath();
        ctx.moveTo(left + radius, top);
        ctx.lineTo(left + width - radius, top);
        ctx.arcTo(left + width, top, left + width, top + radius, radius);
        ctx.lineTo(left + width, top + height - radius);
        ctx.arcTo(left + width, top + height, left + width - radius, top + height, radius);
        ctx.lineTo(left + radius, top + height);
        ctx.arcTo(left, top + height, left, top + height - radius, radius);
        ctx.lineTo(left, top + radius);
        ctx.arcTo(left, top, left + radius, top, radius);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(255, 239, 184, 0.94)";
        ctx.shadowColor = "rgba(255, 226, 132, 0.48)";
        ctx.shadowBlur = 8;
        ctx.fillText(broadcast.text, x, y + 0.5);
        ctx.restore();
      });
    }

    function drawBastetEffects() {
      if (bastetMoonShadow) {
        const t = clamp(bastetMoonShadow.age / bastetMoonShadow.duration, 0, 1);
        ctx.save();
        ctx.globalAlpha = 0.68 * (1 - t * 0.45);
        ctx.translate(bastetMoonShadow.x, bastetMoonShadow.y);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = "rgba(13, 12, 10, 0.5)";
        ctx.strokeStyle = "rgba(225, 185, 86, 0.78)";
        ctx.lineWidth = 2;
        ctx.fillRect(-16, -16, 32, 32);
        ctx.strokeRect(-16, -16, 32, 32);
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 0.56 * (1 - t);
        ctx.strokeStyle = "rgba(225, 185, 86, 0.54)";
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 10]);
        ctx.beginPath();
        ctx.arc(bastetMoonShadow.x, bastetMoonShadow.y, 34 + Math.sin(skillTime * 5) * 4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      if (selectedCharacter === "bastet" && bastetCounterLeft > 0) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = "rgba(225, 185, 86, 0.76)";
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 9]);
        ctx.beginPath();
        ctx.arc(player.x, player.y, 42 + Math.sin(skillTime * 7) * 3, -Math.PI * 0.4, Math.PI * 1.24);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "rgba(225, 185, 86, 0.08)";
        ctx.beginPath();
        ctx.arc(player.x, player.y, 48, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      bastetMoonBlades.forEach((blade) => {
        if (blade.trail?.length) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.lineCap = "round";
          for (let i = 1; i < blade.trail.length; i += 1) {
            const prev = blade.trail[i - 1];
            const point = blade.trail[i];
            const alpha = Math.max(0, 1 - point.age / 0.28);
            ctx.strokeStyle = `rgba(225, 185, 86, ${0.32 * alpha})`;
            ctx.lineWidth = 10 * alpha + 2;
            ctx.beginPath();
            ctx.moveTo(prev.x, prev.y);
            ctx.lineTo(point.x, point.y);
            ctx.stroke();
          }
          ctx.restore();
        }
        ctx.save();
        ctx.translate(blade.x, blade.y);
        ctx.rotate(Math.atan2(blade.vy, blade.vx) + blade.spin * 0.025);
        ctx.globalCompositeOperation = "lighter";
        const size = bastetMoonBladeRadius(blade);
        const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, size * 1.55);
        glow.addColorStop(0, "rgba(245, 224, 171, 0.32)");
        glow.addColorStop(1, "rgba(225, 185, 86, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, size * 1.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(225, 185, 86, 0.48)";
        ctx.strokeStyle = "rgba(255, 238, 190, 0.98)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(-size * 0.18, 0, size, -Math.PI * 0.82, Math.PI * 0.82, false);
        ctx.arc(size * 0.36, 0, size * 0.92, Math.PI * 0.82, -Math.PI * 0.82, true);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });
    }

    function updateNearbyThing() {
      nearbyThing = null;
      nearbyNpc = null;
      nearbyPvpTarget = null;
      let nearest = Infinity;
      things.forEach((thing) => {
        const distance = Math.hypot(player.x - thing.x, player.y - thing.y);

          nearbyThing = thing;
          nearest = distance;
        }
      });
      aiScavs.forEach((npc) => {
        if (npc.active === false) return;

          nearbyNpc = npc;
          nearbyThing = null;
          nearest = distance;
        }
      });
      if (pvpState.enabled && pvpState.roundActive) {
        const pvpDistance = Math.hypot(player.x - pvpOpponent.x, player.y - pvpOpponent.y);
        if (pvpDistance < player.radius + pvpOpponent.radius + 62 && pvpDistance < nearest + 20) {
          nearbyPvpTarget = pvpOpponent;

      if (focusedThing && focusedThing !== nearbyThing) {

      if (searchState) {

      if (nearbyPvpTarget) {

        renderHud();

      interactButton.disabled = runEnded || Boolean(searchState) || Boolean(pendingLoot) || (!nearbyThing && !nearbyNpc);
      if (nearbyNpc) {
        const interrupted = interruptedProgressFor(nearbyNpc);
        const bossExecutable = nearbyNpc.isBoss && !nearbyNpc.dead && catExecutionUnlocked();
        interactButton.textContent = nearbyNpc.dead ? (nearbyNpc.searched ? "已搜索" : interrupted ? "继续搜索" : nearbyNpc.isBoss ? "搜索残骸" : "搜索背包") : bossExecutable ? "定点" : nearbyNpc.isBoss ? "迎战" : nearbyNpc.guardian ? "交战" : "处决";
        if (((nearbyNpc.isBoss && !bossExecutable) || nearbyNpc.guardian) && !nearbyNpc.dead) interactButton.disabled = true;
        if (nearbyNpc.dead) {
          promptEl.innerHTML = nearbyNpc.searched
            ? `<strong>${nearbyNpc.name}</strong> 已搜过。`
            : interrupted
              ? `<strong>${nearbyNpc.name}</strong>：E 继续搜索。`
              : `<strong>${nearbyNpc.name}</strong>：E 搜索。`;
        } else if (nearbyNpc.isBoss) {
          promptEl.innerHTML = bossExecutable
            ? `<strong>${nearbyNpc.name}</strong>：E 定点。`
            : `<strong>${nearbyNpc.name}</strong>：激光、重斧、冲刺。`;
        } else if (nearbyNpc.guardian) {
          const skillText = nearbyNpc.guardianSkill === "pulse" ? "结界脉冲" : nearbyNpc.guardianSkill === "blink" ? "影步虚影" : "战术远射";
          promptEl.innerHTML = `<strong>${nearbyNpc.name}</strong>：${skillText}，无法处决。`;

      if (nearbyThing) {

          interactButton.textContent = nearbyThing.actionText || "离开";
          if (focusedThing === nearbyThing) {
            renderHud();

          const needsCard = (nearbyThing.exitMode === "staffHome" || nearbyThing.exitMode === "investigatorHall") && !hasCardForExit(nearbyThing.exitMode);
          const needsBisonCore = nearbyThing.exitMode === "investigatorHall" && !needsCard && !hasBisonCore();
          const extra = needsCard

          interactButton.disabled = !worldEvent.blackoutActive || worldEvent.blackoutRestoring;
          promptEl.innerHTML = worldEvent.blackoutActive
            ? worldEvent.blackoutRestoring
              ? `<strong>${nearbyThing.name}</strong> 合闸中。`
              : `<strong>${nearbyThing.name}</strong>：E 修理。`
            : `<strong>${nearbyThing.name}</strong> 已修复。`;
          renderHud();
          return;
        }

      if (nearbyThing.type === "lore") {
        if (nearbyThing.bossTrigger && bossCarbot()?.active) {
          interactButton.textContent = "远离";
          if (focusedThing === nearbyThing) {
            renderHud();
            return;
          }
          promptEl.innerHTML = `<strong>${nearbyThing.name}</strong>：Boss 已现身。`;
          renderHud();
          return;
        }
        interactButton.textContent = nearbyThing.actionText || "查看";
          if (focusedThing === nearbyThing) {
            renderHud();
            return;
          }
          promptEl.innerHTML = nearbyThing.revealOnApproach
            ? nearbyThing.message
            : `<strong>${nearbyThing.name}</strong>：E ${nearbyThing.actionText || "查看"}。`;
          renderHud();
          return;
        }

        const investigated = investigatedThings.has(nearbyThing.name);
        const searched = searchedThings.has(nearbyThing.name);
        const locked = Boolean(nearbyThing.lockedCard && !lockedThingUnlocked(nearbyThing));
        const interrupted = interruptedProgressFor(nearbyThing);
        interactButton.textContent = searched ? "已搜索" : interrupted ? "继续搜索" : locked ? "刷卡" : investigated ? "搜索" : "调查";
        if (focusedThing === nearbyThing) {
          renderHud();
          return;
        }
        if (searched) {
          promptEl.innerHTML = `<strong>${nearbyThing.name}</strong> 已搜过。`;
        } else if (locked) {
          const card = cardForLockedThing(nearbyThing);
          promptEl.innerHTML = card
            ? `<strong>${nearbyThing.name}</strong>：E 刷${card.item}。`
            : `<strong>${nearbyThing.name}</strong>：需要${lockedThingCardName(nearbyThing)}。`;
        } else if (interrupted) {
          promptEl.innerHTML = `<strong>${nearbyThing.name}</strong>：E 继续搜索。`;
        } else if (investigated) {
          promptEl.innerHTML = `<strong>${nearbyThing.name}</strong>：E 搜索。`;
        } else {
          promptEl.innerHTML = `<strong>${nearbyThing.name}</strong>：E 调查。`;
        }
      } else {
        interactButton.textContent = "调查";
        const currentExtract = nearbyExtractZone();
        promptEl.innerHTML = currentExtract
          ? currentExtract.vehiclePickup
            ? `<strong>${currentExtract.name}</strong>：通道已开放，按 E 离开停车场。`
            : `<strong>${currentExtract.name}</strong>：可撤离。`
          : worldEvent.notice || `WASD 移动，E 互动。`;
      }
      renderHud();
    }

    function interact() {
      if (runEnded) return;
      if (catExecutionState) return;
      if (searchState) {
        cancelSearch();
        return;
      }
      if (pendingLoot || (!nearbyThing && !nearbyNpc && !nearbyPvpTarget)) return;
      if (nearbyPvpTarget) {
        if (selectedCharacter === "cat" && startCatExecution(nearbyPvpTarget)) return;
        pvpStrikeOpponent();
        return;
      }
      if (nearbyNpc) {
        focusedThing = null;
        if (!nearbyNpc.dead) {
          if (nearbyNpc.isBoss) {
            if (startCatExecution(nearbyNpc)) return;
            promptEl.innerHTML = `<strong>${nearbyNpc.name}</strong> 装甲太厚。`;
            renderHud();
            return;
          }
          if (nearbyNpc.guardian) {
            promptEl.innerHTML = `<strong>${nearbyNpc.name}</strong> 无法处决。`;
            renderHud();
            return;
          }
          executeNpc(nearbyNpc);
          return;
        }
        if (!nearbyNpc.searched) {
          startSearch(nearbyNpc);
          return;
        }
        promptEl.innerHTML = `<strong>${nearbyNpc.name}</strong> 已搜过。`;
        renderHud();
        return;
      }
      focusedThing = nearbyThing;
      if (nearbyThing.type === "exit") {
        useExit(nearbyThing);
        return;
      }
      if (nearbyThing.type === "eventBreaker") {
        repairBreaker();
        return;
      }
      if (nearbyThing.type === "lore") {
        investigatedThings.add(nearbyThing.name);
        recordParkingInvestigation(nearbyThing);
        if (nearbyThing.bossTrigger) {
          triggerBossFromCar();
          return;
        }
        promptEl.innerHTML = nearbyThing.message;
        renderHud();
        return;
      }
      if (nearbyThing.lockedCard && !lockedThingUnlocked(nearbyThing)) {
        useAccessCardForLockedThing(nearbyThing);
        return;
      }
      if (!investigatedThings.has(nearbyThing.name)) {
        investigatedThings.add(nearbyThing.name);
        recordParkingInvestigation(nearbyThing);
        interactButton.textContent = "搜索";
      promptEl.innerHTML = `<strong>${nearbyThing.name}</strong>：${nearbyThing.message}`;
        renderHud();
        return;
      }
      if (!searchedThings.has(nearbyThing.name)) {
        if (nearbyThing.lockedCard && !lockedThingUnlocked(nearbyThing)) {
          useAccessCardForLockedThing(nearbyThing);
          return;
        }
        startSearch(nearbyThing);
        return;
      }
      promptEl.innerHTML = `<strong>${nearbyThing.name}</strong> 已搜过。`;
    }

    function executeNpc(npc) {
      if (startCatExecution(npc)) return;
      if (npc.isBoss) return;
      npc.dead = true;
      npc.target = null;
      npc.hp = 0;
      promptEl.innerHTML = `<strong>${npc.name}</strong> 被处决。`;
      renderHud();
      checkSecondWaveTrigger();
    }

    function searchKey(thing) {
      return thing.id || thing.name;
    }

    function searchElapsed(now = performance.now()) {
      if (!searchState) return 0;
      return clamp(searchState.elapsed + now - searchState.startedAt, 0, searchState.duration);
    }

    function interruptedSearchFor(thing) {
      return thing ? interruptedSearches.get(searchKey(thing)) : null;
    }

    function interruptedProgressFor(thing) {
      const interrupted = interruptedSearchFor(thing);
      return interrupted ? clamp(interrupted.elapsed / interrupted.duration, 0, 1) : 0;
    }

    function lootSearchDuration(loot) {
      const tierId = Math.max(1, Math.min(6, Number(loot?.tierId || 1)));
      return itemSearchDurations[tierId] || itemSearchDurations[1];
    }

    function createSearchTimeline(drops) {
      let cursor = 0;
      return drops.map((loot, index) => {
        const duration = lootSearchDuration(loot);
        const entry = {
          id: loot.id,
          index,
          tierId: Math.max(1, Math.min(6, Number(loot.tierId || 1))),
          start: cursor,
          end: cursor + duration,
          duration
        };
        cursor += duration;
        return entry;
      });
    }

    function triggerRareLootEffect(loot) {
      const tierId = Math.max(1, Math.min(6, Number(loot?.tierId || 1)));
      if (tierId < 5) return;
      recentRareLootId = loot.id || "";
      window.clearTimeout(recentRareLootTimer);
      recentRareLootTimer = window.setTimeout(() => {
        if (recentRareLootId === loot.id) {
          recentRareLootId = "";
          renderedContainerSignature = "";
          renderContainerGrid(true);
        }
      }, 1250);
      renderedContainerSignature = "";
      renderContainerGrid(true);
    }

    function searchTimelineDuration(timeline) {
      return timeline.length ? timeline[timeline.length - 1].end : 0;
    }

    function searchScanSnapshot(now = performance.now()) {
      if (!searchState) return null;
      const elapsed = searchElapsed(now);
      const timeline = searchState.timeline || [];
      let currentIndex = timeline.findIndex((entry) => elapsed < entry.end);
      if (currentIndex < 0) currentIndex = timeline.length;
      const currentEntry = timeline[currentIndex] || null;
      const itemProgress = currentEntry
        ? clamp((elapsed - currentEntry.start) / currentEntry.duration, 0, 1)
        : 1;
      return {
        elapsed,
        currentIndex,
        itemProgress,
        revealedCount: Math.min(currentIndex, timeline.length),
        progress: searchState.duration > 0 ? clamp(elapsed / searchState.duration, 0, 1) : 1
      };
    }

    function containerSearchLockActive() {
      return Boolean(searchState && containerLoot.length);
    }

    function searchStateForContainerLoot(loot, index) {
      if (!containerSearchLockActive()) return { locked: false, current: false, revealed: true, progress: 1 };
      const snapshot = searchScanSnapshot();
      const lootIndex = searchState.drops.findIndex((entry) => entry === loot || entry.id === loot.id);
      if (lootIndex < 0) return { locked: false, current: false, revealed: true, progress: 1 };
      const order = lootIndex >= 0 ? lootIndex : index;
      const revealed = order < snapshot.revealedCount;
      const current = order === snapshot.currentIndex;
      return {
        locked: !revealed,
        current,
        revealed,
        progress: current ? snapshot.itemProgress : revealed ? 1 : 0
      };
    }

    function canMoveInventoryItem(source, index, loot = null) {
      if (runEnded) return false;
      if (source === "container") {
        const targetLoot = loot || containerLoot[index];
        return Boolean(targetLoot && searchStateForContainerLoot(targetLoot, index).revealed);
      }
      if (source === "bag") return Boolean(activeBackpack()[index]);
      if (source === "pouch") return Boolean(secretPouchItems[index]);
      return false;
    }

    function createSearchPlan(thing) {
      const firstTier = rollLootTier(thing);
      const rolledTotal = rollLootCount(thing);
      const total = thing.density === "boss" ? rolledTotal + 1 : rolledTotal;
      if (thing.density === "sss") {
        const drops = createSSSCollectionDrops(thing, total);
        appendAccessCardDrops(drops, thing);
        const timeline = createSearchTimeline(drops);
        return {
          duration: searchTimelineDuration(timeline),
          drops,
          timeline
        };
      }
      const drops = thing.density === "boss"
        ? [createBisonCoreDrop(thing, 0, total)]
        : [createLootDrop(thing, 0, total, firstTier)];
      for (let index = drops.length; index < total; index += 1) {
        drops.push(createLootDrop(thing, index, total));
      }
      appendAccessCardDrops(drops, thing);
      const timeline = createSearchTimeline(drops);
      return {
        duration: searchTimelineDuration(timeline),
        drops,
        timeline
      };
    }

    function cancelSearch(message = "搜索中断。回到目标旁可继续。") {
      if (!searchState) return false;
      const thing = searchState.thing;
      interruptedSearches.set(searchKey(thing), {
        duration: searchState.duration,
        drops: searchState.drops,
        timeline: searchState.timeline,
        elapsed: searchElapsed()
      });
      searchState = null;
      containerLoot.length = 0;
      pendingLoot = null;
      pendingLootQueue.length = 0;
      activeContainerName = "空";
      renderedContainerSignature = "";
      renderedPickupSignature = "";
      backpackModal.classList.remove("show");
      backpackModal.setAttribute("aria-hidden", "true");
      promptEl.innerHTML = `<strong>${thing.name}</strong>：${message}`;
      renderHud();
      return true;
    }

    function startSearch(thing) {
      const interrupted = interruptedSearchFor(thing);
      const plan = interrupted || createSearchPlan(thing);
      searchState = {
        thing,
        startedAt: performance.now(),
        elapsed: interrupted ? interrupted.elapsed : 0,
        duration: plan.duration,
        drops: plan.drops,
        timeline: plan.timeline || createSearchTimeline(plan.drops),
        renderedScanStep: "",
        celebratedRevealCount: 0
      };
      setContainerLoot(searchState.drops, thing.container || thing.name, false);
      interactButton.disabled = false;
      interactButton.textContent = "退出搜索";
      promptEl.innerHTML = interrupted
        ? `<strong>${thing.name}</strong>：继续检索。`
        : `<strong>${thing.name}</strong>：开始检索。`;
      playCombatCue("search", thing.x || player.x, thing.y || player.y, 0.68);
      renderHud();
      openBackpack();
    }

    function updateCurrentSearchProgress(progress) {
      const strip = containerGridEl.querySelector(".grid-item.search-current .search-progress-strip");
      if (strip) strip.style.setProperty("--scan-progress", progress.toFixed(3));
    }

    function updateSearch(now) {
      if (!searchState) return;
      const snapshot = searchScanSnapshot(now);
      searchFillEl.style.width = `${Math.round(snapshot.progress * 100)}%`;
      const stepKey = `${snapshot.currentIndex}:${snapshot.revealedCount}`;
      if (snapshot.revealedCount > (searchState.celebratedRevealCount || 0)) {
        for (let index = searchState.celebratedRevealCount || 0; index < snapshot.revealedCount; index += 1) {
          triggerRareLootEffect(searchState.drops[index]);
        }
        searchState.celebratedRevealCount = snapshot.revealedCount;
      }
      if (stepKey !== searchState.renderedScanStep) {
        searchState.renderedScanStep = stepKey;
        renderedContainerSignature = "";
        renderContainerGrid(true);
      }
      updateCurrentSearchProgress(snapshot.itemProgress);
      if (snapshot.progress >= 1) finishSearch();
    }

    function finishSearch() {
      if (!searchState) return;
      const searchedThing = searchState.thing;
      if (searchedThing.density === "ai" || searchedThing.density === "boss") {
        searchedThing.searched = true;
      } else {
        searchedThings.add(searchedThing.name);
      }
      recordParkingSearch(searchedThing);
      interruptedSearches.delete(searchKey(searchedThing));
      searchState = null;
      syncPendingLootFromContainer();
      promptEl.innerHTML = searchedThing.density === "sss"
        ? `<strong>${searchedThing.name}</strong> 解封完成。`
        : `<strong>${searchedThing.name}</strong> 搜索完成。`;
      if (searchedThing.density === "sss") worldEvent.notice = "🏛️ SSS高价值物资已解封。";
      applySearchRisk(pendingLoot?.tierId || 1);
      renderedContainerSignature = "";
      renderHud();
      if (searchedThing.density === "sss") checkSecondWaveTrigger();
    }

    function applySearchRisk(tierId) {
      if (runEnded) return;
      danger = clamp(danger + randomInt(7, 12) + tierId * 4, 0, 120);
    }

    function takePendingLoot() {
      if (searchState || !pendingLoot || runEnded) return;
      ensureBackpackLayout();
      const loot = pendingLoot;
      const result = placeLootInBackpack(loot);
      if (!result.placed) {
        promptEl.innerHTML = `${fieldContainerName()}剩 <strong>${backpackSpaceLeft()}</strong> 格，放不下。`;
        openBackpack();
        renderHud();
        return;
      }
      const index = containerLoot.indexOf(loot);
      if (index >= 0) containerLoot.splice(index, 1);
      activeBackpack().push(loot);
      renderedBagSignature = "";
      renderedContainerSignature = "";
      advancePendingLoot(result.arranged
        ? `整理后装入「${loot.item}」。`
        : `装入「${loot.item}」。`);
    }

    function leavePendingLoot() {
      if (searchState || !pendingLoot || runEnded) return;
      const loot = pendingLoot;
      const index = containerLoot.indexOf(loot);
      if (index >= 0) containerLoot.splice(index, 1);
      renderedContainerSignature = "";
      advancePendingLoot(`留下「${loot.item}」。`);
    }

    function advancePendingLoot(message) {
      syncPendingLootFromContainer();
      if (!pendingLoot) activeContainerName = "空";
      promptEl.innerHTML = pendingLoot ? `${message} 还有物品。` : `${message} 散落物已清。`;
      renderHud();
    }

    function discardBackpackItem(index) {
      const loot = activeBackpack()[index];
      if (!loot || runEnded) return;
      activeBackpack().splice(index, 1);
      delete loot.bagSlot;
      delete loot.orientation;
      if (searchState) {
        containerLoot.push(loot);
        pendingLoot = null;
        pendingLootQueue.length = 0;
      } else {
        containerLoot.unshift(loot);
        activeContainerName = "地面暂放";
        syncPendingLootFromContainer();
      }
      renderedBagSignature = "";
      renderedContainerSignature = "";
      promptEl.innerHTML = `丢下「${loot.item}」，空出 ${itemSize(loot)} 格。`;
      renderHud();
    }

    function openBackpack(owner = activeBackpackOwner) {
      setActiveBackpackOwner(owner);
      backpackModal.classList.add("show");
      backpackModal.setAttribute("aria-hidden", "false");
      renderCardPack(true);
      renderBagList(true);
      renderSecretPouch(true);
      renderContainerGrid(true);
      renderItemDetail();
    }

    function closeBackpack() {
      if (searchState) {
        backpackModal.classList.remove("show");
        backpackModal.setAttribute("aria-hidden", "true");
        promptEl.innerHTML = `<strong>${searchState.thing.name}</strong> 检索中。`;
        renderHud();
        return;
      }
      if (containerLoot.length) {
        clearContainerLoot(`留下 ${containerLoot.length} 件散落物。`);
        renderHud();
      }
      backpackModal.classList.remove("show");
      backpackModal.setAttribute("aria-hidden", "true");
    }

    function activeExtractZones() {
      const zones = [extractZone];
      if (worldEvent.timedExtract?.left > 0) zones.push(worldEvent.timedExtract);
      return zones;
    }

    function nearbyExtractZone() {
      return activeExtractZones().find((zone) => Math.hypot(player.x - zone.x, player.y - zone.y) <= zone.r + 36) || null;
    }

    function isNearExtract() {
      return Boolean(nearbyExtractZone());
    }

    function extractRun(zone) {
      if (zone.vehiclePickup) {
        finishParkingRun(`<strong>${zone.name}</strong>：车灯扫过道闸，标准干员离开停车场。带回 ${allBackpackItems().length} 件。`);
        return;
      }
      const timedText = zone === worldEvent.timedExtract ? "限时撤离点" : zone.name;
      finishParkingRun(`<strong>${timedText}</strong>：撤离成功，带回 ${allBackpackItems().length} 件。`);
    }

    function dangerLabel() {
      if (danger >= 90) return "危险";
      if (danger >= 58) return "紧张";
      if (danger >= 28) return "警觉";
      return "平静";
    }

    function saveActiveInvestigatorHealth() {
      if (!investigatorHealth[selectedCharacter]) return;
      investigatorHealth[selectedCharacter].hp = clamp(player.hp, 0, player.maxHp);
      investigatorHealth[selectedCharacter].maxHp = player.maxHp;
    }

    function loadInvestigatorHealth(characterId) {
      const expectedMaxHp = investigatorMaxHp(characterId);
      const health = investigatorHealth[characterId] || { hp: expectedMaxHp, maxHp: expectedMaxHp };
      const storedMaxHp = Number(health.maxHp || expectedMaxHp);
      const storedHp = Number(health.hp ?? expectedMaxHp);
      const hpRatio = storedMaxHp > 0 ? clamp(storedHp / storedMaxHp, 0, 1) : 1;
      player.maxHp = expectedMaxHp;
      player.hp = clamp(Math.round(expectedMaxHp * hpRatio), 0, expectedMaxHp);
      player.hurtCooldown = 0;
    }

    function resetInvestigatorHealth() {
      selectedCharacterTeam.forEach((characterId) => {
        const maxHp = investigatorMaxHp(characterId);
        investigatorHealth[characterId] = { hp: maxHp, maxHp };
      });
      selectedCharacter = selectedCharacterTeam[0] || "hero";
      loadInvestigatorHealth(selectedCharacter);
      lastHeroTrailX = player.x;
      lastHeroTrailY = player.y;
      lastCatTrailX = player.x;
      lastCatTrailY = player.y;
      lastEggTrailX = player.x;
      lastEggTrailY = player.y;
      lastNightTrailX = player.x;
      lastNightTrailY = player.y;
      switchInvestigatorCooldownLeft = 0;
    }

    function nextInvestigatorId() {
      if (selectedCharacterTeam.length <= 1) return "";
      const currentIndex = Math.max(0, selectedCharacterTeam.indexOf(selectedCharacter));
      return selectedCharacterTeam[(currentIndex + 1) % selectedCharacterTeam.length] || "";
    }

    function canSwitchInvestigator(force = false) {
      if (selectedCharacterTeam.length <= 1) return false;
      if (force) return true;
      return !runEnded &&
        !searchState &&
        !pendingLoot &&
        !backpackModal.classList.contains("show") &&
        !catExecutionState &&
        !nightAfterimage &&
        switchInvestigatorCooldownLeft <= 0;
    }

    function switchInvestigator(targetId = "", options = {}) {
      const force = Boolean(options.force);
      const nextId = targetId || nextInvestigatorId();
      if (!nextId || nextId === selectedCharacter || !selectedCharacterTeam.includes(nextId)) return false;
      if (!canSwitchInvestigator(force)) {
        if (!force && switchInvestigatorCooldownLeft > 0) {
          promptEl.innerHTML = `<strong>干员切换</strong> 还要 ${Math.ceil(switchInvestigatorCooldownLeft)} 秒。`;
          renderHud();
        }
        return false;
      }
      saveActiveInvestigatorHealth();
      if (selectedCharacter === "egg") stopEggBeam();
      if (selectedCharacter === "hathor") extendHathorFieldAfterChange();
      if (selectedCharacter === "night" && force) nightAfterimage = null;
      selectedCharacter = nextId;
      loadInvestigatorHealth(selectedCharacter);
      lastHeroTrailX = player.x;
      lastHeroTrailY = player.y;
      lastCatTrailX = player.x;
      lastCatTrailY = player.y;
      lastEggTrailX = player.x;
      lastEggTrailY = player.y;
      lastNightTrailX = player.x;
      lastNightTrailY = player.y;
      switchInvestigatorCooldownLeft = force ? 0.35 : switchInvestigatorCooldownSeconds;
      heroOrbIdleStillTime = 0;
      heroOrbFocusProgress = 0;
      heroOrbSpinBoostActive = false;
      const character = characterDisplayInfo(selectedCharacter);
      hitBursts.push({ x: player.x, y: player.y, age: 0, label: character.symbol || "换" });
      promptEl.innerHTML = options.downed
        ? `<strong>${character.name}</strong> 接替上场。`
        : `<strong>${character.name}</strong> 上场。`;
      renderHud();
      return true;
    }

    function switchToAliveInvestigatorAfterDown() {
      investigatorHealth[selectedCharacter] = { hp: 0, maxHp: player.maxHp };
      const nextId = selectedCharacterTeam.find((characterId) => characterId !== selectedCharacter && (investigatorHealth[characterId]?.hp || 0) > 0);
      return nextId ? switchInvestigator(nextId, { force: true, downed: true }) : false;
    }

    function teamHealthText() {
      const character = characterDisplayInfo(selectedCharacter);
      const activeText = `${character.name} ${Math.ceil(player.hp)}/${player.maxHp}`;
      const teammateText = selectedCharacterTeam
        .filter((characterId) => characterId !== selectedCharacter)
        .map((characterId) => {
          const teammate = characterDisplayInfo(characterId);
          const health = investigatorHealth[characterId] || { hp: player.maxHp };
          return `${teammate.symbol}${Math.ceil(health.hp || 0)}`;
        })
        .join(" · ");
      return teammateText ? `${activeText} · ${teammateText}` : activeText;
    }

    function currentCharacterSkills() {
      const character = characterDefs[selectedCharacter] || characterDefs.hero;
      let skills = Array.isArray(character.skills)
        ? character.skills.filter((skill) => typeof skill.unlocked !== "function" || skill.unlocked())
        : [];
      if (selectedCharacter === "hathor") skills = skills.map(hathorSkillForCurrentForm);
      if (activePetDef) {
        skills.push({
          id: `pet-${selectedPet}`,
          name: activePetDef.skillName,
          short: activePetDef.skillShort,
          icon: activePetDef.icon,
          pet: true,
          accentColor: activePetDef.markColor || activePetDef.color,
          keyLabel: "F",
          activeLabel: selectedPet === "guard" ? `盾${Math.ceil(petState.shield)}` : "发动",
          cooldownLeft: () => petState.activeLeft > 0 ? petState.activeLeft : petState.cooldownLeft,
          cooldownMax: () => petState.activeLeft > 0 ? petDurationSeconds() : petCooldownMaxSeconds(),
          active: () => petState.activeLeft > 0
        });
      }
      if (selectedCharacterTeam.length > 1) {
        const nextId = nextInvestigatorId();
        const nextCharacter = characterDisplayInfo(nextId);
        skills.push({
          id: "team-switch",
          name: "切换干员",
          short: nextCharacter.symbol || "切换",
          icon: "switch",
          teamSwitch: true,
          keyLabel: "Tab",
          accentColor: nextCharacter.iconColor || "#c7a96b",
          cooldownLeft: () => switchInvestigatorCooldownLeft,
          cooldownMax: () => switchInvestigatorCooldownSeconds
        });
      }
      return skills;
    }

    function skillCooldownLeft(skill) {
      if (typeof skill.cooldownLeft !== "function") return 0;
      return Math.max(0, Number(skill.cooldownLeft() || 0));
    }

    function skillCooldownMax(skill) {
      if (typeof skill.cooldownMax !== "function") return 0;
      return Math.max(0, Number(skill.cooldownMax() || 0));
    }

    function skillIsActive(skill) {
      return typeof skill.active === "function" ? Boolean(skill.active()) : false;
    }

    function skillCharges(skill) {
      if (typeof skill.charges !== "function") return null;
      const charges = Math.max(0, Number(skill.charges() || 0));
      const maxCharges = typeof skill.maxCharges === "function"
        ? Math.max(1, Number(skill.maxCharges() || 1))
        : 1;
      return { charges, maxCharges };
    }

    function skillState(skill) {
      const cooldownLeft = skillCooldownLeft(skill);
      const cooldownMax = skillCooldownMax(skill);
      const passive = Boolean(skill.passive);
      const active = skillIsActive(skill);
      const chargeState = skillCharges(skill);
      return {
        ...skill,
        cooldownLeft,
        cooldownMax,
        charges: chargeState?.charges ?? null,
        maxCharges: chargeState?.maxCharges ?? null,
        passive,
        active,
        ready: passive || cooldownLeft <= 0 || (chargeState && chargeState.charges > 0),
        cooldownRatio: cooldownMax > 0 ? clamp(cooldownLeft / cooldownMax, 0, 1) : 0
      };
    }

    function skillStatusText() {
      const states = currentCharacterSkills().map(skillState);
      if (!states.length) return "待命";
      return states.map((skill) => {
        if (skill.passive) return skill.short || skill.name;
        if (skill.maxCharges > 1) {
          return skill.charges > 0
            ? `${skill.short || skill.name}${skill.charges}/${skill.maxCharges}`
            : `${skill.short || skill.name}${Math.ceil(skill.cooldownLeft)}秒`;
        }
        return skill.cooldownLeft > 0
          ? `${skill.short || skill.name}${Math.ceil(skill.cooldownLeft)}秒`
          : skill.short || skill.name;
      }).join(" · ");
    }

    function passiveStatusText() {
      const passiveSkills = currentCharacterSkills().map(skillState).filter((skill) => skill.passive);
      const labels = passiveSkills.map((skill) => {
        const name = skill.short || skill.name;
        return skill.active ? `${name}中` : name;
      });
      const trailStyle = activeTrailStyle();
      if (trailStyle) labels.push(trailStyle.name);
      if (hasHeroDualCoreOrbsEquipped()) labels.push("虚实双核");
      if (hasHeroStarshineOuterOrbsEquipped()) labels.push("星辉");
      if (hasVictoryBirdEquipped()) labels.push("战绩播报");
      if (hasCatSilverTrail()) labels.push("残影拖尾");
      if (hasEggFrostTrailEquipped()) labels.push("冰霜拖尾");
      if (hasEggSnowflakeTrailEquipped()) labels.push("雪花芯");
      if (hasNightMirrorTrailEquipped()) labels.push(nightBloodActive() ? "赤镜拖尾" : "镜光拖尾");
      return labels.length ? labels.join("，") : "无";
    }

    function skillIconHtml(icon) {
      const knownIcons = new Set(["orbs", "teleport", "claw", "execute", "beam", "iceball", "mirror", "bloodmirror", "moonblade", "shade", "switch", "pet-damage", "pet-heal", "pet-shield", "pet-cool"]);
      const safeIcon = knownIcons.has(icon) ? icon : "orbs";
      if (safeIcon === "claw") return `<span class="skill-icon skill-icon-claw" aria-hidden="true"><i></i><i></i><i></i></span>`;
      return `<span class="skill-icon skill-icon-${safeIcon}" aria-hidden="true"></span>`;
    }

    function skillKeyHtml(skill) {
      const keyLabel = skill.keyLabel || (skill.passive ? "被动" : "");
      if (!keyLabel) return "";
      const keyClass = skill.passive ? "skill-key passive-key" : "skill-key";
      return `<span class="${keyClass}">${escapeHtml(keyLabel)}</span>`;
    }

    function renderSkillDock(force = false) {
      const states = currentCharacterSkills().map(skillState);
      const signature = states.map((skill) => [
        skill.id,
        skill.ready ? 1 : 0,
        skill.active ? 1 : 0,
        skill.charges ?? "-",
        skill.maxCharges ?? "-",
        Math.ceil(skill.cooldownLeft),
        Math.round(skill.cooldownRatio * 20)
      ].join(":")).join("|");
      if (!force && signature === renderedSkillDockSignature) return;
      renderedSkillDockSignature = signature;
      skillDockEl.innerHTML = states.map((skill) => {
        const classes = [
          "skill-chip",
          skill.ready ? "ready" : "cooling",
          skill.passive ? "passive" : "",
          skill.accentColor ? "accent-skill" : "",
          skill.pet ? "pet-skill" : "",
          skill.active ? "active" : ""
        ].filter(Boolean).join(" ");
        const timer = skill.passive
          ? skill.active ? "发动" : "常驻"
          : skill.active && skill.activeLabel
            ? skill.activeLabel
          : skill.maxCharges > 1
            ? skill.charges > 0
              ? `${skill.charges}/${skill.maxCharges}`
              : `${Math.ceil(skill.cooldownLeft)}`
          : skill.cooldownLeft > 0
            ? `${Math.ceil(skill.cooldownLeft)}`
            : "好了";
        const cooldownText = skill.passive
          ? skill.active ? "正在发动" : "常驻"
          : skill.active && skill.activeLabel
            ? `正在${skill.activeLabel}`
          : skill.maxCharges > 1
            ? skill.charges > 0
              ? `已储存 ${skill.charges}/${skill.maxCharges}`
              : `冷却剩余 ${Math.ceil(skill.cooldownLeft)} 秒`
          : skill.cooldownLeft > 0
            ? `冷却剩余 ${Math.ceil(skill.cooldownLeft)} 秒`
            : "可以使用";
        const keyText = skill.keyLabel ? `按键 ${skill.keyLabel}，` : "";
        return `
          <div class="${classes}" style="--cooldown-progress:${(skill.cooldownRatio * 100).toFixed(1)}%;${skill.accentColor ? `--skill-accent:${escapeHtml(skill.accentColor)};` : ""}" aria-label="${escapeHtml(skill.name)}，${escapeHtml(keyText)}${cooldownText}" title="${escapeHtml(skill.name)} · ${escapeHtml(keyText)}${cooldownText}">
            ${skillKeyHtml(skill)}
            ${skillIconHtml(skill.icon)}
            <span class="skill-label">${escapeHtml(skill.short || skill.name)}</span>
            <span class="skill-timer">${escapeHtml(timer)}</span>
          </div>
        `;
      }).join("");
    }

    function containerNameText() {
      return runLoadout.backpack > 0 ? "背包" : "口袋";
    }

    function nearbySearchTarget() {
      if (nearbyNpc?.dead && !nearbyNpc.searched) return nearbyNpc;
      if (nearbyThing && nearbyThing.type !== "exit" && nearbyThing.type !== "lore" && nearbyThing.type !== "eventBreaker" && !searchedThings.has(nearbyThing.name) && lockedThingUnlocked(nearbyThing)) {
        return nearbyThing;
      }
      return null;
    }

    function renderHud() {
      const used = backpackUsed();
      const limit = fieldContainerLimit();
      const currentExtract = nearbyExtractZone();
      const nearExtract = Boolean(currentExtract);
      const pausedTarget = !searchState && !pendingLoot ? nearbySearchTarget() : null;
      const pausedProgress = pausedTarget ? interruptedProgressFor(pausedTarget) : 0;
      const totalUsed = localCoopEnabled ? backpackUsedFor(1) + backpackUsedFor(2) : used;
      bagReadoutEl.textContent = localCoopEnabled ? `${backpackUsedFor(1)} + ${backpackUsedFor(2)} / 40` : `${used} / ${limit}`;
      backpackTopEl.textContent = localCoopEnabled ? `${totalUsed}/40` : `${used}/${limit}`;
      backpackCapacityEl.textContent = localCoopEnabled ? `${fieldContainerName()} ${used}/${limit}` : `${used}/${limit}`;
      bagGridReadoutEl.textContent = `${used} / ${limit}`;
      backpackTitleEl.textContent = `${containerNameText()}物品`;
      backpackNoteEl.textContent = pendingLoot
        ? `${activeContainerName}：${containerLoot.length} 件`
        : localCoopEnabled ? `${fieldContainerName()}：${used}/${limit} · 总 ${totalUsed}/40` : `${fieldContainerName()}：${limit} 格`;
      if (searchState) {
        const snapshot = searchScanSnapshot();
        const total = searchState.drops.length;
        const current = Math.min(total, snapshot.currentIndex + 1);
        backpackNoteEl.textContent = `${activeContainerName}：检索 ${current} / ${total}`;
      }
      containerReadoutEl.textContent = fieldContainerName();
      armorReadoutEl.textContent = `${armorConfigs[armorTier].name} · 减伤 ${armorReductionText()}`;
      const shieldParts = [];
      if (petState.shield > 0) shieldParts.push(`盾${Math.ceil(petState.shield)}`);
      if (hathorShield > 0) shieldParts.push(`脉冲${Math.ceil(hathorShield)}`);
      healthReadoutEl.textContent = shieldParts.length
        ? `${teamHealthText()} · ${shieldParts.join(" · ")}`
        : teamHealthText();
      skillReadoutEl.textContent = skillStatusText();
      passiveReadoutEl.textContent = passiveStatusText();
      renderSkillDock();
      dangerReadoutEl.textContent = pvpState.enabled
        ? `模拟训练 ${pvpState.playerWins}:${pvpState.opponentWins} · 第${pvpState.round}局`
        : dangerLabel();
      extractButton.disabled = pvpState.enabled || runEnded || Boolean(searchState) || Boolean(pendingLoot) || !nearExtract;
      extractButton.textContent = pvpState.enabled
        ? "模拟训练"
        : nearExtract
          ? currentExtract.vehiclePickup ? "登上载具" : "确认撤离"
          : "前往撤离点";
      scanOrbEl.classList.remove("active");
      if (!searchState) searchFillEl.style.width = pausedProgress ? `${Math.round(pausedProgress * 100)}%` : "0%";
      if (runEnded) {
        renderPickupChoice();
        renderCardPack();
        renderBagList();
        renderSecretPouch();
        renderContainerGrid();
        return;
      }

      if (searchState) {
        const snapshot = searchScanSnapshot();
        const total = searchState.drops.length;
        const current = Math.min(total, snapshot.currentIndex + 1);
        searchTitleEl.textContent = searchState.thing.name;
        searchHintEl.textContent = `检索 ${current} / ${total}。`;
      } else if (pendingLoot) {
        searchTitleEl.textContent = pendingLoot.item;
        searchHintEl.textContent = `${pendingLoot.container} · ${pendingLoot.category}`;
      } else if (nearbyPvpTarget) {
        searchTitleEl.textContent = pvpState.opponentName;
        searchHintEl.textContent = `生命 ${Math.ceil(pvpOpponent.hp)}/${pvpOpponent.maxHp}。E 重击。`;
      } else if (nearbyNpc) {
        searchTitleEl.textContent = nearbyNpc.name;
        searchHintEl.textContent = nearbyNpc.dead
          ? nearbyNpc.searched
            ? "已搜过。"
            : pausedProgress
              ? `继续搜索，${Math.round(pausedProgress * 100)}%。`
              : "可搜索。"
          : nearbyNpc.isBoss
            ? `Boss ${Math.ceil(nearbyNpc.hp)}/${nearbyNpc.maxHp}${nearbyNpc.phase === 2 ? " · 二阶段" : ""}`
            : nearbyNpc.guardian
              ? `守护者 ${Math.ceil(nearbyNpc.hp)}/${nearbyNpc.maxHp}`
            : nearbyNpc.attackType === "ranged" ? "远程人机。" : "近战人机。";
      } else if (nearbyThing?.type === "eventBreaker") {
        searchTitleEl.textContent = nearbyThing.name;
        searchHintEl.textContent = worldEvent.blackoutRestoring
          ? "合闸中。"
          : worldEvent.blackoutActive ? "E 修理电闸。" : "电力恢复。";
      } else if (nearbyThing?.type === "lore") {
        searchTitleEl.textContent = nearbyThing.name;
        searchHintEl.textContent = investigatedThings.has(nearbyThing.name) ? "可查看。" : "靠近查看。";
      } else if (nearbyThing && nearbyThing.type !== "exit" && !searchedThings.has(nearbyThing.name)) {
        searchTitleEl.textContent = nearbyThing.name;
        searchHintEl.textContent = nearbyThing.lockedCard && !lockedThingUnlocked(nearbyThing)
          ? `需要${lockedThingCardName(nearbyThing)}。`
          : pausedProgress
          ? `继续搜索，${Math.round(pausedProgress * 100)}%。`
          : investigatedThings.has(nearbyThing.name) ? "可搜索。" : "先调查。";
      } else if (nearExtract) {
        searchTitleEl.textContent = currentExtract.name;
        searchHintEl.textContent = currentExtract === worldEvent.timedExtract
          ? `剩 ${Math.ceil(currentExtract.left)} 秒。`
          : currentExtract.vehiclePickup
            ? "通道已开放。确认后离开停车场。"
            : "可撤离。";
      } else {
        searchTitleEl.textContent = pvpState.enabled ? `模拟训练 ${pvpState.playerWins} : ${pvpState.opponentWins}` : "等待目标";
        searchHintEl.textContent = pvpState.enabled
          ? `第 ${pvpState.round} 局，击倒对手。`
          : eventStatusText() || "靠近可疑点。";
      }

      renderPickupChoice();
      renderCardPack();
      renderBagList();
      renderSecretPouch();
      renderContainerGrid();
    }

    function renderPickupChoice() {
      if (!pendingLoot) {
        renderedPickupSignature = "";
        pickupCardEl.hidden = true;
        pickupCardEl.innerHTML = "";
        return;
      }
      const fits = canFitBackpack(pendingLoot);
      const signature = `${pendingLoot.id}:${fits}:${pendingLoot.dropIndex}:${containerLoot.length}`;
      if (signature === renderedPickupSignature) return;
      renderedPickupSignature = signature;
      const dropText = pendingLoot.dropTotal > 1 ? `第 ${pendingLoot.dropIndex} / ${pendingLoot.dropTotal} 件` : "发现 1 件";
      pickupCardEl.hidden = false;
      pickupCardEl.innerHTML = `
        <div class="search-copy">
          <strong>${pendingLoot.item}</strong>
          <em>${pendingLoot.detail}</em>
          <span class="${pendingLoot.className}">${dropText} · ${pendingLoot.tier} · ${itemFormatText(pendingLoot)} · ${itemSize(pendingLoot)} 格 · ${itemValue(pendingLoot)} 行动币</span>
        </div>
        <div class="pickup-actions">
          <button type="button" data-pickup="take" ${fits ? "" : "disabled"}>${fits ? "捡起" : "放不下"}</button>
          <button type="button" data-pickup="leave">不捡</button>
        </div>
      `;
    }

    function renderBagList(force = false) {
      ensureBackpackLayout();
      syncInventoryGridSizing();
      const limit = fieldContainerLimit();
      const columns = inventoryColumnCount();
      const signature = `${activeBackpackOwner}|${limit}|${columns}|${sharedInventoryCellSize.toFixed(2)}|${activeBackpack().map((loot) => `${loot.id}:${loot.item}:${itemFormatText(loot)}:${itemSize(loot)}:${loot.bagSlot}:${itemOrientation(loot)}`).join("|")}`;
      if (!force && signature === renderedBagSignature) return;
      renderedBagSignature = signature;
      bagListEl.style.setProperty("--grid-columns", columns);
      const slots = Array.from({ length: limit }, (_, slot) => `<div class="grid-slot" data-bag-slot="${slot}" style="${slotStyle(slot, undefined, columns)}"></div>`).join("");
      const items = activeBackpack().map((loot, index) => gridItemHtml(loot, index, "bag", Number(loot.bagSlot))).join("");
      bagListEl.innerHTML = `${slots}${items}`;
    }

    function slotStyle(slot, footprint = { width: 1, height: 1 }, columns = inventoryColumnCount()) {
      const row = Math.floor(slot / columns) + 1;
      const col = slot % columns + 1;
      return `grid-column: ${col} / span ${footprint.width}; grid-row: ${row} / span ${footprint.height};`;
    }

    function gridItemHtml(loot, index, source, slot) {
      const footprint = source === "pouch"
        ? pouchItemFootprint(loot, loot.pouchOrientation || itemOrientation(loot))
        : itemFootprint(loot);
      const searchLock = source === "container" ? searchStateForContainerLoot(loot, index) : { locked: false, current: false, revealed: true, progress: 1 };
      const selectedClass = selectedLootId === loot.id && searchLock.revealed ? " selected" : "";
      const tierId = Math.max(1, Math.min(6, Number(loot.tierId || 1)));
      const label = searchLock.revealed
        ? escapeHtml(`${loot.item}，${loot.tier}，${itemFormatText(loot)}，${itemSize(loot)}格，点击查看详情`)
        : "未知物资，正在检索";
      const columns = source === "container" ? looseInventoryColumns : source === "pouch" ? secretPouchColumns : inventoryColumnCount();
      const classes = [
        "grid-item",
        `tier-box-${searchLock.revealed ? tierId : 1}`,
        selectedClass.trim(),
        searchLock.locked ? "search-concealed" : "",
        searchLock.current ? "search-current" : "",
        searchLock.revealed && recentRareLootId === loot.id ? "rare-just-revealed" : ""
      ].filter(Boolean).join(" ");
      const scanSpeed = tierId <= 2 ? 760 : tierId === 3 ? 940 : tierId === 4 ? 1120 : tierId === 5 ? 1320 : 1480;
      const searchHud = searchLock.current
        ? `<span class="search-lens" aria-hidden="true"></span><span class="search-progress-strip" style="--scan-progress:${searchLock.progress.toFixed(3)}" aria-hidden="true"></span>`
        : "";
      const canDrag = canMoveInventoryItem(source, index, loot);
      return `
