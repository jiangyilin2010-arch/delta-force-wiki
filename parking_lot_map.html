        <article class="${classes}" draggable="${canDrag ? "true" : "false"}" data-drag-source="${source}" data-loot-index="${index}" data-loot-id="${escapeHtml(loot.id)}" aria-label="${label}" title="${label}" style="${slotStyle(slot, footprint, columns)} --item-scan-speed:${scanSpeed}ms;">${searchLock.revealed && tierId === 6 ? redSketchHtml(loot) : ""}${searchHud}</article>
      `;
    }

    function redSketchHtml(loot) {
      if (loot.special === "sssCollection") {
        return `<svg class="red-sketch" viewBox="0 0 44 36" aria-hidden="true"><path d="M8 28h28M12 28l4-16h12l4 16M18 12l4-5 4 5M18 20h8"/></svg>`;
      }
      if (loot.category === "汽车配件") {
        return `<svg class="red-sketch" viewBox="0 0 44 36" aria-hidden="true"><path d="M9 25h26l-3-9H14l-5 9Z"/><circle cx="16" cy="27" r="3"/><circle cx="30" cy="27" r="3"/><path d="M17 16l3-5h8l3 5"/></svg>`;
      }
      if (loot.category === "钥匙房卡") {
        return `<svg class="red-sketch" viewBox="0 0 44 36" aria-hidden="true"><circle cx="15" cy="18" r="6"/><path d="M21 18h14M29 18v5M34 18v-4"/></svg>`;
      }
      if (loot.category === "食品") {
        return `<svg class="red-sketch" viewBox="0 0 44 36" aria-hidden="true"><rect x="12" y="10" width="20" height="18" rx="3"/><path d="M16 10v18M28 10v18M18 16h8M18 22h8"/></svg>`;
      }
      return `<svg class="red-sketch" viewBox="0 0 44 36" aria-hidden="true"><path d="M22 7l11 8v13H11V15l11-8Z"/><path d="M16 28v-9h12v9M14 16h16"/></svg>`;
    }

    function layoutContainerLoot() {
      const totalSize = containerLoot.reduce((sum, loot) => sum + itemSize(loot), 0);
      const columns = looseInventoryColumns;
      let limit = Math.max(columns * 4, Math.ceil(Math.max(totalSize, 1) / columns) * columns);
      const occupied = new Set();
      const layout = [];
      containerLoot.forEach((loot) => {
        const orientation = itemOrientation(loot);
        let placed = 0;
        let placedSlots = null;
        while (!placedSlots) {
          for (let slot = 0; slot < limit; slot += 1) {
            const slots = packedPlacementSlots(slot, loot, orientation, limit, columns);
            if (!slots || slots.some((targetSlot) => occupied.has(targetSlot))) continue;
            placed = slot;
            placedSlots = slots;
            break;
          }
          if (!placedSlots) limit += columns;
        }
        placedSlots.forEach((slot) => occupied.add(slot));
        layout.push(placed);
      });
      return { limit, layout };
    }

    function renderContainerGrid(force = false) {
      syncInventoryGridSizing();
      const { limit, layout } = layoutContainerLoot();
      const columns = looseInventoryColumns;
      const signature = `${activeContainerName}|${limit}|${columns}|${sharedInventoryCellSize.toFixed(2)}|${containerLoot.map((loot, index) => `${loot.id}:${loot.item}:${itemFormatText(loot)}:${itemSize(loot)}:${layout[index]}`).join("|")}`;
      if (!force && signature === renderedContainerSignature) return;
      renderedContainerSignature = signature;
      containerGridEl.style.setProperty("--grid-columns", columns);
      containerGridTitleEl.textContent = containerLoot.length ? `${activeContainerName} · ${containerLoot.length}件` : "空";
      const slots = Array.from({ length: limit }, (_, slot) => `<div class="grid-slot" data-container-slot="${slot}" style="${slotStyle(slot, undefined, columns)}"></div>`).join("");
      const items = containerLoot.map((loot, index) => gridItemHtml(loot, index, "container", layout[index])).join("");
      containerGridEl.innerHTML = containerLoot.length ? `${slots}${items}` : `${slots}<p class="grid-empty">空</p>`;
    }

    function selectedLoot() {
      if (!selectedLootId) return null;
      return activeBackpack().find((loot) => loot.id === selectedLootId) ||
        secretPouchItems.find((loot) => loot.id === selectedLootId) ||
        containerLoot.find((loot) => loot.id === selectedLootId) ||
        null;
    }

    function selectedAccessCard() {
      if (!selectedCardId) return null;
      return cardPack.find((card) => card?.id === selectedCardId) ||
        allBackpackItems().find((loot) => loot?.special === "accessCard" && loot.id === selectedCardId) ||
        containerLoot.find((loot) => loot?.special === "accessCard" && loot.id === selectedCardId) ||
        null;
    }

    function materialText(loot) {
      const entries = Object.entries(loot.materials || {}).filter(([, amount]) => Number(amount) > 0);
      if (!entries.length) return "";
      return entries
        .map(([name, amount]) => `${materialDefs[name] || name}x${amount}`)
        .join("、");
    }

    function renderItemDetail(loot = selectedLoot()) {
      const card = loot?.special === "accessCard" ? loot : selectedAccessCard();
      if (card) {
        const normalized = normalizeAccessCard(card);
        const lines = accessCardDetailLines(normalized);
        itemDetailEl.innerHTML = `
          <strong>${escapeHtml(normalized.item)}</strong>
          ${lines.map((line) => `<span class="${normalized.className}">${escapeHtml(line)}</span>`).join("")}
          <span>${escapeHtml(normalized.detail || "这是一张互动卡。")}</span>
        `;
        return;
      }
      if (!loot) {
        itemDetailEl.innerHTML = `<strong>物品介绍</strong><span>点击物品查看。</span>`;
        return;
      }
      const mats = materialText(loot);
      itemDetailEl.innerHTML = `
        <strong>${escapeHtml(loot.item)}</strong>
        <span class="${loot.className}">${escapeHtml(loot.tier)} · ${itemFormatText(loot)} · ${itemSize(loot)}格 · ${itemValue(loot)}行动币 · ${escapeHtml(loot.category || "物品")}</span>
        <span>${escapeHtml(loot.detail || "没有更多说明。")}</span>
        ${mats ? `<span>材料：${escapeHtml(mats)}</span>` : ""}
      `;
    }

    function renderCardPack(force = false) {
      const signature = `${selectedCardId}|${cardPack.map((card) => `${card.id}:${card.type}:${card.quality}:${card.uses}`).join("|")}`;
      if (!force && signature === renderedCardPackSignature) return;
      renderedCardPackSignature = signature;
      const cardSlots = [...cardPack];
      while (cardSlots.length < cardPackSlots) cardSlots.push(null);
      cardPackEl.innerHTML = `
        <div class="card-pack-head">
          <span>卡包</span>
          <strong>${cardPack.length} / ${cardPackSlots}</strong>
        </div>
        <div class="card-pack-list">
          ${cardSlots.map((card, index) => card ? `
            <div class="card-chip found tier-${card.tierId}${selectedCardId === card.id ? " selected" : ""}" data-card-index="${index}" data-card-id="${escapeHtml(card.id)}" title="${escapeHtml(card.item)} · ${card.uses}次 · ${Math.round(accessCardSuccessRate(card) * 100)}%">
              <span>${escapeHtml(card.item)}</span>
              <b>${escapeHtml(accessCardLabel(card))}</b>
            </div>
          ` : `
            <div class="card-chip empty" data-card-index="${index}">
              <span>空卡位</span>
              <b></b>
            </div>
          `).join("")}
        </div>
      `;
    }

    function secretPouchUsed() {
      return secretPouchItems.reduce((sum, loot) => {
        const slots = pouchPlacementSlots(Number(loot.pouchSlot), loot, loot.pouchOrientation || itemOrientation(loot));
        return sum + (slots ? slots.length : Math.min(secretPouchSlots, itemSize(loot)));
      }, 0);
    }

    function renderSecretPouch(force = false) {
      secretPouchEl.classList.toggle("unlocked", secretPouchUnlocked);
      if (!secretPouchUnlocked) {
        secretPouchGridEl.innerHTML = "";
        secretPouchReadoutEl.textContent = "0 / 4";
        return;
      }
      syncInventoryGridSizing();
      const signature = `${sharedInventoryCellSize.toFixed(2)}|${secretPouchItems.map((loot) => `${loot.id}:${loot.item}:${itemFormatText(loot)}:${itemSize(loot)}:${loot.pouchSlot}:${loot.pouchOrientation || ""}`).join("|")}`;
      if (!force && signature === renderedSecretPouchSignature) return;
      renderedSecretPouchSignature = signature;
      secretPouchReadoutEl.textContent = `${secretPouchUsed()} / ${secretPouchSlots}`;
      const slots = Array.from({ length: secretPouchSlots }, (_, slot) => `<div class="grid-slot" data-pouch-slot="${slot}" style="${slotStyle(slot, undefined, secretPouchColumns)}"></div>`).join("");
      const items = secretPouchItems.map((loot, index) => gridItemHtml(loot, index, "pouch", Number(loot.pouchSlot))).join("");
      secretPouchGridEl.innerHTML = `${slots}${items}`;
    }

    function moveLootToSecretPouch(loot, source, index, targetSlot = null) {
      if (!secretPouchUnlocked || !loot || runEnded) return false;
      const placement = targetSlot === null
        ? firstFreePouchPlacement(loot)
        : firstPouchPlacementAtSlot(loot, Number(targetSlot), source === "pouch" ? loot : null);
      if (!placement) {
        promptEl.innerHTML = itemSize(loot) > secretPouchSlots
          ? "绝密档案袋放不下这么大的物品。"
          : "绝密档案袋没有合适空位。";
        renderHud();
        return false;
      }
      if (source === "bag") activeBackpack().splice(index, 1);
      if (source === "container") containerLoot.splice(index, 1);
      if (source === "pouch") {
        applyPouchPlacementToLoot(loot, placement);
      } else {
        applyPouchPlacementToLoot(loot, placement);
        secretPouchItems.push(loot);
      }
      if (source === "container") {
        if (searchState) {
          pendingLoot = null;
          pendingLootQueue.length = 0;
        } else {
          syncPendingLootFromContainer();
          if (!pendingLoot) activeContainerName = "空";
        }
      }
      renderedBagSignature = "";
      renderedContainerSignature = "";
      renderedSecretPouchSignature = "";
      promptEl.innerHTML = `你把「${loot.item}」塞进绝密档案袋。`;
      renderHud();
      return true;
    }

    function movePouchItemToBag(index, targetSlot = null) {
      const loot = secretPouchItems[index];
      if (!loot || runEnded) return false;
      const result = placeLootInBackpack(loot, targetSlot);
      if (!result.placed) {
        promptEl.innerHTML = `${fieldContainerName()}放不下「${loot.item}」。`;
        renderHud();
        return false;
      }
      secretPouchItems.splice(index, 1);
      delete loot.pouchSlot;
      delete loot.pouchOrientation;
      activeBackpack().push(loot);
      renderedBagSignature = "";
      renderedSecretPouchSignature = "";
      promptEl.innerHTML = `你把「${loot.item}」从绝密档案袋取回${fieldContainerName()}。`;
      renderHud();
      return true;
    }

    function moveBagItem(index, targetSlot) {
      if (searchState) {
        promptEl.innerHTML = "搜索时只能丢到右侧。";
        renderHud();
        return false;
      }
      ensureBackpackLayout();
      const loot = activeBackpack()[index];
      if (!loot || runEnded) return false;
      const placement = firstPlacementAtSlot(loot, Number(targetSlot), loot);
      if (!placement) {
        promptEl.innerHTML = `「${loot.item}」放不进这个位置。`;
        renderHud();
        return false;
      }
      applyPlacementToLoot(loot, placement);
      renderedBagSignature = "";
      promptEl.innerHTML = `你把「${loot.item}」挪到新的格子。`;
      renderHud();
      return true;
    }

    function moveContainerItemToBag(index, targetSlot = null) {
      ensureBackpackLayout();
      const loot = containerLoot[index];
      if (!loot || runEnded) return false;
      if (!canMoveInventoryItem("container", index, loot)) {
        promptEl.innerHTML = "尚未检索完成。";
        renderHud();
        return false;
      }
      if (tryPutCardInPack(loot)) {
        containerLoot.splice(index, 1);
        if (searchState) {
          pendingLoot = null;
          pendingLootQueue.length = 0;
        } else {
          syncPendingLootFromContainer();
          if (!pendingLoot) activeContainerName = "空";
        }
        renderedContainerSignature = "";
        promptEl.innerHTML = `你把「${loot.item}」放进卡包。`;
        renderHud();
        return true;
      }
      const result = placeLootInBackpack(loot, targetSlot);
      if (!result.placed) {
        promptEl.innerHTML = `${fieldContainerName()}放不下「${loot.item}」。`;
        renderHud();
        return false;
      }
      containerLoot.splice(index, 1);
      activeBackpack().push(loot);
      if (searchState) {
        pendingLoot = null;
        pendingLootQueue.length = 0;
      } else {
        syncPendingLootFromContainer();
        if (!pendingLoot) activeContainerName = "空";
      }
      renderedBagSignature = "";
      renderedContainerSignature = "";
      promptEl.innerHTML = result.arranged
        ? `你重新整理了${fieldContainerName()}，把「${loot.item}」装了进去。`
        : `你把「${loot.item}」装进${fieldContainerName()}。`;
      renderHud();
      return true;
    }

    function moveBagItemToContainer(index) {
      const loot = activeBackpack()[index];
      if (!loot || runEnded) return false;
      activeBackpack().splice(index, 1);
      delete loot.bagSlot;
      delete loot.orientation;
      if (searchState) {
        containerLoot.push(loot);
        pendingLoot = null;
        pendingLootQueue.length = 0;
      } else {
        containerLoot.unshift(loot);
        activeContainerName = "地面暂放";
        syncPendingLootFromContainer();
      }
      renderedBagSignature = "";
      renderedContainerSignature = "";
      promptEl.innerHTML = searchState
        ? `你把「${loot.item}」丢到右侧最底下，放大镜继续检索上面的物品。`
        : `你把「${loot.item}」丢到右侧散落物。`;
      renderHud();
      return true;
    }

    function movePouchItemToContainer(index) {
      const loot = secretPouchItems[index];
      if (!loot || runEnded) return false;
      secretPouchItems.splice(index, 1);
      delete loot.pouchSlot;
      delete loot.pouchOrientation;
      if (searchState) {
        containerLoot.push(loot);
        pendingLoot = null;
        pendingLootQueue.length = 0;
      } else {
        containerLoot.unshift(loot);
        activeContainerName = "地面暂放";
        syncPendingLootFromContainer();
      }
      renderedContainerSignature = "";
      renderedSecretPouchSignature = "";
      promptEl.innerHTML = searchState
        ? `你把「${loot.item}」从绝密档案袋丢到右侧最底下。`
        : `你把「${loot.item}」从绝密档案袋丢到右侧散落物。`;
      renderHud();
      return true;
    }

    function handleInventoryDragStart(event) {
      const item = event.target.closest("[data-drag-source]");
      if (!item || !event.dataTransfer) return;
      const source = item.dataset.dragSource;
      const index = Number(item.dataset.lootIndex);
      const loot = inventoryTarget(source, index, item.dataset.lootId || "").loot;
      if (!canMoveInventoryItem(source, index, loot)) {
        event.preventDefault();
        promptEl.innerHTML = source === "container"
          ? "这件物资还没检索完成，暂时不能拿走。"
          : "现在不能移动这件物品。";
        renderHud();
        return;
      }
      activeDragPayload = {
        source,
        index
      };
      inventoryDropHandled = false;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("application/x-miwenguan-loot", JSON.stringify(activeDragPayload));
    }

    function lootForDragPayload(payload) {
      if (!payload) return null;
      if (payload.source === "bag") return activeBackpack()[payload.index] || null;
      if (payload.source === "pouch") return secretPouchItems[payload.index] || null;
      if (payload.source === "container") return containerLoot[payload.index] || null;
      return null;
    }

    function slotFromGridEvent(grid, event) {
      const rect = grid.getBoundingClientRect();
      if (!rect.width || !rect.height) return -1;
      const columns = gridColumnsForElement(grid);
      const sampleSlot = grid.querySelector(".grid-slot");
      const sampleRect = sampleSlot?.getBoundingClientRect();
      const cellWidth = sampleRect?.width || 36;
      const rowHeight = sampleRect?.height || 36;
      const x = clamp(event.clientX - rect.left, 0, rect.width - 1);
      const y = Math.max(0, event.clientY - rect.top + grid.scrollTop);
      const column = clamp(Math.floor(x / cellWidth), 0, columns - 1);
      const row = Math.floor(y / rowHeight);
      return row * columns + column;
    }

    function clearDropHover() {
      document.querySelectorAll(".grid-slot.drop-hover").forEach((slot) => slot.classList.remove("drop-hover"));
    }

    function highlightPlacement(grid, startSlot, payload) {
      const loot = lootForDragPayload(payload);
      if (!grid || !loot || startSlot < 0) return;
      const ignoreLoot = payload?.source === "bag" ? loot : null;
      const placement = firstPlacementAtSlot(loot, startSlot, ignoreLoot);
      if (!placement) return;
      const slots = placementSlots(placement.slot, loot, placement.orientation) || [];
      slots.forEach((slot) => {
        grid.querySelector(`[data-bag-slot="${slot}"]`)?.classList.add("drop-hover");
      });
    }

    function handleInventoryDragOver(event) {
      const bagGrid = event.target.closest("#bagList");
      const pouchGrid = event.target.closest("#secretPouchGrid");
      const looseGrid = event.target.closest("#containerGrid");
      if (!bagGrid && !pouchGrid && !looseGrid) return;
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
      clearDropHover();
      if (bagGrid) {
        const slot = slotFromGridEvent(bagGrid, event);
        highlightPlacement(bagGrid, slot, activeDragPayload);
      } else if (pouchGrid) {
        const slot = slotFromGridEvent(pouchGrid, event);
        const loot = lootForDragPayload(activeDragPayload);
        const placement = loot ? firstPouchPlacementAtSlot(loot, slot, activeDragPayload?.source === "pouch" ? loot : null) : null;
        if (loot && placement) {
          (pouchPlacementSlots(placement.slot, loot, placement.orientation) || []).forEach((targetSlot) => {
            pouchGrid.querySelector(`[data-pouch-slot="${targetSlot}"]`)?.classList.add("drop-hover");
          });
        }
      }
    }

    function handleInventoryDragLeave(event) {
      const grid = event.target.closest("#bagList, #containerGrid, #secretPouchGrid");
      if (grid && !grid.contains(event.relatedTarget)) clearDropHover();
    }

    function handleInventoryDrop(event) {
      const raw = event.dataTransfer?.getData("application/x-miwenguan-loot");
      event.preventDefault();
      clearDropHover();
      let payload = activeDragPayload;
      if (raw) {
        try {
          payload = JSON.parse(raw);
        } catch {
          payload = activeDragPayload;
        }
      }
      activeDragPayload = null;
      if (!payload) {
        return;
      }
      const bagGrid = event.target.closest("#bagList");
      const pouchGrid = event.target.closest("#secretPouchGrid");
      const containerTarget = event.target.closest("#containerGrid");
      if (bagGrid) {
        inventoryDropHandled = true;
        const targetSlot = slotFromGridEvent(bagGrid, event);
        if (payload.source === "bag") moveBagItem(payload.index, targetSlot);
        if (payload.source === "pouch") movePouchItemToBag(payload.index, targetSlot);
        if (payload.source === "container") moveContainerItemToBag(payload.index, targetSlot);
        return;
      }
      if (pouchGrid) {
        inventoryDropHandled = true;
        const targetSlot = slotFromGridEvent(pouchGrid, event);
        const loot = lootForDragPayload(payload);
        if (loot) moveLootToSecretPouch(loot, payload.source, payload.index, targetSlot);
        return;
      }
      if (containerTarget && (payload.source === "bag" || payload.source === "pouch")) {
        inventoryDropHandled = true;
        if (payload.source === "bag") moveBagItemToContainer(payload.index);
        if (payload.source === "pouch") movePouchItemToContainer(payload.index);
      }
    }

    function pointInsideBackpackPanel(event) {
      const panel = backpackModal.querySelector(".backpack-panel");
      if (!panel || !Number.isFinite(event.clientX) || !Number.isFinite(event.clientY)) return false;
      const rect = panel.getBoundingClientRect();
      return event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
    }

    function handleInventoryDragEnd(event) {
      const payload = activeDragPayload;
      if (payload?.source === "bag" && !inventoryDropHandled && !pointInsideBackpackPanel(event)) {
        moveBagItemToContainer(payload.index);
      }
      if (payload?.source === "pouch" && !inventoryDropHandled && !pointInsideBackpackPanel(event)) {
        movePouchItemToContainer(payload.index);
      }
      activeDragPayload = null;
      inventoryDropHandled = false;
      clearDropHover();
    }

    function inventoryTarget(source, index, lootId = "") {
      const list = source === "bag" ? activeBackpack() : source === "pouch" ? secretPouchItems : source === "container" ? containerLoot : [];
      const idIndex = lootId ? list.findIndex((loot) => loot.id === lootId) : -1;
      const actualIndex = idIndex >= 0 ? idIndex : Number(index);
      return {
        index: actualIndex,
        loot: list[actualIndex] || null
      };
    }

    function performInventoryAutoAction(source, index, lootId = "") {
      const key = `${source}:${lootId || index}`;
      const now = performance.now();
      if (lastInventoryAutoAction.key === key && now - lastInventoryAutoAction.at < 220) return;
      lastInventoryAutoAction = { key, at: now };
      const target = inventoryTarget(source, index, lootId);
      if (!target.loot) return;
      if (!canMoveInventoryItem(source, target.index, target.loot)) {
        promptEl.innerHTML = source === "container"
          ? "这件物资还没检索完成，暂时不能拿走。"
          : "现在不能移动这件物品。";
        renderHud();
        return;
      }
      if (source === "container") {
        moveContainerItemToBag(target.index);
        return;
      }
      if (source === "pouch") {
        movePouchItemToBag(target.index);
        return;
      }
      if (source === "bag") {
        if (searchState) {
        promptEl.innerHTML = "搜索时只能丢到右侧。";
          renderHud();
          return;
        }
        arrangeBackpackFromItem(target.index);
      }
    }

    function handleInventoryItemClick(event) {
      const item = event.target.closest("[data-drag-source]");
      if (!item) return;
      const source = item.dataset.dragSource;
      const index = Number(item.dataset.lootIndex);
      const lootId = item.dataset.lootId || "";
      const target = inventoryTarget(source, index, lootId);
      const loot = target.loot;
      if (!loot) return;
      if (source === "container" && searchStateForContainerLoot(loot, target.index).locked) {
        promptEl.innerHTML = "尚未检索完成。";
        itemDetailEl.innerHTML = `<strong>未知物资</strong><span>检索完成后可查看。</span>`;
        return;
      }
      const key = `${source}:${loot.id}`;
      const now = performance.now();
      if (lastInventoryClick.key === key && now - lastInventoryClick.at < 420) {
        lastInventoryClick = { key: "", at: 0 };
        performInventoryAutoAction(source, target.index, loot.id);
        return;
      }
      lastInventoryClick = { key, at: now };
      selectedLootId = loot.id;
      selectedCardId = loot.special === "accessCard" ? loot.id : "";
      renderedBagSignature = "";
      renderedContainerSignature = "";
      renderedCardPackSignature = "";
      renderBagList(true);
      renderContainerGrid(true);
      renderCardPack(true);
      renderItemDetail(loot);
    }

    function handleCardPackClick(event) {
      const chip = event.target.closest("[data-card-index]");
      if (!chip) return;
      const card = cardPack[Number(chip.dataset.cardIndex)];
      if (!card) {
        selectedCardId = "";
        selectedLootId = "";
        renderCardPack(true);
        renderItemDetail(null);
        return;
      }
      selectedCardId = card.id;
      selectedLootId = "";
      renderCardPack(true);
      renderItemDetail(card);
    }

    function handleInventoryItemDoubleClick(event) {
      const item = event.target.closest("[data-drag-source]");
      if (!item) return;
      event.preventDefault();
      performInventoryAutoAction(item.dataset.dragSource, Number(item.dataset.lootIndex), item.dataset.lootId || "");
    }

    function handlePickupAction(event) {
      const button = event.target.closest("[data-pickup]");
      if (!button || button.disabled) return;
      if (event.type === "pointerdown") {
        lastPickupPointerAt = performance.now();
      } else if (event.type === "click" && performance.now() - lastPickupPointerAt < 350) {
        return;
      }
      event.preventDefault();
      const action = button.dataset.pickup;
      if (action === "take") takePendingLoot();
      if (action === "leave") leavePendingLoot();
    }

    function screenToWorld(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = camera.width / rect.width;
      const scaleY = camera.height / rect.height;
      return {
        x: camera.x + (event.clientX - rect.left) * scaleX,
        y: camera.y + (event.clientY - rect.top) * scaleY
      };
    }

    function isPointerSkillEvent(event) {
      return event && typeof event.button === "number" && Number.isFinite(event.clientX) && Number.isFinite(event.clientY);
    }

    function updateSkillAim(event) {
      const target = screenToWorld(event);
      skillAim.x = target.x;
      skillAim.y = target.y;
      skillAimFromPointer = true;
      return target;
    }

    function updateEggMouse(event) {
      const target = updateSkillAim(event);
      eggMouse.x = target.x;
      eggMouse.y = target.y;
      return target;
    }

    function directedSkillAimPoint(range = 620) {
      if (skillAimFromPointer) return { x: skillAim.x, y: skillAim.y };
      return {
        x: clamp(player.x + playerFacing.x * range, world.margin + player.radius, world.width - world.margin - player.radius),
        y: clamp(player.y + playerFacing.y * range, world.margin + player.radius, world.height - world.margin - player.radius)
      };
    }

    function nearestSkillTarget(maxRange = 760) {
      const target = nearestIceTarget(player.x, player.y, new Set(), maxRange);
      return target ? { x: target.x, y: target.y } : null;
    }

    function offensiveSkillAimPoint(maxRange = 760) {
      return nearestSkillTarget(maxRange) || directedSkillAimPoint(maxRange);
    }

    function canUseEggSkills() {
      return selectedCharacter === "egg" && !runEnded && !searchState && !pendingLoot && !backpackModal.classList.contains("show");
    }

    function canUseHeroSkill() {
      return selectedCharacter === "hero" && !runEnded && !searchState && !pendingLoot && !backpackModal.classList.contains("show");
    }

    function castHeroOuterOrbs(event = null) {
      if (!canUseHeroSkill()) return;
      if (isPointerSkillEvent(event) && (event.button !== 0 || event.shiftKey)) return;
      if (heroOuterOrbCooldownLeft > 0) {
        promptEl.innerHTML = `<strong>标准干员</strong> 冷却 ${Math.ceil(heroOuterOrbCooldownLeft)} 秒。`;
        renderHud();
        return;
      }
      if (event) event.preventDefault();
      heroOuterOrbActiveLeft = heroOuterOrbDurationSeconds;
      heroOuterOrbCooldownLeft = heroOuterOrbCooldownSeconds;
      recordInvestigatorSkillUse("hero");
      hitBursts.push({ x: player.x, y: player.y, age: 0, label: "光球" });
      promptEl.innerHTML = "<strong>标准干员</strong> 外圈光球。";
      renderHud();
    }

    function startEggBeam(event = null) {
      if (!canUseEggSkills()) return;
      const pointerEvent = isPointerSkillEvent(event);
      if (pointerEvent && (event.button !== 0 || event.shiftKey)) return;
      if (eggBeamCooldownLeft > 0) {
        promptEl.innerHTML = `<strong>椰蛋</strong> 冷却 ${Math.ceil(eggBeamCooldownLeft)} 秒。`;
        renderHud();
        return;
      }
      const target = pointerEvent ? updateEggMouse(event) : offensiveSkillAimPoint(eggBeam.range);
      eggMouse.x = target.x;
      eggMouse.y = target.y;
      if (event) event.preventDefault();
      if (pointerEvent) {
        try {
          canvas.setPointerCapture(event.pointerId);
        } catch {}
      }
      eggBeam.active = true;
      eggBeam.activeLeft = eggBeam.duration;
      eggBeam.tick = 0;
      eggBeam.angle = Math.atan2(eggMouse.y - player.y, eggMouse.x - player.x);
      recordInvestigatorSkillUse("egg");
      promptEl.innerHTML = "<strong>椰蛋</strong> 冷冻射束。";
      renderHud();
    }

    function stopEggBeam(options = {}) {
      if (!eggBeam.active) return;
      eggBeam.active = false;
      eggBeam.activeLeft = 0;
      eggBeamCooldownLeft = eggBeamCooldownSeconds;
      if (options.expired) {
        promptEl.innerHTML = "<strong>椰蛋</strong> 冷冻射束结束。";
      }
      renderHud();
    }

    function castEggBall(event = null) {
      if (!canUseEggSkills()) return;
      const pointerEvent = isPointerSkillEvent(event);
      if (pointerEvent && !(event.button === 2 || event.shiftKey)) return;
      if (eggBallCharges <= 0) {
        promptEl.innerHTML = `<strong>椰蛋</strong> 冷却 ${Math.ceil(eggBallCooldownLeft)} 秒。`;
        renderHud();
        return;
      }
      const targetPoint = pointerEvent ? updateEggMouse(event) : offensiveSkillAimPoint(720);
      if (event) event.preventDefault();
      const target = nearestIceTarget(player.x, player.y, new Set(), 720);
      eggBallCharges -= 1;
      recordInvestigatorSkillUse("egg");
      if (eggBallCharges < eggBallMaxCharges && eggBallCooldownLeft <= 0) eggBallCooldownLeft = eggBallCooldownSeconds;
      if (!target) {
        createIceField(targetPoint.x, targetPoint.y);
        promptEl.innerHTML = "<strong>椰蛋</strong> 冰场。";
      } else {
        eggBalls.push({
          x: player.x,
          y: player.y,
          r: 15,
          speed: 560,
          damage: 3.6,
          freeze: 68,
          bounces: 10,
          age: 0,
          target,
          hitIds: new Set()
        });
        promptEl.innerHTML = "<strong>椰蛋</strong> 冰场投射。";
      }
      renderHud();
    }

    function useNinjaTeleport(event = null) {
      if (selectedCharacter !== "cat" || runEnded || searchState || pendingLoot || backpackModal.classList.contains("show")) return;
      const target = isPointerSkillEvent(event) ? updateSkillAim(event) : directedSkillAimPoint(380);
      if (teleportCooldownLeft > 0) {
        promptEl.innerHTML = `<strong>影袭</strong> 冷却 ${Math.ceil(teleportCooldownLeft)} 秒。`;
        renderHud();
        return;
      }
      if (!canStandAt(target.x, target.y)) {
        promptEl.innerHTML = "<strong>影袭</strong> 无法落脚。";
        renderHud();
        return;
      }
      if (event) event.preventDefault();
      teleportBursts.push({ x: player.x, y: player.y, age: 0 });
      player.x = clamp(target.x, world.margin + player.radius, world.width - world.margin - player.radius);
      player.y = clamp(target.y, world.margin + player.radius, world.height - world.margin - player.radius);
      teleportBursts.push({ x: player.x, y: player.y, age: 0 });
      teleportCooldownLeft = teleportCooldownMaxSeconds();
      recordInvestigatorSkillUse("cat");
      promptEl.innerHTML = "<strong>影袭</strong> 瞬移。";
      renderHud();
    }

    function fireCatClaw(event = null) {
      if (selectedCharacter !== "cat" || runEnded || searchState || pendingLoot || backpackModal.classList.contains("show")) return;
      const pointerEvent = isPointerSkillEvent(event);
      if (pointerEvent && (event.button !== 0 || event.shiftKey)) return;
      if (catClawCooldownLeft > 0) {
        promptEl.innerHTML = `<strong>影袭</strong> 冷却 ${Math.ceil(catClawCooldownLeft)} 秒。`;
        renderHud();
        return;
      }
      const target = pointerEvent ? updateSkillAim(event) : offensiveSkillAimPoint(760);
      const dx = target.x - player.x;
      const dy = target.y - player.y;
      const distance = Math.hypot(dx, dy);
      if (distance < 8) return;
      if (event) event.preventDefault();
      const baseAngle = Math.atan2(dy, dx);
      [
        { angle: baseAngle, kind: "large", damage: 2, r: 22, speed: 570, range: 840 },
        { angle: baseAngle - 0.18, kind: "small", damage: 1, r: 13, speed: 540, range: 760 },
        { angle: baseAngle + 0.18, kind: "small", damage: 1, r: 13, speed: 540, range: 760 }
      ].forEach((claw) => {
        clawProjectiles.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(claw.angle),
          vy: Math.sin(claw.angle),
          speed: claw.speed,
          range: claw.range,
          distance: 0,
          r: claw.r,
          damage: claw.damage,
          kind: claw.kind,
          spinSeed: Math.random() * Math.PI * 2,
          hitIds: new Set()
        });
      });
      catClawCooldownLeft = catClawCooldownMaxSeconds();
      recordInvestigatorSkillUse("cat");
      renderHud();
    }

    function spawnNightShardPair(originX, originY, ux, uy, empowered, mirror = false, comboId = "") {
      const mirrorMultiplier = mirror ? nightMirrorShardDamageMultiplier() : 1;
      const bodyBackMultiplier = mirror ? 1 : nightBodyBackShardDamageMultiplier();
      const frontDamage = (mirror ? (empowered ? 3.1 : 1.05) : (empowered ? 1.1 : 0.35)) * mirrorMultiplier;
      const backDamage = (mirror ? (empowered ? 14.4 : 6.2) : (empowered ? 8 : 3.6)) * (mirror ? mirrorMultiplier : bodyBackMultiplier);
      const shardDefs = [
        { vx: ux, vy: uy, homing: false, damage: frontDamage, r: mirror ? 12 : 9, speed: 620, range: 780, seekRange: 0, turnRate: 0, pierce: false },
        { vx: -ux, vy: -uy, homing: false, damage: backDamage, r: mirror ? 17 : 14, speed: mirror ? 690 : 650, range: mirror ? 720 : 640, seekRange: 0, turnRate: 0, pierce: false }
      ];
      shardDefs.forEach((def, index) => {
        nightShardProjectiles.push({
          ...def,
          x: originX + def.vx * (player.radius + 8),
          y: originY + def.vy * (player.radius + 8),
          distance: 0,
          spin: Math.random() * Math.PI * 2,
          age: 0,
          empowered,
          mirror,
          comboId,
          kind: index === 0 ? "front" : "back",
          hitIds: new Set()
        });
      });
    }

    function fireNightShard(event = null) {
      if (!canUseNightSkills()) return;
      const pointerEvent = isPointerSkillEvent(event);
      if (pointerEvent && (event.button !== 0 || event.shiftKey)) return;
      if (nightShardCooldownLeft > 0) {
        promptEl.innerHTML = `<strong>夜视</strong> 冷却 ${Math.ceil(nightShardCooldownLeft)} 秒。`;
        renderHud();
        return;
      }
      const target = pointerEvent ? updateSkillAim(event) : directedSkillAimPoint(760);
      const dx = target.x - player.x;
      const dy = target.y - player.y;
      const distance = Math.hypot(dx, dy);
      if (distance < 8) return;
      if (event) event.preventDefault();
      const ux = dx / distance;
      const uy = dy / distance;
      const empowered = nightBloodActive();
      const comboId = nightAfterimage ? `night-combo-${nightMirrorComboCounter += 1}` : "";
      spawnNightShardPair(player.x, player.y, ux, uy, empowered, false, comboId);
      if (nightAfterimage) {
        const clone = nightMirrorClonePose();
        const reflected = reflectVectorAcrossNightMirror(ux, uy);
        const reflectedLength = Math.hypot(reflected.x, reflected.y) || 1;
        if (clone) {
          spawnNightShardPair(clone.x, clone.y, reflected.x / reflectedLength, reflected.y / reflectedLength, empowered, true, comboId);
          hitBursts.push({ x: clone.x, y: clone.y, age: 0, label: "镜像" });
        }
      }
      nightShardCooldownLeft = empowered ? nightShardCooldownSeconds * 0.82 : nightShardCooldownSeconds;
      recordInvestigatorSkillUse("night");
      promptEl.innerHTML = nightAfterimage
        ? (empowered ? "<strong>夜视</strong> 血棱碎片，镜像复刻。" : "<strong>夜视</strong> 镜片碎击，镜像复刻。")
        : (empowered ? "<strong>夜视</strong> 血棱碎片，背棱更重。" : "<strong>夜视</strong> 镜片碎击，背棱更重。");
      renderHud();
    }

    function castNightBloodMode() {
      if (!canUseNightSkills()) return;
      if (nightBloodModeLeft > 0) {
        promptEl.innerHTML = "<strong>夜视</strong> 赤镜已开。";
        renderHud();
        return;
      }
      if (nightBloodModeCooldownLeft > 0) {
        promptEl.innerHTML = `<strong>夜视</strong> 冷却 ${Math.ceil(nightBloodModeCooldownLeft)} 秒。`;
        renderHud();
        return;
      }
      const bloodCost = nightBloodCost();
      if (player.hp <= bloodCost) {
        promptEl.innerHTML = "<strong>夜视</strong> 血量不足。";
        renderHud();
        return;
      }
      player.hp = Math.max(1, player.hp - bloodCost);
      player.hurtCooldown = Math.max(player.hurtCooldown, 0.18);
      nightBloodModeLeft = nightBloodModeSeconds;
      nightBloodModeCooldownLeft = nightBloodModeCooldownSeconds;
      recordInvestigatorSkillUse("night");
      seedNightTrailIntro();
      hitBursts.push({ x: player.x, y: player.y, age: 0, label: "赤镜" });
      promptEl.innerHTML = `<strong>夜视</strong> 赤镜模式，消耗 ${bloodCost} 生命。`;
      renderHud();
    }

    function dashNightForward(target) {
      const dx = target.x - player.x;
      const dy = target.y - player.y;
      const distance = Math.hypot(dx, dy) || 1;
      const ux = dx / distance;
      const uy = dy / distance;
      let finalX = player.x;
      let finalY = player.y;
      const dashDistance = Math.min(320, Math.max(180, distance));
      for (let step = 22; step <= dashDistance; step += 22) {
        const probeX = player.x + ux * step;
        const probeY = player.y + uy * step;
        if (!canStandAt(probeX, probeY)) break;
        finalX = probeX;
        finalY = probeY;
      }
      player.x = finalX;
      player.y = finalY;
      playerFacing.x = ux;
      playerFacing.y = uy;
    }

    function castNightAfterimage(event = null) {
      if (!canUseNightSkills()) return;
      const pointerEvent = isPointerSkillEvent(event);
      if (pointerEvent && !(event.button === 2 || event.shiftKey)) return;
      if (nightAfterimage) {
        if (event) event.preventDefault();
        detonateNightAfterimage();
        return;
      }
      if (nightAfterimageCooldownLeft > 0) {
        promptEl.innerHTML = `<strong>夜视</strong> 冷却 ${Math.ceil(nightAfterimageCooldownLeft)} 秒。`;
        renderHud();
        return;
      }
      const target = pointerEvent ? updateSkillAim(event) : directedSkillAimPoint(320);
      if (event) event.preventDefault();
      const castDx = target.x - player.x;
      const castDy = target.y - player.y;
      const castDistance = Math.hypot(castDx, castDy) || 1;
      const castUx = castDx / castDistance;
      const castUy = castDy / castDistance;
      nightAfterimage = {
        x: player.x,
        y: player.y,
        r: 26,
        hp: nightAfterimageHp,
        maxHp: nightAfterimageHp,
        axisAngle: Math.atan2(castUy, castUx) + Math.PI / 2,
        age: 0,
        pulse: 0,
        duration: 9
      };
      dashNightForward(target);
      recordInvestigatorSkillUse("night");
      hitBursts.push({ x: nightAfterimage.x, y: nightAfterimage.y, age: 0, label: "镜面" });
      promptEl.innerHTML = "<strong>夜视</strong> 留下回烬镜面。";
      renderHud();
    }

    function updateHathorState(dt, movingIntent = false) {
      hathorBellCooldownLeft = Math.max(0, hathorBellCooldownLeft - dt);
      hathorBurstCooldownLeft = Math.max(0, hathorBurstCooldownLeft - dt);
      sekhmetBellCooldownLeft = Math.max(0, sekhmetBellCooldownLeft - dt);
      sekhmetBurstCooldownLeft = Math.max(0, sekhmetBurstCooldownLeft - dt);
      hathorBellFieldLeft = Math.max(0, hathorBellFieldLeft - dt);
      hathorShield = Math.max(0, hathorShield - dt * 1.6);
      if (selectedCharacter === "hathor") {
        if (hathorTransformLeft > 0) {
          hathorTransformLeft = Math.max(0, hathorTransformLeft - dt);
          if (hathorTransformLeft <= 0) completeHathorSekhmetTransform();
        }
        if (hathorSekhmetLeft > 0) {
          hathorQuietTime += dt;
          hathorStillTime = movingIntent ? 0 : hathorStillTime + dt;
          if (hathorReturnLeft > 0) {
            hathorReturnLeft = Math.max(0, hathorReturnLeft - dt);
            if (hathorReturnLeft <= 0) completeHathorReturn();
          } else if (hathorQuietTime >= hathorReturnTriggerSeconds || hathorStillTime >= hathorReturnTriggerSeconds) {
            startHathorReturn();
          }
          if (hathorSekhmetLeft > 0 && hathorReturnLeft <= 0) {
            if (hathorSekhmetLeft <= dt) startHathorReturn();
            else hathorSekhmetLeft = Math.max(0, hathorSekhmetLeft - dt);
          }
        } else {
          hathorStillTime = 0;
          hathorQuietTime = 0;
        }
      }
      if (hathorBellFieldLeft > 0) {
        if (hathorBellFieldKind !== "sekhmet" && selectedCharacter === "hathor") {
          player.hp = clamp(player.hp + player.maxHp * 0.012 * dt, 0, player.maxHp);
        }
        availableIceTargets().forEach((npc) => {
          if (Math.hypot(npc.x - player.x, npc.y - player.y) <= 230 + (npc.r || 0)) {
            if (hathorBellFieldKind === "sekhmet") {
              applyNightBurn(npc, nightBurnDurationSeconds + 1);
              damageNpc(npc, (npc.isBoss ? 4.8 : 7.2) * dt, "赤砂领域", true);
            } else {
              addFreeze(npc, 4.2 * dt, "声波");
            }
          }
        });
      }
    }

    function update(dt) {
      if (runEnded) return;
      catAttackAggroLeft = Math.max(0, catAttackAggroLeft - dt);
      player.hurtCooldown = Math.max(0, player.hurtCooldown - dt);
      switchInvestigatorCooldownLeft = Math.max(0, switchInvestigatorCooldownLeft - dt);
      if (selectedCharacter === "egg" && (searchState || pendingLoot || backpackModal.classList.contains("show"))) {
        stopEggBeam();
      }
      if (selectedCharacter === "egg" && eggBeam.active && keys.has("KeyQ") && !skillAimFromPointer) {
        const target = offensiveSkillAimPoint(eggBeam.range);
        eggMouse.x = target.x;
        eggMouse.y = target.y;
      }

      let dx = 0;
      let dy = 0;
      if ((!localCoopEnabled && keys.has("ArrowUp")) || keys.has("KeyW")) dy -= 1;
      if ((!localCoopEnabled && keys.has("ArrowDown")) || keys.has("KeyS")) dy += 1;
      if ((!localCoopEnabled && keys.has("ArrowLeft")) || keys.has("KeyA")) dx -= 1;
      if ((!localCoopEnabled && keys.has("ArrowRight")) || keys.has("KeyD")) dx += 1;
      updateCatExecution(dt);
      if (catExecutionState || player.frozen) {
        dx = 0;
        dy = 0;
      }
      const movingIntent = Boolean(dx || dy);
      if (movingIntent) {
        const length = Math.hypot(dx, dy) || 1;
        playerFacing.x = dx / length;
        playerFacing.y = dy / length;
        if (!skillAimFromPointer) {
          skillAim.x = clamp(player.x + playerFacing.x * 520, world.margin + player.radius, world.width - world.margin - player.radius);
          skillAim.y = clamp(player.y + playerFacing.y * 520, world.margin + player.radius, world.height - world.margin - player.radius);
        }
      }
      if (selectedCharacter === "hero" && !movingIntent && !searchState && !pendingLoot && !backpackModal.classList.contains("show")) {
        heroOrbIdleStillTime = Math.min(heroOrbIdleChargeSeconds, heroOrbIdleStillTime + dt);
      } else {
        heroOrbIdleStillTime = 0;
      }
      const heroFocusCharging = selectedCharacter === "hero" &&
        heroOrbIdleStillTime >= heroOrbIdleChargeSeconds &&
        !searchState &&
        !pendingLoot &&
        !backpackModal.classList.contains("show");
      if (heroFocusCharging) {
        heroOrbFocusProgress = Math.min(1, heroOrbFocusProgress + dt / heroOrbFocusRampUpSeconds);
      } else {
        heroOrbFocusProgress = Math.max(0, heroOrbFocusProgress - dt / heroOrbFocusRampDownSeconds);
      }
      const orbSpinMultiplier = heroOrbSpinMultiplier(movingIntent);
      skillTime += dt * orbSpinMultiplier;
      heroOrbSpinBoostActive = selectedCharacter === "hero" && heroOrbFocusProgress > 0.05;

      if (!runEnded && !searchState && !pendingLoot && (dx || dy)) {
        const length = Math.hypot(dx, dy);
        const currentSpeed = player.speed * catMovementSpeedMultiplier() * bastetMovementSpeedMultiplier() * playerIceSlowMultiplier() * hathorFieldSpeedMultiplier();
        const stepX = (dx / length) * currentSpeed * dt;
        const stepY = (dy / length) * currentSpeed * dt;
        const nextX = clamp(player.x + stepX, world.margin + player.radius, world.width - world.margin - player.radius);
        const nextY = clamp(player.y + stepY, world.margin + player.radius, world.height - world.margin - player.radius);

        if (canStandAt(nextX, player.y)) player.x = nextX;
        if (canStandAt(player.x, nextY)) player.y = nextY;
      }

      updateLocalCoopPlayerTwo(dt);
      updateFrozenStates(dt);
      updateWorldEvent(dt);
      updateSecondWaveInvaders(dt);
      updateAiScavs(dt);
      updateAttackWarnings(dt);
      updateNpcProjectiles(dt);
      updatePvp(dt);
      updateWheelTracks(dt);
      updateHeroOuterOrbSkill(dt);
      updateHeroOrbDamage(dt);
      updateHathorState(dt, movingIntent);
      updateBastetState(dt);
      updateTeleportSkill(dt);
      updateCatClaws(dt);
      updateNightAfterimage(dt);
      updateNightShards(dt);
      updateNightBurns(dt);
      updateEggBeam(dt);
      updateEggBalls(dt);
      updateIceFields(dt);
      updatePet(dt);
      updateHathorEffects(dt);
      updateHitBursts(dt);
      updateDamageNumbers(dt);
      updateScreenShake(dt);
      updateHeroTrail(dt, movingIntent && !searchState && !pendingLoot);
      updateCatTrail(dt, movingIntent && !searchState && !pendingLoot);
      updateEggTrail(dt, movingIntent && !searchState && !pendingLoot);
      updateNightTrail(dt, movingIntent && !searchState && !pendingLoot);
      skillReadoutEl.textContent = skillStatusText();
      renderSkillDock();
      const targetX = clamp(player.x - camera.width / 2, 0, world.width - camera.width);
      const targetY = clamp(player.y - camera.height / 2, 0, world.height - camera.height);
      camera.x += (targetX - camera.x) * Math.min(1, dt * 7.5);
      camera.y += (targetY - camera.y) * Math.min(1, dt * 7.5);
      clampCamera();
      clampLocalCoopPlayerTwoToScreen();

      updateArea(dt);
      updateNearbyThing();
      coordReadoutEl.textContent = `${Math.round(player.x)}, ${Math.round(player.y)}`;
    }

    function render() {
      ctx.save();
      ctx.clearRect(0, 0, camera.width, camera.height);
      if (screenShakeLeft > 0) {
        const strength = screenShakePower * (screenShakeLeft / 0.18);
        ctx.translate((Math.random() - 0.5) * 10 * strength, (Math.random() - 0.5) * 8 * strength);
      }
      ctx.translate(-camera.x, -camera.y);
      drawBackground();
      drawRoads();
      drawProps();
      drawBuildings();
      drawExtractZone();
      drawWheelTracks();
      drawIceFields();
      drawThings();
      drawAttackWarnings();
      drawAiScavs();
      drawNightBurnAuras();
      drawNpcProjectiles();
      drawCharacterSkill();
      drawPvpBotSkillEffects();
      drawNightAfterimage();
      drawHeroTrail();
      drawCatTrail();
      drawEggTrail();
      drawNightTrail();
      drawNightShardProjectiles();
      drawPvpOpponent();
      drawPet();
      drawLocalCoopPlayerTwo();
      drawPlayer();
      drawDamageNumbers();
      drawSssCollectionArrow();
      drawTimedExtractArrow();
      drawBlackoutOverlay();
      ctx.restore();
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      updateSearch(now);
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    document.addEventListener("pointerdown", unlockParkingAudio, { once: true });
    document.addEventListener("keydown", unlockParkingAudio, { once: true });

    document.addEventListener("keydown", (event) => {
      if (event.code === "Escape" && commissionHudEl.classList.contains("open")) {
        event.preventDefault();
        commissionHudEl.classList.remove("open");
        commissionHudToggleEl.setAttribute("aria-expanded", "false");
        return;
      }
      if (event.code === "Escape" && backpackModal.classList.contains("show")) {
        event.preventDefault();
        closeBackpack();
        return;
      }
      if (event.code === "Escape" && searchState) {
        event.preventDefault();
        cancelSearch();
        return;
      }
      if (backpackModal.classList.contains("show")) return;
      const movementCodes = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "KeyW", "KeyA", "KeyS", "KeyD"];
      if (localCoopEnabled && event.code === "KeyB") {
        event.preventDefault();
        openBackpack(1);
        return;
      }
      if (localCoopEnabled && event.code === "Slash") {
        event.preventDefault();
        openBackpack(2);
        return;
      }
      if (localCoopEnabled && event.code === "Semicolon") {
        event.preventDefault();
        localCoopPlayerTwoStrike();
        return;
      }
      if (localCoopEnabled && event.code === "Quote") {
        event.preventDefault();
        localCoopPlayerTwoPulse();
        return;
      }
      if (event.code === "Tab") {
        event.preventDefault();
        if (!event.repeat) switchInvestigator();
        return;
      }
      if (movementCodes.includes(event.code)) {
        event.preventDefault();
        keys.add(event.code);
        if (searchState) {
          cancelSearch("搜索中断，可继续。");
        }
        return;
      }
      if (event.code === "KeyE") {
        event.preventDefault();
        if (searchState) {
          cancelSearch();
          return;
        }
        const currentExtract = nearbyExtractZone();
        if (!nearbyThing && currentExtract) {
          extractRun(currentExtract);
        } else {
          interact();
        }
      }
      if (event.code === "KeyQ") {
        event.preventDefault();
        keys.add(event.code);
        if (selectedCharacter === "hero") castHeroOuterOrbs();
        if (selectedCharacter === "cat") fireCatClaw();
        if (selectedCharacter === "egg" && !event.repeat) startEggBeam();
        if (selectedCharacter === "night" && !event.repeat) fireNightShard();
        if (selectedCharacter === "hathor" && !event.repeat) castHathorBellField();
        if (selectedCharacter === "bastet" && !event.repeat) castBastetStep();
        return;
      }
      if (event.code === "KeyR") {
        event.preventDefault();
        if (selectedCharacter === "cat") useNinjaTeleport();
        if (selectedCharacter === "egg") castEggBall();
        if (selectedCharacter === "night") castNightBloodMode();
        if (selectedCharacter === "hathor") castHathorBurst();
        if (selectedCharacter === "bastet") castBastetCounter();
        return;
      }
      if (event.code === "KeyF") {
        event.preventDefault();
        if (!event.repeat) castPetSkill();
        return;
      }
      if (event.code === "Space") {
        event.preventDefault();
        if (selectedCharacter === "night") {
          castNightAfterimage();
        } else if (selectedCharacter === "hathor") {
          castHathorBurst();
        } else if (selectedCharacter === "bastet") {
          castBastetStep();
        } else {
          castHeroOuterOrbs();
        }
      }
    });

    document.addEventListener("keyup", (event) => {
      keys.delete(event.code);
      if (event.code === "KeyQ" && selectedCharacter === "egg") stopEggBeam();
    });

    document.querySelectorAll("[data-dir]").forEach((button) => {
      const codeByDir = {
        up: "ArrowUp",
        down: "ArrowDown",
        left: "ArrowLeft",
        right: "ArrowRight"
      };
      const code = codeByDir[button.dataset.dir];
      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        keys.add(code);
        if (searchState) {
          cancelSearch("搜索中断，可继续。");
        }
        button.setPointerCapture(event.pointerId);
      });
      button.addEventListener("pointerup", () => keys.delete(code));
      button.addEventListener("pointercancel", () => keys.delete(code));
      button.addEventListener("lostpointercapture", () => keys.delete(code));
    });

    interactButton.addEventListener("click", interact);
    canvas.addEventListener("pointermove", (event) => {
      updateSkillAim(event);
      if (selectedCharacter === "egg") {
        eggMouse.x = skillAim.x;
        eggMouse.y = skillAim.y;
      }
    });
    canvas.addEventListener("pointerdown", startEggBeam);
    canvas.addEventListener("pointerup", stopEggBeam);
    canvas.addEventListener("pointercancel", stopEggBeam);
    canvas.addEventListener("lostpointercapture", stopEggBeam);
    canvas.addEventListener("pointerdown", castEggBall);
    canvas.addEventListener("pointerdown", castHeroOuterOrbs);
    canvas.addEventListener("pointerdown", fireCatClaw);
    canvas.addEventListener("pointerdown", fireNightShard);
    canvas.addEventListener("pointerdown", castNightAfterimage);
    canvas.addEventListener("pointerdown", castBastetStep);
    canvas.addEventListener("pointerdown", castBastetCounter);
    canvas.addEventListener("pointerdown", (event) => {
      if (event.button === 2 || event.shiftKey) useNinjaTeleport(event);
    });
    canvas.addEventListener("contextmenu", (event) => {
      if (selectedCharacter === "cat" || selectedCharacter === "egg" || selectedCharacter === "night" || selectedCharacter === "bastet") event.preventDefault();
    });
    backpackOpenButton.addEventListener("click", () => openBackpack(1));
    commissionHudToggleEl.addEventListener("click", () => {
      const open = !commissionHudEl.classList.contains("open");
      commissionHudEl.classList.toggle("open", open);
      commissionHudToggleEl.setAttribute("aria-expanded", String(open));
      renderParkingCommissionHud();
    });
    document.querySelectorAll("[data-close-backpack]").forEach((element) => {
      element.addEventListener("click", closeBackpack);
    });
    extractButton.addEventListener("click", () => {
      const currentExtract = nearbyExtractZone();
      if (!currentExtract || searchState || pendingLoot || runEnded) return;
      extractRun(currentExtract);
    });
    pickupCardEl.addEventListener("pointerdown", handlePickupAction);
    pickupCardEl.addEventListener("click", handlePickupAction);
    cardPackEl.addEventListener("click", handleCardPackClick);
    [bagListEl, containerGridEl, secretPouchGridEl].forEach((grid) => {
      grid.addEventListener("dragstart", handleInventoryDragStart);
      grid.addEventListener("dragover", handleInventoryDragOver);
      grid.addEventListener("dragleave", handleInventoryDragLeave);
      grid.addEventListener("drop", handleInventoryDrop);
      grid.addEventListener("dragend", handleInventoryDragEnd);
      grid.addEventListener("click", handleInventoryItemClick);
      grid.addEventListener("dblclick", handleInventoryItemDoubleClick);
    });
    bagListEl.addEventListener("click", (event) => {
      const discardButton = event.target.closest("[data-discard]");
      if (!discardButton) return;
      discardBackpackItem(Number(discardButton.dataset.discard));
    });
    window.addEventListener("resize", resize);

    resize();
    if (pvpState.enabled) {
      resetPvpRound();
    }
    setActiveBackpackOwner(1);
    if (localCoopEnabled) {
      playerTwo.x = clamp(player.x + 58, world.margin + playerTwo.radius, world.width - world.margin - playerTwo.radius);
      playerTwo.y = clamp(player.y + 48, world.margin + playerTwo.radius, world.height - world.margin - playerTwo.radius);
    }
    camera.x = player.x - camera.width / 2;
    camera.y = player.y - camera.height / 2;
    clampCamera();
    activeArea = currentAreaName();
    areaReadoutEl.textContent = activeArea;
    areaTitleEl.textContent = activeArea;
    areaTitleEl.classList.add("show");
    areaTimer = 1.8;
    const trailStyle = activeTrailStyle();
    const activeCharacterName = characterDisplayInfo(selectedCharacter).name;
    if (trailStyle && !pvpState.enabled) {
      seedHeroTrailIntro();
      promptEl.innerHTML = `<strong>${activeCharacterName}</strong> ${trailStyle.prompt}${hasHeroDualCoreOrbsEquipped() ? " 虚实双核已穿戴。" : ""}${hasHeroStarshineOuterOrbsEquipped() ? " 星辉已穿戴。" : ""}${hasVictoryBirdEquipped() ? " 战绩播报已穿戴。" : ""}`;
    } else if (hasHeroDualCoreOrbsEquipped() && !pvpState.enabled) {
      promptEl.innerHTML = `<strong>${activeCharacterName}</strong> 虚实双核已穿戴。${hasHeroStarshineOuterOrbsEquipped() ? " 星辉已穿戴。" : ""}${hasVictoryBirdEquipped() ? " 战绩播报已穿戴。" : ""}`;
    } else if (hasHeroStarshineOuterOrbsEquipped() && !pvpState.enabled) {
      promptEl.innerHTML = `<strong>${activeCharacterName}</strong> 星辉已穿戴。${hasVictoryBirdEquipped() ? " 战绩播报已穿戴。" : ""}`;
    } else if (hasCatSilverTrail() && !pvpState.enabled) {
      promptEl.innerHTML = `<strong>${activeCharacterName}</strong> 残影拖尾已穿戴。${hasVictoryBirdEquipped() ? " 战绩播报已穿戴。" : ""}`;
    } else if (hasEggTrailVisual() && !pvpState.enabled) {
      seedEggTrailIntro();
      promptEl.innerHTML = `<strong>${activeCharacterName}</strong> ${hasEggFrostTrailEquipped() ? "冰霜拖尾已穿戴。" : ""}${hasEggSnowflakeTrailEquipped() ? " 雪花芯已穿戴。" : ""}${hasVictoryBirdEquipped() ? " 战绩播报已穿戴。" : ""}`;
    } else if (hasNightMirrorTrailEquipped() && !pvpState.enabled) {
      seedNightTrailIntro();
      promptEl.innerHTML = `<strong>${activeCharacterName}</strong> 镜光拖尾已启用，赤镜后会变红。${hasVictoryBirdEquipped() ? " 战绩播报已穿戴。" : ""}`;
    } else if (hasVictoryBirdEquipped() && !pvpState.enabled) {
      promptEl.innerHTML = `<strong>${activeCharacterName}</strong> 战绩播报已穿戴。`;
    }
    if (localCoopEnabled) {
      promptEl.innerHTML = "<strong>停车场行动</strong>：单人模式。WASD 移动，E 互动。";
    }
    renderParkingCommissionHud();
    renderHud();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
