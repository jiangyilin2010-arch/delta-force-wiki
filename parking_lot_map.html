<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <style>
    :root {
      --ink: #07100d;
      --deep: #0c1714;
      --panel: rgba(9, 18, 15, 0.88);
      --paper: #e6ddc8;
      --paper-dim: #b9ae96;
      --gold: #a48a52;
      --gold-bright: #c7a96b;
      --jade: #4d8b76;
      --line: rgba(230, 221, 200, 0.18);
      --shadow: 0 26px 70px rgba(0, 0, 0, 0.42);
      font-family: "Noto Serif SC", "Songti SC", serif;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--paper);
      background:
        radial-gradient(circle at 50% 0, rgba(77, 139, 118, 0.18), transparent 36%),
        linear-gradient(180deg, #08110e, #0c1714 48%, #07100d);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      transform-origin: center top;
      animation: pageEnter 980ms cubic-bezier(0.19, 1, 0.22, 1) both;
    }

    @keyframes pageEnter {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
        filter: blur(5px);
        clip-path: inset(2% 2% round 12px);
      }

      58% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
        clip-path: inset(0 0 round 0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 140ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 140ms !important;
      }

      body,
      .backpack-panel {
        transform: none;
        filter: none;
        clip-path: none;
      }
    }

    button {
      font: inherit;
    }

    .game-page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto minmax(560px, 1fr);
      padding: 18px;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 56px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .map-sigil {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(164, 138, 82, 0.5);
      background: rgba(164, 138, 82, 0.06);
      color: var(--gold);
      font-size: 18px;
      text-decoration: none;
      transform: rotate(45deg);
      transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .map-sigil:hover {
      background: rgba(164, 138, 82, 0.14);
      border-color: var(--gold-bright);
      box-shadow: 0 0 24px rgba(164, 138, 82, 0.18);
    }

    .map-sigil span {
      transform: rotate(-45deg);
    }

    .title-block {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 30px);
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--paper-dim);
      font-size: 12px;
      line-height: 1.5;
    }

    .readout {
      margin-left: auto;
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--paper-dim);
      font-size: 12px;
      white-space: nowrap;
    }

    .readout strong {
      color: var(--gold-bright);
      font-weight: 500;
    }

    .backpack-open {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid rgba(164, 138, 82, 0.42);
      background: rgba(164, 138, 82, 0.08);
      color: var(--paper);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .backpack-open b {
      color: var(--gold-bright);
      font-size: 16px;
      line-height: 1;
    }

    .backpack-open strong {
      color: var(--gold-bright);
      font-weight: 600;
    }

    .viewport {
      position: relative;
      min-height: 560px;
      border: 1px solid rgba(164, 138, 82, 0.38);
      background: #0d1512;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: crisp-edges;
    }

    .area-title {
      position: absolute;
      left: 50%;
      top: 28px;
      min-width: 220px;
      padding: 12px 18px;
      border: 1px solid rgba(164, 138, 82, 0.42);
      background:
        linear-gradient(145deg, rgba(164, 138, 82, 0.18), rgba(7, 16, 13, 0.84)),
        rgba(9, 18, 15, 0.9);
      color: var(--paper);
      text-align: center;
      font-size: 18px;
      letter-spacing: 0.08em;
      transform: translate(-50%, -10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 420ms ease, transform 420ms ease;
    }

    .area-title.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .rare-loot-burst {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 60;
      width: min(420px, calc(100vw - 42px));
      min-height: 156px;
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.88);
    }

    .rare-loot-burst.show {
      animation: rareLootPop 1350ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .rare-loot-burst::before,
    .rare-loot-burst::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(230, 221, 200, 0.24);
      transform: rotate(45deg);
    }

    .rare-loot-burst::before {
      background:
        radial-gradient(circle, var(--rare-core), transparent 0 17%, transparent 18%),
        repeating-conic-gradient(from 12deg, var(--rare-ray) 0 8deg, transparent 8deg 18deg);
      filter: blur(0.2px);
      opacity: 0.72;
    }

    .rare-loot-burst::after {
      inset: 38px;
      border-color: var(--rare-edge);
      box-shadow: 0 0 42px var(--rare-glow), inset 0 0 28px var(--rare-glow);
    }

    .rare-loot-burst strong,
    .rare-loot-burst span {
      position: relative;
      z-index: 1;
      display: block;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.78);
    }

    .rare-loot-burst strong {
      color: var(--rare-text);
      font-size: clamp(30px, 6vw, 54px);
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .rare-loot-burst span {
      max-width: 280px;
      margin-top: 8px;
      color: var(--paper);
      font-size: 13px;
      line-height: 1.5;
    }

    .rare-loot-burst.gold {
      --rare-core: rgba(255, 222, 126, 0.92);
      --rare-ray: rgba(199, 169, 107, 0.5);
      --rare-edge: rgba(255, 224, 133, 0.72);
      --rare-glow: rgba(255, 202, 83, 0.46);
      --rare-text: #ffe09a;
    }

    .rare-loot-burst.red {
      --rare-core: rgba(255, 73, 60, 0.95);
      --rare-ray: rgba(255, 57, 45, 0.58);
      --rare-edge: rgba(255, 111, 82, 0.8);
      --rare-glow: rgba(255, 55, 42, 0.58);
      --rare-text: #ffb09a;
    }

    @keyframes rareLootPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.72) rotate(-2deg);
        filter: saturate(1.15);
      }

      14% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08) rotate(0deg);
      }

      42% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -56%) scale(1.1);
      }
    }

    .prompt {
      position: absolute;
      left: 50%;
      bottom: 24px;
      width: min(520px, calc(100% - 40px));
      padding: 12px 14px;
      border: 1px solid rgba(230, 221, 200, 0.2);
      background: rgba(7, 16, 13, 0.86);
      color: var(--paper-dim);
      line-height: 1.55;
      transform: translateX(-50%);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32);
      pointer-events: none;
    }

    .prompt strong {
      color: var(--gold-bright);
      font-weight: 500;
    }

    .field-status {
      position: absolute;
      left: 18px;
      top: 18px;
      display: grid;
      gap: 7px;
      width: min(250px, calc(100% - 36px));
      padding: 12px;
      border: 1px solid rgba(230, 221, 200, 0.16);
      background: rgba(7, 16, 13, 0.76);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28);
      pointer-events: none;
    }

    .field-status span {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--paper-dim);
      font-size: 12px;
      line-height: 1.4;
    }

    .field-status strong {
      color: var(--gold-bright);
      font-weight: 600;
    }

    .field-status .passive-row strong {
      max-width: 158px;
      overflow: hidden;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commission-hud {
      position: absolute;
      left: 18px;
      top: 188px;
      z-index: 5;
      width: min(286px, calc(100% - 36px));
      display: grid;
      gap: 8px;
      pointer-events: auto;
    }

    .commission-hud-toggle {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 12px;
      border: 1px solid rgba(199, 169, 107, 0.44);
      background:
        linear-gradient(145deg, rgba(199, 169, 107, 0.12), rgba(7, 16, 13, 0.8)),
        rgba(7, 16, 13, 0.86);
      color: var(--paper);
      cursor: pointer;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    }

    .commission-hud-toggle b {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(199, 169, 107, 0.52);
      color: var(--gold-bright);
      font-size: 14px;
      font-weight: 700;
    }

    .commission-hud-toggle span {
      flex: 1;
      color: var(--paper);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: left;
    }

    .commission-hud-toggle strong {
      min-width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(199, 169, 107, 0.18);
      color: var(--gold-bright);
      font-size: 12px;
    }

    .commission-hud-panel {
      max-height: min(430px, calc(100svh - 310px));
      display: none;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(230, 221, 200, 0.16);
      background:
        linear-gradient(145deg, rgba(77, 139, 118, 0.1), rgba(164, 138, 82, 0.05)),
        rgba(7, 16, 13, 0.9);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
      overflow-y: auto;
      animation: compactModalEnter 260ms cubic-bezier(0.18, 0.86, 0.24, 1) both;
    }

    .commission-hud.open .commission-hud-panel {
      display: grid;
    }

    .commission-hud-section {
      display: grid;
      gap: 8px;
    }

    .commission-hud-section h2 {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 0;
      color: var(--gold-bright);
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .commission-hud-section h2 span {
      color: var(--paper-dim);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .commission-hud-card {
      display: grid;
      gap: 7px;
      padding: 9px;
      border: 1px solid rgba(230, 221, 200, 0.13);
      background: rgba(255, 255, 255, 0.018);
    }

    .commission-hud-card.done {
      border-color: rgba(199, 169, 107, 0.42);
      box-shadow: inset 0 0 22px rgba(199, 169, 107, 0.08);
    }

    .commission-hud-card strong,
    .commission-hud-card span {
      display: block;
    }

    .commission-hud-card strong {
      color: var(--paper);
      font-size: 13px;
      font-weight: 700;
    }

    .commission-hud-card span,
    .commission-hud-card li {
      color: var(--paper-dim);
      font-size: 11px;
      line-height: 1.5;
    }

    .commission-hud-card ul {
      display: grid;
      gap: 5px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .commission-hud-card li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .commission-hud-card em {
      color: var(--gold-bright);
      font-style: normal;
      white-space: nowrap;
    }

    .commission-hud-empty {
      margin: 0;
      color: var(--paper-dim);
      font-size: 12px;
      line-height: 1.6;
    }

    .search-panel {
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 3;
      width: min(320px, calc(100% - 36px));
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid rgba(164, 138, 82, 0.36);
      background:
        linear-gradient(145deg, rgba(164, 138, 82, 0.08), rgba(255, 255, 255, 0.012)),
        rgba(7, 16, 13, 0.84);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
    }

    .search-panel h2 {
      margin: 0;
      color: var(--gold-bright);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1em;
    }

    .search-state {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 12px;
      align-items: center;
    }

    .scan-orb {
      width: 44px;
      height: 44px;
      position: relative;
      display: grid;
      place-items: center;
      border: 1px solid rgba(199, 169, 107, 0.38);
      border-radius: 50%;
      background: rgba(164, 138, 82, 0.07);
    }

    .scan-orb::before {
      content: "";
      width: 20px;
      height: 20px;
      display: block;
      border: 3px solid var(--gold-bright);
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px rgba(7, 16, 13, 0.9);
    }

    .scan-orb::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 3px;
      right: 8px;
      bottom: 10px;
      background: var(--gold-bright);
      transform: rotate(45deg);
      transform-origin: left center;
    }

    .scan-orb.active {
      animation: scanSpin 950ms linear infinite;
      border-color: var(--gold-bright);
      box-shadow: 0 0 24px rgba(199, 169, 107, 0.18);
    }

    .search-copy strong,
    .search-copy span,
    .search-copy em {
      display: block;
    }

    .search-copy strong {
      color: var(--paper);
      font-size: 14px;
      font-weight: 600;
    }

    .search-copy span,
    .search-copy em {
      margin-top: 4px;
      color: var(--paper-dim);
      font-size: 12px;
      line-height: 1.55;
      font-style: normal;
    }

    .search-bar {
      height: 8px;
      overflow: hidden;
      border: 1px solid rgba(230, 221, 200, 0.12);
      background: rgba(7, 16, 13, 0.7);
    }

    .search-fill {
      width: 0%;
      height: 100%;
      display: block;
      background: linear-gradient(90deg, var(--jade), var(--gold-bright));
      transition: width 120ms linear;
    }

    .pickup-card,
    .card-pack,
    .bag-list {
      display: grid;
      gap: 8px;
    }

    .pickup-card {
      padding: 10px;
      border: 1px solid rgba(230, 221, 200, 0.14);
      background: rgba(255, 255, 255, 0.018);
    }

    .pickup-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .pickup-actions button,
    .extract-button,
    .bag-item button {
      min-height: 34px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .extract-button {
      color: #07100d;
      background: var(--gold);
      border-color: var(--gold);
    }

    .extract-button:disabled {
      color: rgba(230, 221, 200, 0.32);
      background: rgba(255, 255, 255, 0.02);
      border-color: rgba(230, 221, 200, 0.1);
    }

    .card-pack {
      width: max-content;
      max-width: 100%;
      padding: 0;
      border: 1px solid rgba(166, 166, 166, 0.32);
      background: rgba(35, 36, 36, 0.88);
    }

    .card-pack-head {
      display: none;
    }

    .card-pack-list {
      display: grid;
      grid-template-columns: repeat(2, var(--card-cell-size, 42px));
      grid-auto-rows: var(--card-cell-size, 42px);
      gap: 0;
    }

    .card-chip {
      min-width: 0;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-right: 1px solid rgba(185, 185, 185, 0.24);
      border-bottom: 1px solid rgba(185, 185, 185, 0.24);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.04), transparent),
        rgba(82, 84, 84, 0.46);
      color: var(--paper-dim);
      font-size: 11px;
      line-height: 1;
      text-align: center;
      cursor: pointer;
    }

    .card-chip.found {
      color: #07100d;
      background: linear-gradient(145deg, #d7bd78, #9f7e3c);
    }

    .card-chip.selected {
      outline: 2px solid rgba(255, 226, 132, 0.9);
      outline-offset: -2px;
    }

    .card-chip.tier-2 { background: #5e9b83; color: #07100d; }
    .card-chip.tier-3 { background: #79a9c6; color: #07100d; }
    .card-chip.tier-4 { background: #b19ad6; color: #07100d; }
    .card-chip.tier-5 { background: #c7a96b; color: #07100d; }
    .card-chip.tier-6 { background: #b45f48; color: #fff3e8; }

    .card-chip span {
      display: none;
    }

    .card-chip b {
      color: inherit;
      font-weight: 700;
    }

    .secret-pouch {
      display: none;
      gap: 7px;
      align-content: start;
      width: max-content;
      max-width: 100%;
    }

    .secret-pouch.unlocked {
      display: grid;
    }

    .secret-pouch-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--paper-dim);
      font-size: 12px;
    }

    .secret-pouch-head strong {
      color: var(--gold-bright);
      font-weight: 600;
    }

    .secret-pouch-grid {
      --grid-columns: 2;
      --cell-size: 42px;
      display: grid;
      grid-template-columns: repeat(2, var(--cell-size));
      grid-auto-rows: var(--cell-size);
      position: relative;
      border: 1px solid rgba(199, 169, 107, 0.34);
      background:
        linear-gradient(145deg, rgba(199, 169, 107, 0.08), transparent),
        rgba(35, 36, 36, 0.74);
      overflow: visible;
    }

    .backpack-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 22px;
    }

    .backpack-modal.show {
      display: grid;
      animation: modalBackdropEnter 280ms ease both;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(1, 5, 4, 0.62);
      backdrop-filter: blur(7px);
    }

    .backpack-panel {
      position: relative;
      z-index: 1;
      width: min(1060px, 100%);
      max-height: min(760px, calc(100svh - 44px));
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid rgba(164, 138, 82, 0.42);
      background:
        linear-gradient(145deg, rgba(164, 138, 82, 0.09), rgba(255, 255, 255, 0.012)),
        rgba(7, 16, 13, 0.94);
      box-shadow: var(--shadow);
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .backpack-modal.show .backpack-panel {
      animation: compactModalEnter 360ms cubic-bezier(0.18, 0.86, 0.24, 1) both;
    }

    .backpack-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .backpack-head h2 {
      margin: 0;
      color: var(--paper);
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .backpack-head strong {
      color: var(--gold-bright);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .backpack-close {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(230, 221, 200, 0.18);
      background: rgba(255, 255, 255, 0.03);
      color: var(--paper);
      font-size: 20px;
      cursor: pointer;
    }

    .backpack-modal.local-coop .backpack-panel {
      border-color: rgba(255, 226, 132, 0.58);
      box-shadow: 0 0 0 2px rgba(255, 226, 132, 0.12), var(--shadow);
    }

    .backpack-modal.local-coop.coop-p2 .backpack-panel {
      border-color: rgba(125, 220, 255, 0.72);
      box-shadow: 0 0 0 2px rgba(125, 220, 255, 0.18), var(--shadow);
    }

    .local-coop-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      margin-left: 8px;
      padding: 2px 8px;
      border: 1px solid rgba(255, 226, 132, 0.46);
      background: rgba(7, 16, 13, 0.72);
      color: var(--gold-bright);
      font-size: 12px;
    }

    .backpack-modal.coop-p2 .local-coop-badge {
      border-color: rgba(125, 220, 255, 0.5);
      color: #d7f5ff;
    }

    .backpack-note {
      margin: 0;
      color: var(--paper-dim);
      font-size: 12px;
      line-height: 1.65;
    }

    .item-detail {
      min-height: 72px;
      display: grid;
      gap: 5px;
      padding: 10px 12px;
      border: 1px solid rgba(166, 166, 166, 0.24);
      background: rgba(35, 36, 36, 0.62);
      color: var(--paper-dim);
      font-size: 12px;
      line-height: 1.55;
    }

    .item-detail strong {
      color: var(--paper);
      font-size: 14px;
      font-weight: 600;
    }

    .item-detail span {
      color: var(--paper-dim);
    }

    .inventory-layout {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.72fr);
      gap: 14px;
      overflow: visible;
    }

    .inventory-side {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(230, 221, 200, 0.12);
      background: rgba(7, 16, 13, 0.42);
    }

    .inventory-side.container-side {
      grid-template-rows: auto auto;
      align-content: start;
      gap: 4px;
    }

    .inventory-side h3 {
      margin: 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--paper);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    .inventory-side h3 span,
    .inventory-side h3 strong {
      color: var(--gold-bright);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .inventory-grid {
      --cell-size: 42px;
      --grid-columns: 6;
      min-height: 0;
      width: max-content;
      display: grid;
      grid-template-columns: repeat(var(--grid-columns), var(--cell-size));
      grid-auto-rows: var(--cell-size);
      grid-auto-flow: row;
      gap: 0;
      align-content: start;
      justify-content: start;
      justify-self: start;
      overflow: auto;
      padding: 0;
      border: 1px solid rgba(166, 166, 166, 0.32);
      background: rgba(35, 36, 36, 0.88);
    }

    .grid-slot {
      min-width: 0;
      position: relative;
      z-index: 0;
      border: 0;
      border-right: 1px solid rgba(185, 185, 185, 0.24);
      border-bottom: 1px solid rgba(185, 185, 185, 0.24);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.045), transparent),
        rgba(82, 84, 84, 0.46);
    }

    .grid-slot.drop-hover {
      background: rgba(122, 122, 122, 0.72);
      box-shadow: inset 0 0 0 2px rgba(199, 169, 107, 0.86);
    }

    .grid-item {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      position: relative;
      margin: 3px;
      padding: 0;
      border: 1px solid rgba(210, 210, 210, 0.34);
      background: var(--item-fill, rgba(48, 49, 49, 0.94));
      color: var(--paper);
      cursor: grab;
      overflow: hidden;
      user-select: none;
      z-index: 2;
    }

    .grid-item:active {
      cursor: grabbing;
    }

    .grid-item[draggable="false"],
    .grid-item.search-concealed {
      cursor: default;
    }

    .grid-item.selected {
      border-color: rgba(199, 169, 107, 0.95);
      box-shadow: inset 0 0 0 1px rgba(199, 169, 107, 0.58), 0 0 18px rgba(199, 169, 107, 0.16);
    }

    .grid-item.rare-just-revealed {
      animation: rareGridFlash 1200ms ease-out both;
    }

    @keyframes rareGridFlash {
      0% {
        filter: brightness(1.9) saturate(1.35);
        box-shadow: 0 0 0 0 rgba(255, 225, 140, 0.72), 0 0 30px rgba(255, 204, 88, 0.42);
      }

      35% {
        filter: brightness(1.35) saturate(1.15);
        box-shadow: 0 0 0 5px rgba(255, 225, 140, 0.18), 0 0 24px rgba(255, 83, 70, 0.34);
      }

      100% {
        filter: none;
        box-shadow: none;
      }
    }

    .grid-item::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      pointer-events: none;
    }

    .grid-item.tier-box-1 { --item-fill: linear-gradient(145deg, #bbb4a6, #6f6b63); }
    .grid-item.tier-box-2 { --item-fill: linear-gradient(145deg, #75b592, #2f6b55); }
    .grid-item.tier-box-3 { --item-fill: linear-gradient(145deg, #85b8da, #3d6f91); }
    .grid-item.tier-box-4 { --item-fill: linear-gradient(145deg, #b99ee2, #70589b); }
    .grid-item.tier-box-5 { --item-fill: linear-gradient(145deg, #e0c06d, #927034); }
    .grid-item.tier-box-6 {
      --item-fill: linear-gradient(145deg, #b45f48, #5b1918);
      border-color: rgba(255, 194, 162, 0.56);
    }

    .grid-item.search-concealed {
      --item-fill:
        repeating-linear-gradient(135deg, #6b6d6d 0 7px, #555757 7px 14px);
      border-color: #777979;
      box-shadow: none;
      filter: none;
    }

    .grid-item.search-concealed::after {
      inset: 0;
      border: 0;
      background: none;
    }

    .grid-item.search-current {
      border-color: #c7a96b;
      box-shadow: inset 0 0 0 1px #c7a96b;
    }

    .search-lens {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 5;
      width: 21px;
      height: 21px;
      translate: -50% -50%;
      rotate: 0deg;
      filter: none;
      animation: searchLensSpin var(--item-scan-speed, 900ms) linear infinite;
      transform-origin: center;
      pointer-events: none;
    }

    .search-lens::before {
      content: "";
      position: absolute;
      left: 1px;
      top: 1px;
      width: 12px;
      height: 12px;
      border: 2px solid #e1c77c;
      border-radius: 50%;
      background: transparent;
    }

    .search-lens::after {
      content: "";
      position: absolute;
      right: 3px;
      bottom: 5px;
      width: 10px;
      height: 2px;
      border-radius: 999px;
      background: #e1c77c;
      transform: rotate(45deg);
      transform-origin: left center;
    }

    .search-progress-strip {
      position: absolute;
      left: 3px;
      right: 3px;
      bottom: 3px;
      z-index: 5;
      height: 3px;
      overflow: hidden;
      background: #454747;
      pointer-events: none;
    }

    .search-progress-strip::before {
      content: "";
      display: block;
      width: calc(var(--scan-progress, 0) * 100%);
      height: 100%;
      background: #c7a96b;
    }

    @keyframes searchLensSpin {
      to { rotate: 360deg; }
    }

    .red-sketch {
      width: min(34px, 72%);
      height: min(30px, 70%);
      display: block;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.38));
    }

    .red-sketch path,
    .red-sketch circle,
    .red-sketch line,
    .red-sketch rect {
      fill: none;
      stroke: #f4d7bf;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .grid-empty {
      grid-column: 1 / -1;
      align-self: center;
      justify-self: center;
      color: var(--paper-dim);
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
    }

    .tier-1 { color: #b9ae96; }
    .tier-2 { color: #5e9b83; }
    .tier-3 { color: #79a9c6; }
    .tier-4 { color: #b19ad6; }
    .tier-5 { color: #c7a96b; }
    .tier-6 { color: #b45f48; }

    @keyframes scanSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes modalBackdropEnter {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes compactModalEnter {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.96);
        filter: blur(4px);
      }
      66% {
        opacity: 1;
        transform: translateY(-2px) scale(1.01);
        filter: blur(0);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .controls {
      position: absolute;
      right: 20px;
      bottom: 20px;
      display: none;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 6px;
    }

    .controls button {
      border: 1px solid rgba(164, 138, 82, 0.42);
      background: rgba(7, 16, 13, 0.72);
      color: var(--paper);
      font-size: 20px;
    }

    .controls button[data-dir="up"] { grid-column: 2; }
    .controls button[data-dir="left"] { grid-column: 1; grid-row: 2; }
    .controls button[data-dir="right"] { grid-column: 3; grid-row: 2; }
    .controls button[data-dir="down"] { grid-column: 2; grid-row: 3; }

    .skill-dock {
      position: absolute;
      right: 20px;
      bottom: 20px;
      z-index: 7;
      display: flex;
      flex-wrap: wrap-reverse;
      gap: 8px;
      align-items: flex-end;
      justify-content: flex-end;
      align-content: flex-end;
      max-width: min(448px, calc(100% - 40px));
      pointer-events: none;
    }

    .skill-chip {
      --cooldown-progress: 0;
      width: 58px;
      min-height: 64px;
      display: grid;
      place-items: center;
      gap: 4px;
      padding: 6px 5px 5px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(164, 138, 82, 0.34);
      border-radius: 8px;
      background: rgba(7, 16, 13, 0.72);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
    }

    .skill-key {
      position: absolute;
      right: 4px;
      top: 4px;
      z-index: 2;
      min-width: 18px;
      max-width: 48px;
      height: 16px;
      padding: 0 4px;
      border: 1px solid rgba(230, 221, 200, 0.32);
      border-radius: 5px;
      background: rgba(7, 16, 13, 0.86);
      color: var(--paper);
      font-size: 9px;
      font-weight: 800;
      line-height: 14px;
      text-align: center;
      white-space: nowrap;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    .skill-key.passive-key {
      left: 4px;
      right: auto;
      max-width: 34px;
      color: rgba(230, 221, 200, 0.7);
      font-size: 8px;
    }

    .skill-chip.ready,
    .skill-chip.passive {
      border-color: rgba(199, 169, 107, 0.88);
      background: rgba(28, 34, 25, 0.82);
      box-shadow: 0 0 22px rgba(199, 169, 107, 0.2), 0 14px 30px rgba(0, 0, 0, 0.25);
    }

    .skill-chip.active {
      border-color: rgba(125, 191, 164, 0.92);
      box-shadow: 0 0 24px rgba(125, 191, 164, 0.24), 0 14px 30px rgba(0, 0, 0, 0.24);
    }

    .skill-chip.pet-skill,
    .skill-chip.accent-skill {
      border-color: color-mix(in srgb, var(--skill-accent, var(--gold-bright)) 58%, transparent);
    }

    .skill-chip.pet-skill .skill-icon,
    .skill-chip.accent-skill .skill-icon {
      color: var(--skill-accent, var(--gold-bright));
      filter: drop-shadow(0 0 8px color-mix(in srgb, var(--skill-accent, var(--gold-bright)) 54%, transparent));
    }

    .skill-chip.cooling::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(7, 16, 13, 0.78) var(--cooldown-progress), transparent 0);
      pointer-events: none;
    }

    .skill-chip.cooling {
      color: rgba(230, 221, 200, 0.42);
      filter: saturate(0.58);
    }

    .skill-icon,
    .skill-icon i {
      display: block;
      position: relative;
      box-sizing: border-box;
    }

    .skill-icon {
      width: 34px;
      height: 34px;
      z-index: 1;
      color: var(--gold-bright);
    }

    .skill-chip.active .skill-icon {
      color: var(--jade);
    }

    .skill-icon-orbs {
      border: 1px dashed rgba(199, 169, 107, 0.55);
      border-radius: 50%;
    }

    .skill-icon-orbs::before,
    .skill-icon-orbs::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border: 2px solid currentColor;
      border-radius: 50%;
      background: rgba(199, 169, 107, 0.18);
      box-shadow: 0 0 10px currentColor;
    }

    .skill-icon-orbs::before {
      right: 1px;
      top: 4px;
    }

    .skill-icon-orbs::after {
      left: 2px;
      bottom: 4px;
    }

    .skill-icon-teleport {
      border: 2px dashed currentColor;
      border-radius: 50%;
    }

    .skill-icon-teleport::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 8px;
      width: 13px;
      height: 13px;
      border-top: 2px solid currentColor;
      border-right: 2px solid currentColor;
      transform: rotate(45deg);
    }

    .skill-icon-claw i {
      position: absolute;
      left: 8px;
      top: 7px;
      width: 20px;
      height: 4px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 10px rgba(125, 191, 164, 0.45);
    }

    .skill-icon-claw i:nth-child(1) { transform: rotate(-26deg); }
    .skill-icon-claw i:nth-child(2) { top: 15px; transform: rotate(-8deg); }
    .skill-icon-claw i:nth-child(3) { top: 23px; transform: rotate(18deg); }

    .skill-icon-execute::before {
      content: "☆";
      position: absolute;
      inset: -2px 0 0;
      display: grid;
      place-items: center;
      color: currentColor;
      font: 28px/1 serif;
      text-shadow: 0 0 12px currentColor;
    }

    .skill-icon-execute::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 8px;
      width: 18px;
      height: 18px;
      border: 1px dashed currentColor;
      border-radius: 50%;
      opacity: 0.58;
    }

    .skill-icon-beam::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 15px;
      width: 26px;
      height: 4px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 14px rgba(125, 191, 164, 0.5);
    }

    .skill-icon-beam::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 9px;
      width: 9px;
      height: 16px;
      border: 2px solid currentColor;
      border-radius: 8px 2px 2px 8px;
    }

    .skill-icon-iceball::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 8px;
      width: 18px;
      height: 18px;
      border: 2px solid currentColor;
      transform: rotate(45deg);
      background: rgba(125, 191, 164, 0.12);
      box-shadow: 0 0 12px rgba(125, 191, 164, 0.42);
    }

    .skill-icon-iceball::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 16px;
      width: 22px;
      height: 2px;
      background: currentColor;
      box-shadow: 0 -7px 0 rgba(125, 191, 164, 0.36), 0 7px 0 rgba(125, 191, 164, 0.36);
    }

    .skill-icon-mirror {
      transform: rotate(45deg);
      border: 2px solid currentColor;
      background: rgba(238, 243, 255, 0.08);
      box-shadow: inset 0 0 10px rgba(238, 243, 255, 0.18), 0 0 12px currentColor;
    }

    .skill-icon-bloodmirror {
      transform: rotate(45deg);
      border: 2px solid currentColor;
      background: rgba(111, 36, 34, 0.24);
      color: #e58f70;
      box-shadow: inset 0 0 12px rgba(229, 143, 112, 0.28), 0 0 14px rgba(229, 143, 112, 0.72);
    }

    .skill-icon-moonblade {
      border: 2px solid currentColor;
      border-radius: 50%;
      background: radial-gradient(circle at 62% 38%, rgba(225, 185, 86, 0.16), rgba(13, 12, 10, 0.12));
      box-shadow: inset 0 0 10px rgba(225, 185, 86, 0.18), 0 0 12px rgba(225, 185, 86, 0.42);
    }

    .skill-icon-moonblade::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 5px;
      width: 17px;
      height: 22px;
      border-right: 4px solid currentColor;
      border-radius: 50%;
      transform: rotate(28deg);
      filter: drop-shadow(0 0 8px currentColor);
    }

    .skill-icon-moonblade::after {
      content: "";
      position: absolute;
      left: 13px;
      top: 13px;
      width: 8px;
      height: 8px;
      border: 2px solid currentColor;
      transform: rotate(45deg);
      background: rgba(225, 185, 86, 0.18);
    }

    .skill-icon-shade {
      border: 2px solid currentColor;
      border-radius: 50%;
      background: rgba(238, 243, 255, 0.08);
    }

    .skill-icon-shade::before,
    .skill-icon-shade::after {
      content: "";
      position: absolute;
      border: 2px solid currentColor;
      transform: rotate(45deg);
    }

    .skill-icon-shade::before {
      left: 8px;
      top: 8px;
      width: 12px;
      height: 12px;
    }

    .skill-icon-shade::after {
      left: -1px;
      top: 17px;
      width: 12px;
      height: 12px;
      opacity: 0.58;
    }

    .skill-icon-switch {
      border: 2px solid currentColor;
      border-radius: 50%;
      background: rgba(230, 221, 200, 0.06);
    }

    .skill-icon-switch::before,
    .skill-icon-switch::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 8px;
      border: 2px solid currentColor;
      border-right: 0;
      border-bottom: 0;
      border-radius: 12px 0 0 0;
    }

    .skill-icon-switch::before {
      left: 6px;
      top: 8px;
      transform: rotate(16deg);
    }

    .skill-icon-switch::after {
      right: 6px;
      bottom: 8px;
      transform: rotate(196deg);
    }

    .skill-icon-pet-damage,
    .skill-icon-pet-heal,
    .skill-icon-pet-shield,
    .skill-icon-pet-cool {
      border-radius: 50%;
      border: 2px solid currentColor;
      background: rgba(230, 221, 200, 0.08);
    }

    .skill-icon-pet-damage::before,
    .skill-icon-pet-heal::before,
    .skill-icon-pet-shield::before,
    .skill-icon-pet-cool::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 8px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid currentColor;
      background: rgba(7, 16, 13, 0.42);
      box-shadow: 0 0 12px currentColor;
    }

    .skill-icon-pet-damage::before {
      left: 7px;
      top: 7px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 14px currentColor;
    }

    .skill-icon-pet-damage::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 5px;
      width: 23px;
      height: 23px;
      background: currentColor;
      clip-path: polygon(50% 0, 62% 34%, 100% 20%, 72% 50%, 100% 80%, 62% 66%, 50% 100%, 38% 66%, 0 80%, 28% 50%, 0 20%, 38% 34%);
      filter: drop-shadow(0 0 8px currentColor);
    }

    .skill-icon-pet-heal::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 8px;
      width: 18px;
      height: 18px;
      background:
        linear-gradient(90deg, transparent 0 6px, currentColor 6px 12px, transparent 12px),
        linear-gradient(0deg, transparent 0 6px, currentColor 6px 12px, transparent 12px);
      filter: drop-shadow(0 0 6px currentColor);
    }

    .skill-icon-pet-shield::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 5px;
      width: 18px;
      height: 22px;
      border: 2px solid currentColor;
      border-radius: 10px 10px 12px 12px;
      clip-path: polygon(50% 0, 100% 18%, 86% 78%, 50% 100%, 14% 78%, 0 18%);
      background: rgba(125, 191, 164, 0.12);
    }

    .skill-icon-pet-cool::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 8px;
      width: 19px;
      height: 16px;
      border: 2px solid currentColor;
      border-radius: 55% 55% 60% 60%;
      transform: rotate(45deg);
      background: rgba(132, 196, 128, 0.12);
      filter: drop-shadow(0 0 7px currentColor);
    }

    .skill-label,
    .skill-timer {
      z-index: 1;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }

    .skill-label {
      max-width: 48px;
      overflow: hidden;
      color: var(--paper);
      font-size: 10px;
      text-overflow: ellipsis;
    }

    .skill-timer {
      min-height: 12px;
      color: var(--gold-bright);
      font-size: 11px;
      font-weight: 700;
    }

    .interact-button {
      position: absolute;
      left: 20px;
      bottom: 20px;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid rgba(164, 138, 82, 0.54);
      background: rgba(164, 138, 82, 0.12);
      color: var(--paper);
      cursor: pointer;
    }

    .interact-button:disabled {
      color: rgba(230, 221, 200, 0.35);
      border-color: rgba(230, 221, 200, 0.12);
      background: rgba(255, 255, 255, 0.025);
      cursor: default;
    }

    @media (max-width: 820px) {
      .game-page {
        grid-template-rows: auto minmax(620px, 78svh);
        padding: 10px;
      }

      .topbar {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .readout {
        width: 100%;
        margin-left: 60px;
        flex-wrap: wrap;
      }

      .field-status {
        top: 12px;
        left: 12px;
        width: min(230px, calc(100% - 24px));
      }

      .commission-hud {

    function firstPouchPlacementAtSlot(loot, slot, ignoreLoot = null, preferred = itemOrientation(loot)) {
      if (!secretPouchUnlocked || itemSize(loot) > secretPouchSlots) return null;
      for (const orientation of orientationCandidates(loot, preferred)) {
        if (pouchSlotFits(slot, loot, ignoreLoot, orientation)) return { slot, orientation };
      }
      return null;
    }

    function firstFreePouchPlacement(loot, ignoreLoot = null, preferred = itemOrientation(loot)) {
      for (let slot = 0; slot < secretPouchSlots; slot += 1) {
        const placement = firstPouchPlacementAtSlot(loot, slot, ignoreLoot, preferred);
        if (placement) return placement;
      }
      return null;
    }

    function applyPouchPlacementToLoot(loot, placement) {
      loot.pouchSlot = placement.slot;
      loot.pouchOrientation = placement.orientation;
      delete loot.bagSlot;
      delete loot.orientation;
    }

    function firstPlacementAtSlot(loot, slot, ignoreLoot = null, preferred = itemOrientation(loot)) {
      for (const orientation of orientationCandidates(loot, preferred)) {
        if (slotFits(slot, loot, ignoreLoot, orientation)) return { slot, orientation };
      }
      return null;
    }

    function firstFreeBagPlacement(loot, ignoreLoot = null, preferred = itemOrientation(loot)) {
      for (let slot = 0; slot < fieldContainerLimit(); slot += 1) {
        const placement = firstPlacementAtSlot(loot, slot, ignoreLoot, preferred);
        if (placement) return placement;
      }
      return null;
    }

    function firstFreeBagSlot(loot, ignoreLoot = null) {
      const placement = firstFreeBagPlacement(loot, ignoreLoot);
      return placement ? placement.slot : -1;
    }

    function packedPlacementSlots(slot, loot, orientation, limit, columns) {
      const footprint = itemFootprint(loot, orientation);
      if (slot < 0 || slot >= limit || slot % columns + footprint.width > columns) return null;
      const slots = [];
      for (let row = 0; row < footprint.height; row += 1) {
        for (let column = 0; column < footprint.width; column += 1) {
          const targetSlot = slot + row * columns + column;
          if (targetSlot >= limit) return null;
          slots.push(targetSlot);
        }
      }
      return slots;
    }

    function findPackedPlacement(loot, occupied, limit, columns, preferred = itemOrientation(loot)) {
      let best = null;
      for (const orientation of orientationCandidates(loot, preferred)) {
        for (let slot = 0; slot < limit; slot += 1) {
          const slots = packedPlacementSlots(slot, loot, orientation, limit, columns);
          if (!slots || slots.some((targetSlot) => occupied.has(targetSlot))) continue;
          const score = Math.max(...slots) * 10 + Math.floor(slot / columns) + (orientation === preferred ? 0 : 0.2);
          if (!best || score < best.score) best = { slot, orientation, slots, score };
        }
      }
      return best;
    }

    function autoArrangeBackpack(extraLoot = null) {
      const limit = fieldContainerLimit();
      const columns = inventoryColumnCount();
      const items = extraLoot ? [...activeBackpack(), extraLoot] : [...activeBackpack()];
      const totalSize = items.reduce((sum, loot) => sum + itemSize(loot), 0);
      if (totalSize > limit) return null;
      const occupied = new Set();
      const sorted = items
        .map((loot, order) => ({ loot, order }))
        .sort((a, b) => {
          const aFootprint = itemFootprint(a.loot);
          const bFootprint = itemFootprint(b.loot);
          return itemSize(b.loot) - itemSize(a.loot) ||
            Math.max(bFootprint.width, bFootprint.height) - Math.max(aFootprint.width, aFootprint.height) ||
            a.order - b.order;
        });
      const placements = new Map();
      for (const entry of sorted) {
        const placement = findPackedPlacement(entry.loot, occupied, limit, columns);
        if (!placement) return null;
        placement.slots.forEach((slot) => occupied.add(slot));
        placements.set(entry.loot, { slot: placement.slot, orientation: placement.orientation });
      }
      return placements;
    }

    function applyPackedPlacements(placements) {
      placements.forEach((placement, loot) => {
        loot.bagSlot = placement.slot;
        loot.orientation = placement.orientation;
      });
    }

    function placeLootInBackpack(loot, preferredSlot = null) {
      let placement = preferredSlot === null
        ? firstFreeBagPlacement(loot)
        : firstPlacementAtSlot(loot, Number(preferredSlot));
      if (placement) {
        loot.bagSlot = placement.slot;
        loot.orientation = placement.orientation;
        return { placed: true, arranged: false };
      }
      if (preferredSlot !== null) return { placed: false, arranged: false };
      const arranged = autoArrangeBackpack(loot);
      if (!arranged) return { placed: false, arranged: false };
      applyPackedPlacements(arranged);
      return { placed: true, arranged: true };
    }

    function applyPlacementToLoot(loot, placement) {
      loot.bagSlot = placement.slot;
      loot.orientation = placement.orientation;
    }

    function rotateBagItem(index) {
      const loot = activeBackpack()[index];
      if (!loot || itemSize(loot) <= 1) return false;
      const targetOrientation = alternateOrientation(itemOrientation(loot));
      if (!slotFits(Number(loot.bagSlot), loot, loot, targetOrientation)) {
        promptEl.innerHTML = `「${loot.item}」旁边没有足够空间竖放或横放。`;
        renderHud();
        return false;
      }
      loot.orientation = targetOrientation;
      renderedBagSignature = "";
      promptEl.innerHTML = targetOrientation === "vertical"
        ? `你把「${loot.item}」竖着放好了。`
        : `你把「${loot.item}」横着放好了。`;
      renderHud();
      return true;
    }

    function arrangeBackpackFromItem(index = -1) {
      ensureBackpackLayout();
      const loot = activeBackpack()[index] || null;
      const placements = autoArrangeBackpack();
      if (!placements) {
        promptEl.innerHTML = `${fieldContainerName()}暂时理不开，先丢掉一点东西再整理。`;
        renderHud();
        return false;
      }
      applyPackedPlacements(placements);
      renderedBagSignature = "";
      promptEl.innerHTML = loot
        ? `你以「${loot.item}」为起点，重新整理了${fieldContainerName()}。`
        : `你重新整理了${fieldContainerName()}。`;
      renderHud();
      return true;
    }

    function ensureBackpackLayout() {
      let repaired = false;
      activeBackpack().forEach((loot) => {
        const current = Number(loot.bagSlot);
        if (!Number.isFinite(current) || !slotFits(current, loot, loot)) repaired = true;
      });
      if (repaired) {
        const placements = autoArrangeBackpack();
        if (placements) applyPackedPlacements(placements);
      }
    }

    function canFitBackpack(loot) {
      ensureBackpackLayout();
      return Boolean(firstFreeBagPlacement(loot) || autoArrangeBackpack(loot));
    }

    function isBisonCore(loot) {
      return loot?.special === "bisonCore";
    }

    function bisonCoreIndex() {
      const firstIndex = fieldBackpack.findIndex(isBisonCore);
      if (firstIndex >= 0) return { owner: 1, index: firstIndex };
      const secondIndex = fieldBackpackP2.findIndex(isBisonCore);
      return secondIndex >= 0 ? { owner: 2, index: secondIndex } : { owner: 0, index: -1 };
    }

    function hasBisonCore() {
      return bisonCoreIndex().index >= 0;
    }

    function submitBisonCore() {
      const found = bisonCoreIndex();
      if (found.index < 0) return false;
      activeBackpack(found.owner).splice(found.index, 1);
      renderedBagSignature = "";
      return true;
    }

    function isBreakerLootSource(thing) {
      return Boolean(
        thing
        && (thing.name === "停车场电闸" || thing.container === "电闸检修箱" || thing.eventType === "blackout")
      );
    }

    function materialLootForTier(tierId, density, thing = null) {
      const base = {
        1: { cloth: 1 },
        2: { cloth: 1, metal: 1 },
        3: { cloth: 1, metal: 2 },
        4: { metal: 2, thread: 1 },
        5: { metal: 3, thread: 2, crystal: 1 },
        6: { metal: 4, thread: 3, crystal: 2 }
      };
      const gained = { ...(base[tierId] || base[1]) };
      if (density === "parts") gained.metal = (gained.metal || 0) + 1;
      if (density === "ornament") gained.crystal = (gained.crystal || 0) + (tierId >= 4 ? 1 : 0);
      if (density === "food") gained.cloth = (gained.cloth || 0) + 1;
      if (density === "boss") {
        gained.metal = (gained.metal || 0) + 2;
        gained.crystal = (gained.crystal || 0) + 1;
      }
      if (isBreakerLootSource(thing)) {
        gained.metal = (gained.metal || 0) + 2;
        if (tierId >= 4) gained.thread = (gained.thread || 0) + 1;
        if (tierId >= 5) gained.crystal = (gained.crystal || 0) + 1;
      }
      return gained;
    }

      if (thing.density === "lockedRare") return weightedPick(lockedRare);
      if (thing.density === "lockedHigh") return weightedPick(lockedHigh);
      return weightedPick(thing.density === "rare" ? rare : thing.density === "high" ? high : focused);

    function rollLootCount(thing) {
      if (isBreakerLootSource(thing)) {
        return weightedPick([
          { value: 3, weight: 35 },
          { value: 4, weight: 45 },
          { value: 5, weight: 20 }
        ]);
      }
      if (thing.density === "sss") return weightedPick([{ value: 4, weight: 35 }, { value: 5, weight: 45 }, { value: 6, weight: 20 }]);
      if (thing.density === "boss") return weightedPick([{ value: 4, weight: 44 }, { value: 5, weight: 38 }, { value: 6, weight: 18 }]);
      if (thing.density === "ai") return weightedPick([{ value: 2, weight: 48 }, { value: 3, weight: 38 }, { value: 4, weight: 14 }]);
      if (thing.density === "lockedVault") return weightedPick([{ value: 4, weight: 32 }, { value: 5, weight: 46 }, { value: 6, weight: 22 }]);
      if (thing.density === "lockedRare") return weightedPick([{ value: 3, weight: 36 }, { value: 4, weight: 44 }, { value: 5, weight: 20 }]);
      if (thing.density === "lockedHigh") return weightedPick([{ value: 2, weight: 28 }, { value: 3, weight: 48 }, { value: 4, weight: 24 }]);
      if (thing.density === "rare") return weightedPick([{ value: 1, weight: 70 }, { value: 2, weight: 28 }, { value: 3, weight: 2 }]);
      if (thing.density === "high") return randomInt(2, 3);
      return weightedPick([{ value: 1, weight: 78 }, { value: 2, weight: 20 }, { value: 3, weight: 2 }]);
    }

    function cardTypeForExit(exitMode) {
      const entry = Object.entries(cardDefs).find(([, card]) => card.exitMode === exitMode);
      return entry ? entry[0] : "";
    }

    function cardTypeForThing(thing) {
      if (!thing) return "";
      if (thing.lockedCard && cardDefs[thing.lockedCard]) return thing.lockedCard;
      if (thing.exitMode) return cardTypeForExit(thing.exitMode);
      return "";
    }

    function cardForAccessType(type) {
      if (!type) return null;
      return [...cardPack]
        .filter((card) => card?.type === type)
        .sort((a, b) => accessCardSuccessRate(b) - accessCardSuccessRate(a) || b.uses - a.uses)[0] || null;
    }

    function cardForExit(exitMode) {
      return cardForAccessType(cardTypeForExit(exitMode));
    }

    function hasCardForExit(exitMode) {
      return Boolean(cardForExit(exitMode));
    }

    function cardForLockedThing(thing) {
      return cardForAccessType(cardTypeForThing(thing));
    }

    function lockedThingUnlocked(thing) {
      return !thing?.lockedCard || investigatedThings.has(thing.name);
    }

    function lockedThingCardName(thing) {
      const def = cardDefs[cardTypeForThing(thing)];
      return def ? def.name : "互动卡";
    }

    function accessCardTargets(type) {
      if (!type || !cardDefs[type]) return [];
      const targets = [];
      things.forEach((thing) => {
        if (!thing) return;
        const targetType = cardTypeForThing(thing);
        if (targetType !== type) return;
        const mode = thing.type === "exit" ? "撤离/通行" : "锁定搜索点";
        targets.push(`${thing.name}（${thing.area || mode}）`);
      });
      return [...new Set(targets)];
    }

    function accessCardDetailLines(card) {
      const normalized = normalizeAccessCard(card);
      if (!normalized) return [];
      const quality = cardQualityDefs[normalized.quality];
      const def = cardDefs[normalized.type];
      const targets = accessCardTargets(normalized.type);
      return [
        `${normalized.tier} · ${normalized.uses}/${normalized.maxUses}次 · 基础成功率${Math.round(accessCardSuccessRate(normalized) * 100)}%`,
        `属性：${quality.name}权限，${def.name}，失败不消耗次数。`,
        `用途：${targets.length ? targets.join("、") : "当前地图没有对应刷卡点。"}`
      ];
    }

    function removeCardFromPack(card) {
      const index = cardPack.findIndex((entry) => entry?.id === card?.id);
      if (index >= 0) cardPack.splice(index, 1);
      if (selectedCardId === card?.id) {
        selectedCardId = "";
        renderItemDetail(null);
      }
      renderedCardPackSignature = "";
    }

    function tryPutCardInPack(loot) {
      if (loot?.special !== "accessCard" || cardPack.length >= cardPackSlots) return false;
      cardPack.push(normalizeAccessCard(loot));
      renderedCardPackSignature = "";
      return true;
    }

    function useAccessCardForExit(exitThing) {
      const card = cardForExit(exitThing.exitMode);
      if (!card) {
        promptEl.innerHTML = `<strong>${exitThing.name}</strong>：缺少对应互动卡。`;
        return false;
      }

      const successRate = accessCardSuccessRate(card);
      if (Math.random() >= successRate) {
        promptEl.innerHTML = `<strong>${exitThing.name}</strong>：${card.item} 失败。`;
        playCombatCue("cardFail", exitThing.x, exitThing.y, 0.8);
        renderCardPack(true);
        return false;
      }

      card.uses -= 1;
      if (card.uses <= 0) {
        removeCardFromPack(card);
        promptEl.innerHTML = `<strong>${exitThing.name}</strong>：通过，卡已耗尽。`;
      } else {
        renderedCardPackSignature = "";
        promptEl.innerHTML = `<strong>${exitThing.name}</strong>：通过，剩 ${card.uses} 次。`;
      }
      playCombatCue("cardPass", exitThing.x, exitThing.y, 0.85);
      renderCardPack(true);
      return true;
    }

    function useAccessCardForLockedThing(thing) {
      if (!thing?.lockedCard) return true;
      if (lockedThingUnlocked(thing)) return true;
      const card = cardForLockedThing(thing);
      if (!card) {
        promptEl.innerHTML = `<strong>${thing.name}</strong>：需要${lockedThingCardName(thing)}。`;
        renderHud();
        return false;
      }

      const successRate = Math.min(0.98, accessCardSuccessRate(card) + 0.06);
      if (Math.random() >= successRate) {
        promptEl.innerHTML = `<strong>${thing.name}</strong>：${card.item} 刷卡失败，卡未损坏。`;
        playCombatCue("cardFail", thing.x, thing.y, 0.82);
        renderCardPack(true);
        renderHud();
        return false;
      }

      card.uses -= 1;
      if (card.uses <= 0) {
        removeCardFromPack(card);
      } else {
        renderedCardPackSignature = "";
      }
      investigatedThings.add(thing.name);
      recordParkingInvestigation(thing);
      promptEl.innerHTML = `<strong>${thing.name}</strong>：门禁通过，可以搜索。`;
      playCombatCue("cardPass", thing.x, thing.y, 0.9);
      renderCardPack(true);
      renderHud();
      return true;
    }

    function rollSSSCollectionRedCount(total) {
      const maxRed = Math.min(3, Math.max(1, total));
      const entries = [
        { value: 1, weight: 68 },
        { value: 2, weight: 26 },
        { value: 3, weight: 6 }
      ].filter((entry) => entry.value <= maxRed);
      return weightedPick(entries);
    }

    function rollSSSCollectionSupportTier() {
      return weightedPick([
        { value: 4, weight: 62 },
        { value: 5, weight: 38 }
      ]);
    }

    function shuffleDrops(drops, total) {
      for (let index = drops.length - 1; index > 0; index -= 1) {
        const swapIndex = randomInt(0, index);
        [drops[index], drops[swapIndex]] = [drops[swapIndex], drops[index]];
      }
      drops.forEach((drop, index) => {
        drop.dropIndex = index + 1;
        drop.dropTotal = total;
      });
      return drops;
    }

    function createSSSCollectionDrops(thing, total) {
      const redCount = rollSSSCollectionRedCount(total);
      const drops = [];
      for (let index = 0; index < redCount; index += 1) {
        drops.push(createSSSCollectionDrop(thing, drops.length, total));
      }
      while (drops.length < total) {
        drops.push(createLootDrop(thing, drops.length, total, rollSSSCollectionSupportTier()));
      }
      return shuffleDrops(drops, total);
    }

    function syncPendingLootFromContainer() {
      pendingLoot = containerLoot[0] || null;
      pendingLootQueue.length = 0;
    }

    function setContainerLoot(loots, sourceName, activatePending = true) {
      containerLoot.length = 0;
      containerLoot.push(...loots);
      activeContainerName = sourceName || "散落物";
      renderedContainerSignature = "";
      if (activatePending) {
        syncPendingLootFromContainer();
      } else {
        pendingLoot = null;
        pendingLootQueue.length = 0;
      }
    }

    function clearContainerLoot(message = "") {
      const count = containerLoot.length;
      containerLoot.length = 0;
      activeContainerName = "空";
      renderedContainerSignature = "";
      syncPendingLootFromContainer();
      if (message || count) {
        promptEl.innerHTML = message || `你把剩余 ${count} 件物品留在停车场。`;
      }
    }

    function parseSaveData() {
      try {
        return JSON.parse(localStorage.getItem(saveKey) || "null") || {};
      } catch {
        return {};
      }
    }

    function writeSaveData(saveData) {
      try {
        localStorage.setItem(saveKey, JSON.stringify(saveData));
        return true;
      } catch {
        return false;
      }
    }

    function normalizeParkingStats(raw = {}) {
      const recent = Array.isArray(raw?.recent) ? raw.recent : [];
      return {
        runs: Math.max(0, Number(raw?.runs || 0)),
        extracts: Math.max(0, Number(raw?.extracts || 0)),
        deaths: Math.max(0, Number(raw?.deaths || 0)),
        kills: Math.max(0, Number(raw?.kills || 0)),
        totalAssets: Math.max(0, Number(raw?.totalAssets || 0)),
        recent: recent.map((run, index) => ({
          id: String(run?.id || `parking-recent-${index}`),
          at: Math.max(0, Number(run?.at || 0)),
          map: String(run?.map || "停车场"),
          result: run?.result === "撤离" ? "撤离" : "迷失",
          character: String(run?.character || "干员"),
          kills: Math.max(0, Number(run?.kills || 0)),
          assets: Math.max(0, Number(run?.assets || 0)),
          items: Math.max(0, Number(run?.items || 0))
        })).slice(0, 5)
      };
    }

    function lootAssetValue(items = []) {
      return items.reduce((total, loot) => total + itemValue(loot), 0);
    }

    function recordParkingRunStats(saveData, result, returnedItems = []) {
      const stats = normalizeParkingStats(saveData.parkingStats);
      const assets = lootAssetValue(returnedItems);
      const extracted = result === "extract";
      stats.runs += 1;
      if (extracted) stats.extracts += 1;
      if (!extracted) stats.deaths += 1;
      stats.kills += runDefeats;
      stats.totalAssets += assets;
      stats.recent = [
        {
          id: `parking-run-${Date.now()}-${Math.random().toString(36).slice(2)}`,
          at: Date.now(),
          map: "停车场",
          result: extracted ? "撤离" : "迷失",
          character: characterDisplayInfo(selectedCharacter)?.name || "干员",
          kills: runDefeats,
          assets,
          items: returnedItems.length
        },
        ...stats.recent
      ].slice(0, 5);
      saveData.parkingStats = stats;
    }

    function mergeAccessCards(existingCards, newCards) {
      const byId = new Map();
      [...(existingCards || []), ...(newCards || [])]
        .map(normalizeAccessCard)
        .filter(Boolean)
        .forEach((card) => byId.set(card.id, card));
      return [...byId.values()];
    }

    function commissionDateKey(date = new Date()) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function defaultCommissionDailyProgress() {
      return {
        mistBuildingsSearchedToday: 0,
        mistOutpostClaimsToday: 0,
        parkingInvestigatedToday: [],
        parkingAreasInvestigatedToday: [],
        parkingSearchesToday: 0,
        parkingExtractsToday: 0,
        parkingBestLootReturnedToday: 0,
        parkingHighTierReturnedToday: 0,
        parkingKeyItemsReturnedToday: 0
      };
    }

    function normalizeParkingCommissions(raw = {}) {
      const today = commissionDateKey();
      const daily = raw?.daily?.date === today ? raw.daily : {};
      return {
        main: {
          claimed: { ...(raw?.main?.claimed || {}) },
          parkingAreasInvestigated: [...new Set(raw?.main?.parkingAreasInvestigated || [])],
          parkingLocationsInvestigated: [...new Set(raw?.main?.parkingLocationsInvestigated || [])],
          charactersTried: [...new Set(raw?.main?.charactersTried || [])],
          skillUsesByInvestigator: { ...(raw?.main?.skillUsesByInvestigator || {}) },
          defeatsByInvestigator: { ...(raw?.main?.defeatsByInvestigator || {}) },
          extractsByInvestigator: { ...(raw?.main?.extractsByInvestigator || {}) },
          craftedBackpackLevel: Math.max(0, Number(raw?.main?.craftedBackpackLevel || 0)),
          craftedArmorTier: Math.max(0, Number(raw?.main?.craftedArmorTier || 0)),
          oldCarInvestigated: Boolean(raw?.main?.oldCarInvestigated),
          bisonCoreReturned: Boolean(raw?.main?.bisonCoreReturned)
        },
        daily: {
          date: today,
          claimed: { ...(daily.claimed || {}) },
          selected: Array.isArray(daily.selected) ? daily.selected : [],
          milestoneClaimed: { ...(daily.milestoneClaimed || {}) },
          progress: {
            ...defaultCommissionDailyProgress(),
            ...(daily.progress || {}),
            parkingInvestigatedToday: [...new Set(daily.progress?.parkingInvestigatedToday || [])],
            parkingAreasInvestigatedToday: [...new Set(daily.progress?.parkingAreasInvestigatedToday || [])]
          }
        }
      };
    }

    function readParkingCommissions() {
      return normalizeParkingCommissions(parseSaveData().commissions);
    }

    function parkingCommissionMetricValue(commissions, metric) {
      const mainProgress = commissions.main;
      const dailyProgress = commissions.daily.progress;
      if (metric === "mistRouteCleared") return hasMistRouteClearPass() ? 1 : 0;
      if (metric.startsWith("parkingLocation:")) {
        return mainProgress.parkingLocationsInvestigated.includes(metric.slice("parkingLocation:".length)) ? 1 : 0;
      }
      if (metric.startsWith("skillUses:")) {
        return Number(mainProgress.skillUsesByInvestigator[metric.slice("skillUses:".length)] || 0);
      }
      if (metric.startsWith("defeatsByInvestigator:")) {
        return Number(mainProgress.defeatsByInvestigator[metric.slice("defeatsByInvestigator:".length)] || 0);
      }
      if (metric.startsWith("extractsByInvestigator:")) {
        return Number(mainProgress.extractsByInvestigator[metric.slice("extractsByInvestigator:".length)] || 0);
      }
      if (metric === "craftedBackpackLevel") return Number(mainProgress.craftedBackpackLevel || 0);
      if (metric === "craftedArmorTier") return Number(mainProgress.craftedArmorTier || 0);
      if (metric === "bisonCoreReturned") {
        return mainProgress.bisonCoreReturned || [...allBackpackItems(), ...secretPouchItems].some(isBisonCore) ? 1 : 0;
      }
      if (Array.isArray(dailyProgress[metric])) return dailyProgress[metric].length;
      return Number(dailyProgress[metric] || 0);
    }

    function parkingCommissionComplete(def, commissions) {
      return def.objectives.every((objective) => parkingCommissionMetricValue(commissions, objective.metric) >= objective.target);
    }

    function parkingCommissionClaimed(def, group, commissions) {
      return Boolean(group === "daily" ? commissions.daily.claimed[def.id] : commissions.main.claimed[def.id]);
    }

    function orderedParkingMainCommissions() {
      return [...commissionDefs.main].sort((a, b) => (a.stage || 0) - (b.stage || 0));
    }

    function currentParkingMainCommission(commissions) {
      return orderedParkingMainCommissions().find((def) => !parkingCommissionClaimed(def, "main", commissions)) || null;
    }

    function activeParkingDailyCommissions(commissions) {
      return commissionDefs.daily.filter((def) => !parkingCommissionClaimed(def, "daily", commissions));
    }

    function parkingCommissionSummary(def, commissions) {
      return def.objectives.reduce((summary, objective) => {
        summary.value += Math.min(parkingCommissionMetricValue(commissions, objective.metric), objective.target);
        summary.target += objective.target;
        return summary;
      }, { value: 0, target: 0 });
    }

    function parkingCommissionCardHtml(def, group, commissions) {
      const done = parkingCommissionComplete(def, commissions);
      const summary = parkingCommissionSummary(def, commissions);
      const objectiveItems = def.objectives.map((objective) => {
        const value = Math.min(parkingCommissionMetricValue(commissions, objective.metric), objective.target);
        return `<li><span>${escapeHtml(objective.label)}</span><em>${value}/${objective.target}</em></li>`;
      }).join("");
      return `
        <article class="commission-hud-card ${done ? "done" : ""}">
          <strong>${escapeHtml(def.name)}</strong>
          <span>${escapeHtml(group === "main" ? `主线阶段 ${def.stage}/12` : def.typeLabel)} · ${done ? "可回备战页领奖" : `${summary.value}/${summary.target}`}</span>
          <ul>${objectiveItems}</ul>
        </article>
      `;
    }

    function renderParkingCommissionHud() {
      const commissions = readParkingCommissions();
      const currentMain = currentParkingMainCommission(commissions);
      const daily = activeParkingDailyCommissions(commissions);
      const visible = [
        ...(currentMain ? [{ def: currentMain, group: "main" }] : []),
        ...daily.map((def) => ({ def, group: "daily" }))
      ];
      const readyCount = visible.filter(({ def, group }) => (
        parkingCommissionComplete(def, commissions) && !parkingCommissionClaimed(def, group, commissions)
      )).length;
      commissionHudReadyEl.textContent = String(readyCount);
      commissionHudPanelEl.innerHTML = `
        <section class="commission-hud-section">
          <h2>主线 <span>${currentMain ? `阶段 ${currentMain.stage}/12` : "已完成"}</span></h2>
          ${currentMain
            ? parkingCommissionCardHtml(currentMain, "main", commissions)
            : `<p class="commission-hud-empty">主线行动任务已经全部完成。</p>`}
        </section>
        <section class="commission-hud-section">
          <h2>每日 <span>${commissions.daily.date}</span></h2>
          ${daily.length
            ? daily.map((def) => parkingCommissionCardHtml(def, "daily", commissions)).join("")
            : `<p class="commission-hud-empty">今日每日行动任务已经全部领奖。</p>`}
        </section>
      `;
    }

    function recordParkingCommission(mutator) {
      const saveData = parseSaveData();
      saveData.commissions = normalizeParkingCommissions(saveData.commissions);
      mutator(saveData.commissions);
      writeSaveData(saveData);
      renderParkingCommissionHud();
    }

    function recordParkingInvestigation(thing) {
      if (!thing?.name) return;
      recordParkingCommission((commissions) => {
        if (thing.area && !commissions.main.parkingAreasInvestigated.includes(thing.area)) {
          commissions.main.parkingAreasInvestigated.push(thing.area);
        }
        if (thing.commissionLocationId && !commissions.main.parkingLocationsInvestigated.includes(thing.commissionLocationId)) {
          commissions.main.parkingLocationsInvestigated.push(thing.commissionLocationId);
        }
        if (thing.name === "废弃车辆") {
          commissions.main.oldCarInvestigated = true;
          if (!commissions.main.parkingLocationsInvestigated.includes("oldGreenCar")) {
            commissions.main.parkingLocationsInvestigated.push("oldGreenCar");
          }
        }
        const dailyProgress = commissions.daily.progress;
        if (!dailyProgress.parkingInvestigatedToday.includes(thing.name)) {
          dailyProgress.parkingInvestigatedToday.push(thing.name);
        }
        if (thing.area && !dailyProgress.parkingAreasInvestigatedToday.includes(thing.area)) {
          dailyProgress.parkingAreasInvestigatedToday.push(thing.area);
        }
      });
    }

    function recordInvestigatorSkillUse(characterId = selectedCharacter) {
      if (!characterDefs[characterId]) return;
      recordParkingCommission((commissions) => {
        const counters = commissions.main.skillUsesByInvestigator;
        counters[characterId] = Number(counters[characterId] || 0) + 1;
        if (!commissions.main.charactersTried.includes(characterId)) {
          commissions.main.charactersTried.push(characterId);
        }
      });
    }

    function recordInvestigatorDefeat(characterId = selectedCharacter) {
      if (!characterDefs[characterId]) return;
      recordParkingCommission((commissions) => {
        const counters = commissions.main.defeatsByInvestigator;
        counters[characterId] = Number(counters[characterId] || 0) + 1;
        if (!commissions.main.charactersTried.includes(characterId)) {
          commissions.main.charactersTried.push(characterId);
        }
      });
    }

    function recordParkingSearch(thing) {
      if (!thing?.name) return;
      recordParkingCommission((commissions) => {
        commissions.daily.progress.parkingSearchesToday += 1;
      });
    }

    function finishParkingRun(message, updates = {}) {
      if (runEnded) return;
      runEnded = true;
      const nextUrl = updates.nextUrl || miniGameReturnUrl;
      const saveData = parseSaveData();
      const materials = { cloth: 0, wood: 0, metal: 0, thread: 0, crystal: 0, ...(saveData.materials || {}) };
      const returnedItems = [...allBackpackItems(), ...secretPouchItems];
      const returnedCount = returnedItems.length;
      PlayerCard.stage("parking", {title: "停车场撤离成功", lines: [`调查员：${characterDefs[selectedCharacter]?.name || "主角"}`, `带回物品 ${returnedCount} 件`, `高阶物品 ${returnedItems.filter(loot => Number(loot.tierId || 0) >= 4).length} 件`]});
      const highTierCount = returnedItems.filter((loot) => Number(loot.tierId || 0) >= 4).length;
      const keyItemCount = returnedItems.filter((loot) => loot.category === "钥匙房卡").length;
      const returnedBisonCore = returnedItems.some(isBisonCore);
      returnedItems.forEach((loot) => {
        Object.entries(loot.materials || {}).forEach(([name, amount]) => {
          materials[name] = (materials[name] || 0) + amount;
        });
      });
      const returnedCards = [
        ...cardPack,
        ...returnedItems.filter((loot) => loot?.special === "accessCard")
      ].map(normalizeAccessCard).filter(Boolean);
      const returnedLoot = returnedItems
        .filter((loot) => loot?.special !== "accessCard")
        .map(normalizeReturnedLoot);
      saveData.inventory = [...returnedLoot, ...(saveData.inventory || [])];
      saveData.storedAccessCards = mergeAccessCards(saveData.storedAccessCards, returnedCards);
      saveData.equippedAccessCards = cardPack.map((card) => card.id).filter(Boolean);
      saveData.materials = materials;
      saveData.backpackLevel = Math.max(0, Number(saveData.backpackLevel ?? carriedBackpackLevel));
      saveData.armorTier = Math.max(0, Number(saveData.armorTier ?? armorTier));
      saveData.selectedArea = "parkingLot";
      saveData.preparedLoadout = { food: 6, water: 5, backpack: 1 };
      saveData.commissions = normalizeParkingCommissions(saveData.commissions);
      const mainProgress = saveData.commissions.main;
      mainProgress.extractsByInvestigator[selectedCharacter] = Number(mainProgress.extractsByInvestigator[selectedCharacter] || 0) + 1;
      if (!mainProgress.charactersTried.includes(selectedCharacter)) {
        mainProgress.charactersTried.push(selectedCharacter);
      }
      const dailyProgress = saveData.commissions.daily.progress;
      dailyProgress.parkingExtractsToday += 1;
      dailyProgress.parkingBestLootReturnedToday = Math.max(dailyProgress.parkingBestLootReturnedToday || 0, returnedCount);
      dailyProgress.parkingHighTierReturnedToday += highTierCount;
      dailyProgress.parkingKeyItemsReturnedToday += keyItemCount;
      if (returnedBisonCore) saveData.commissions.main.bisonCoreReturned = true;
      saveData.secretPouchUnlocked = Boolean(secretPouchUnlocked || saveData.secretPouchUnlocked);
      recordParkingRunStats(saveData, "extract", returnedItems);
      writeSaveData(saveData);
      sessionStorage.removeItem("miwenguan-parking-loadout");
      promptEl.innerHTML = message;
      searchTitleEl.textContent = "已离开停车场";
      searchHintEl.textContent = "随身物品和材料已经带回仓库。";
      interactButton.disabled = true;
      extractButton.disabled = true;
      keys.clear();
      window.setTimeout(() => {
        window.location.href = nextUrl;
      }, 1200);
    }

    function useExit(exitThing) {
      if (exitThing.exitMode === "staffHome" || exitThing.exitMode === "investigatorHall") {
        if (!useAccessCardForExit(exitThing)) return;
      }

      if (exitThing.exitMode === "investigatorHall" && !hasBisonCore()) {
        promptEl.innerHTML = `<strong>${exitThing.name}</strong>：身份已确认，但本次行动任务还缺少野牛核心。`;
        return;
      }

      if (exitThing.exitMode === "investigatorHall") {
      finishParkingRun("<strong>干员通道</strong>：撤离成功。");
        return;
      }

      if (exitThing.exitMode === "staffHome") {
        finishParkingRun("<strong>工作人员刷卡出口</strong>：撤离成功。");
        return;
      }

      finishParkingRun(`<strong>${exitThing.name}</strong>：你推门离开停车场，回到了小游戏大厅。`);
    }

    function failRun(reason) {
      if (runEnded) return;
      runEnded = true;
      searchState = null;
      pendingLoot = null;
      pendingLootQueue.length = 0;
      containerLoot.length = 0;
      renderedContainerSignature = "";
      const protectedItems = secretPouchItems.splice(0);
      fieldBackpack.length = 0;
      fieldBackpackP2.length = 0;
      const saveData = parseSaveData();
      const materials = { cloth: 0, wood: 0, metal: 0, thread: 0, crystal: 0, ...(saveData.materials || {}) };

          materials[name] = (materials[name] || 0) + amount;
        });
      });

      interactButton.disabled = true;
      extractButton.disabled = true;

        window.location.href = miniGameReturnUrl;

    function finishPvpMatch(playerWon) {
      if (runEnded) return;
      runEnded = true;
      const saveData = parseSaveData();
      saveData.selectedArea = "parkingLot";
      saveData.preparedLoadout = { food: 6, water: 5, backpack: 1 };
      writeSaveData(saveData);
      sessionStorage.removeItem("miwenguan-parking-loadout");
      promptEl.innerHTML = playerWon
        ? `<strong>模拟训练胜利</strong>：你在三局训练里击倒了对方。`
        : `<strong>模拟训练失败</strong>：对方赢下了这场三局训练。`;
      searchTitleEl.textContent = playerWon ? "训练胜利" : "训练结束";

      interactButton.disabled = true;
      extractButton.disabled = true;

        window.location.href = miniGameReturnUrl;
