      return 1;
    }

    function updateHeroOuterOrbSkill(dt) {
      heroOuterOrbActiveLeft = Math.max(0, heroOuterOrbActiveLeft - dt);
      heroOuterOrbCooldownLeft = Math.max(0, heroOuterOrbCooldownLeft - dt);
    }

    function heroSkillHaloActive() {
      return selectedCharacter === "hero" && heroOuterOrbActiveLeft > 0 && !runEnded;
    }

    function heroSkillHaloContactRadius(npc) {
      return heroSkillHaloRadius + threatTargetRadius(npc) + 10;
    }

    function pushNpcOutOfHeroHalo(npc, dt) {
      const dx = npc.x - player.x;
      const dy = npc.y - player.y;
      const distance = Math.hypot(dx, dy) || 1;
      const targetDistance = heroSkillHaloContactRadius(npc);
      if (distance >= targetDistance) return;
      const ux = dx / distance;
      const uy = dy / distance;
      const bossWeight = npc.isBoss ? 0.58 : 1;
      const pushStep = Math.min(targetDistance - distance + 12, heroSkillHaloPushSpeed * bossWeight * dt);
      const nextX = npc.x + ux * pushStep;
      const nextY = npc.y + uy * pushStep;
      if (canStandAt(nextX, nextY)) {
        npc.x = nextX;
        npc.y = nextY;
      } else if (canStandAt(nextX, npc.y)) {
        npc.x = nextX;
      } else if (canStandAt(npc.x, nextY)) {
        npc.y = nextY;
      }
      if (!npc.isBoss) {
        npc.target = { x: npc.x + ux * 220, y: npc.y + uy * 220 };
        npc.wait = Math.max(npc.wait || 0, 0.08);
      }
    }

    function updateHeroOrbDamage(dt) {
      if (selectedCharacter !== "hero" || runEnded) return;
      const orbs = heroOrbPositions();
      availableIceTargets().forEach((npc) => {
        if (npc.dead || npc.active === false) return;
        npc.orbHitCooldown = Math.max(0, (npc.orbHitCooldown || 0) - dt);
        npc.haloHitCooldown = Math.max(0, (npc.haloHitCooldown || 0) - dt);
        if (heroSkillHaloActive()) {
          const haloDistance = Math.hypot(npc.x - player.x, npc.y - player.y);
          if (haloDistance <= heroSkillHaloContactRadius(npc)) {
            if (!npc.isPvpOpponent) pushNpcOutOfHeroHalo(npc, dt);
            if (npc.haloHitCooldown <= 0) {
              npc.haloHitCooldown = heroSkillHaloDamageCooldown;
              const haloDamage = npc.isPvpOpponent ? heroSkillHaloPvpDamage : npc.isBoss ? heroSkillHaloBossDamage : heroSkillHaloDamage;
              damageNpc(npc, haloDamage, "光环", true);
            }
          }
        }
        const touchedOrb = orbs.find((orb) => {
          const alpha = orb.alpha ?? 1;
          if (alpha <= 0.08) return false;
          const damageRadius = heroOrbDamageRadius * (0.45 + alpha * 0.55);
          return Math.hypot(npc.x - orb.x, npc.y - orb.y) <= threatTargetRadius(npc) + damageRadius;
        });
        if (touchedOrb && npc.orbHitCooldown <= 0) {
          const outer = touchedOrb.ring === "outer";
          npc.orbHitCooldown = outer ? 0.48 : 0.62;
          const orbDamage = npc.isPvpOpponent
            ? outer ? heroOuterOrbPvpDamage : heroInnerOrbPvpDamage
            : npc.isBoss ? 0.75 : 1;
          damageNpc(npc, orbDamage, outer ? "外圈光球" : "内圈光球");
        }
      });
    }

    function updateCatClaws(dt) {
      catClawCooldownLeft = Math.max(0, catClawCooldownLeft - dt);
      if (backpackModal.classList.contains("show")) return;
      for (let index = clawProjectiles.length - 1; index >= 0; index -= 1) {
        const claw = clawProjectiles[index];
        const step = claw.speed * dt;
        claw.x += claw.vx * step;
        claw.y += claw.vy * step;
        claw.distance += step;

        availableIceTargets(claw.hitIds).forEach((npc) => {
          if (npc.dead || npc.active === false || claw.hitIds.has(npc.id)) return;
          if (Math.hypot(npc.x - claw.x, npc.y - claw.y) <= threatTargetRadius(npc) + claw.r) {
            claw.hitIds.add(npc.id);
            alertFromCatAttack(npc);
            damageNpc(npc, claw.damage, claw.kind === "large" ? "大影刃" : "小影刃");
          }
        });

        if (claw.distance >= claw.range || !canStandAt(claw.x, claw.y)) {
          clawProjectiles.splice(index, 1);
        }
      }
    }

    function availableIceTargets(excludedIds = new Set()) {
      const targets = aiScavs.filter((npc) =>
        npc.active !== false && !npc.dead && !excludedIds.has(npc.id)
      );
      if (pvpState.enabled && pvpState.roundActive && pvpOpponent.active !== false && !pvpOpponent.dead && !excludedIds.has(pvpOpponent.id)) {
        targets.push(pvpOpponent);
      }
      return targets;
    }

    function nearestIceTarget(x, y, excludedIds = new Set(), maxRange = Infinity) {
      let best = null;
      let bestDistance = maxRange;
      availableIceTargets(excludedIds).forEach((npc) => {
        const distance = Math.hypot(npc.x - x, npc.y - y);
        if (distance < bestDistance) {
          best = npc;
          bestDistance = distance;
        }
      });
      return best;
    }

    function petCooldownMaxSeconds() {
      if (!activePetDef) return 0;
      const bondReduction = 0.04 + petBondRatio * 0.18;
      return activePetDef.cooldown * (1 - bondReduction);
    }

    function petDurationSeconds() {
      if (!activePetDef) return 0;
      return activePetDef.duration * (0.7 + petBondRatio * 0.38);
    }

    function petSparkDamage() {
      return 1.25 + petBondRatio * 2.35;
    }

    function petMenderHeal() {
      return 1.05 + petBondRatio * 2.15;
    }

    function petShieldMax() {
      return Math.round(34 + petBondRatio * 78);
    }

    function canUsePetSkill() {
      return Boolean(activePetDef) && !runEnded && !searchState && !pendingLoot && !backpackModal.classList.contains("show");
    }

    function absorbWithPetShield(amount, sourceName = "伤害") {
      if (!activePetDef || selectedPet !== "guard" || petState.shield <= 0 || amount <= 0) return amount;
      const blocked = Math.min(amount, petState.shield);
      petState.shield = Math.max(0, petState.shield - blocked);
      hitBursts.push({ x: player.x, y: player.y, age: 0, label: "护盾" });
      promptEl.innerHTML = `<strong>护盾无人机</strong> 挡下${damageNumberText(blocked)}点${sourceName}。`;
      spawnDamageNumber(player.x + player.radius + 20, player.y - 28, blocked, "boss");
      return Math.max(0, amount - blocked);
    }

    function castPetSkill() {
      if (!activePetDef) return;
      if (!canUsePetSkill()) return;
      if (petState.cooldownLeft > 0) {
        promptEl.innerHTML = `<strong>${activePetDef.name}</strong> 还要 ${Math.ceil(petState.cooldownLeft)} 秒。`;
        renderHud();
        return;
      }
      petState.activeLeft = petDurationSeconds();
      petState.cooldownLeft = petCooldownMaxSeconds();
      petState.tickLeft = 0;
      petState.squash = 1;
      if (selectedPet === "guard") {
        petState.shield = Math.max(petState.shield, petShieldMax());
      }
      hitBursts.push({ x: petState.x, y: petState.y, age: 0, label: activePetDef.short });
      promptEl.innerHTML = `<strong>${activePetDef.name}</strong> 释放${activePetDef.skillName}。`;
      renderHud();
    }

    function updatePet(dt) {
      if (!activePetDef) return;
      const orbit = skillTime * 0.85;
      const desiredX = player.x - playerFacing.x * 64 + Math.cos(orbit) * 22;
      const desiredY = player.y - playerFacing.y * 64 + 48 + Math.sin(orbit * 1.2) * 14;
      const followEase = Math.min(1, dt * 5.8);
      petState.x += (desiredX - petState.x) * followEase;
      petState.y += (desiredY - petState.y) * followEase;
      petState.cooldownLeft = Math.max(0, petState.cooldownLeft - dt);
      petState.activeLeft = Math.max(0, petState.activeLeft - dt);
      petState.tickLeft = Math.max(0, petState.tickLeft - dt);
      petState.squash = Math.max(0, petState.squash - dt * 3.4);
      if (selectedPet === "guard" && petState.activeLeft <= 0) {
        petState.shield = 0;
      }
      if (petState.activeLeft <= 0 || petState.tickLeft > 0) return;
      if (selectedPet === "spark") {
        petState.tickLeft = 0.5;
        const target = nearestIceTarget(petState.x, petState.y, new Set(), 560);
        if (!target) return;
        const dashDx = target.x - petState.x;
        const dashDy = target.y - petState.y;
        const distance = Math.hypot(dashDx, dashDy) || 1;
        petState.x += (dashDx / distance) * Math.min(90, distance);
        petState.y += (dashDy / distance) * Math.min(90, distance);
        damageNpc(target, petSparkDamage(), "支援无人机", true);
        hitBursts.push({ x: target.x, y: target.y, age: 0, label: "撞击" });
        return;
      }
      if (selectedPet === "mender") {
        petState.tickLeft = 0.55;
        const heal = Math.min(player.maxHp - player.hp, petMenderHeal());
        if (heal <= 0) return;
        player.hp = clamp(player.hp + heal, 0, player.maxHp);
        hitBursts.push({ x: player.x, y: player.y, age: 0, label: "回血" });
        renderHud();
        return;
      }
      if (selectedPet === "guard") {
        petState.tickLeft = 0.8;
        if (petState.shield > 0) hitBursts.push({ x: player.x, y: player.y, age: 0, label: "护盾" });
        return;
      }
      if (selectedPet === "cooler") {
        petState.tickLeft = 0.85;
        availableIceTargets().forEach((npc) => {
          if (Math.hypot(npc.x - petState.x, npc.y - petState.y) <= 220 + petBondRatio * 80) {
            addFreeze(npc, 16 + petBondRatio * 18, "脉冲");
          }
        });
        hitBursts.push({ x: petState.x, y: petState.y, age: 0, label: "脉冲" });
      }
    }

    function pointSegmentDistance(px, py, ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;
      const lengthSq = dx * dx + dy * dy || 1;
      const t = clamp(((px - ax) * dx + (py - ay) * dy) / lengthSq, 0, 1);
      return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
    }

    function updateEggBeam(dt) {
      eggBeamCooldownLeft = Math.max(0, eggBeamCooldownLeft - dt);
      if (selectedCharacter !== "egg" || !eggBeam.active || runEnded || searchState || pendingLoot || backpackModal.classList.contains("show")) return;
      eggBeam.activeLeft = Math.max(0, eggBeam.activeLeft - dt);
      if (eggBeam.activeLeft <= 0) {
        stopEggBeam({ expired: true });
        return;
      }
      const dx = eggMouse.x - player.x;
      const dy = eggMouse.y - player.y;
      const distance = Math.hypot(dx, dy) || 1;
      const targetAngle = Math.atan2(dy, dx);
      const turnStep = eggBeam.turnSpeed * dt;
      eggBeam.angle += clamp(angleDelta(targetAngle, eggBeam.angle), -turnStep, turnStep);
      const ux = Math.cos(eggBeam.angle);
      const uy = Math.sin(eggBeam.angle);
      const endX = player.x + ux * eggBeam.range;
      const endY = player.y + uy * eggBeam.range;
      eggBeam.tick += dt;
      const damageTicks = Math.floor(eggBeam.tick / eggBeam.damageTick);
      if (damageTicks > 0) eggBeam.tick -= damageTicks * eggBeam.damageTick;

      availableIceTargets().forEach((npc) => {
        const targetRadius = threatTargetRadius(npc);
        const along = (npc.x - player.x) * ux + (npc.y - player.y) * uy;
        if (along < -targetRadius || along > eggBeam.range + targetRadius) return;
        const distanceToBeam = pointSegmentDistance(npc.x, npc.y, player.x, player.y, endX, endY);
        if (distanceToBeam > targetRadius + eggBeam.width / 2) return;
        addFreeze(npc, eggBeam.freezePerSecond * dt, "冷冻射束");
        if (damageTicks > 0) {
          damageNpc(npc, eggBeam.damage * damageTicks, "冷冻射束", true);
        }
      });
    }

    function createIceField(x, y) {
      const field = {
        x,
        y,
        r: 156,
        age: 0,
        duration: 5.6,
        tick: 0
      };
      iceFields.push(field);
      hitBursts.push({ x, y, age: 0, label: "冰场" });
      availableIceTargets().forEach((npc) => {
        if (Math.hypot(npc.x - field.x, npc.y - field.y) > field.r + threatTargetRadius(npc)) return;
        addFreeze(npc, iceFieldImpactFreeze, "冰场投射");
      });
    }

    function updateIceFields(dt) {
      for (let index = iceFields.length - 1; index >= 0; index -= 1) {
        const field = iceFields[index];
        field.age += dt;
        field.tick += dt;
        if (field.age >= field.duration) {
          iceFields.splice(index, 1);
          continue;
        }
        const ticked = field.tick >= 0.42;
        if (ticked) field.tick = 0;
        availableIceTargets().forEach((npc) => {
          if (Math.hypot(npc.x - field.x, npc.y - field.y) > field.r + threatTargetRadius(npc)) return;
          addFreeze(npc, iceFieldFreezePerSecond * dt, "冰场投射");
          if (ticked) damageNpc(npc, iceFieldDamage, "冰场", true);
        });
      }
    }

    function updateEggBallCharges(dt) {
      if (eggBallCharges >= eggBallMaxCharges) {
        eggBallCooldownLeft = 0;
        return;
      }
      eggBallCooldownLeft -= dt;
      while (eggBallCooldownLeft <= 0 && eggBallCharges < eggBallMaxCharges) {
        eggBallCharges += 1;
        eggBallCooldownLeft += eggBallCooldownSeconds;
      }
      if (eggBallCharges >= eggBallMaxCharges) eggBallCooldownLeft = 0;
    }

    function updateEggBalls(dt) {
      updateEggBallCharges(dt);
      for (let index = eggBalls.length - 1; index >= 0; index -= 1) {
        const ball = eggBalls[index];
        ball.age += dt;
        if (!ball.target || ball.target.dead || ball.target.active === false) {
          ball.target = nearestIceTarget(ball.x, ball.y, ball.hitIds, 430);
          if (!ball.target) {
            createIceField(ball.x, ball.y);
            eggBalls.splice(index, 1);
            continue;
          }
        }
        const dx = ball.target.x - ball.x;
        const dy = ball.target.y - ball.y;
        const distance = Math.hypot(dx, dy) || 1;
        const step = Math.min(distance, ball.speed * dt);
        ball.x += (dx / distance) * step;
        ball.y += (dy / distance) * step;
        if (distance <= threatTargetRadius(ball.target) + ball.r + step) {
          const target = ball.target;
          addFreeze(target, ball.freeze + eggBallImpactFreeze, "冰场投射");
          damageNpc(target, ball.damage, "冰场投射", true);
          hitBursts.push({ x: target.x, y: target.y, age: 0, label: "冰球" });
          ball.hitIds.add(target.id);
          ball.bounces -= 1;
          if (ball.bounces <= 0) {
            eggBalls.splice(index, 1);
            continue;
          }
          ball.target = nearestIceTarget(target.x, target.y, ball.hitIds, 430);
          if (!ball.target) {
            createIceField(target.x, target.y);
            eggBalls.splice(index, 1);
          }
        } else if (ball.age > 5.5) {
          createIceField(ball.x, ball.y);
          eggBalls.splice(index, 1);
        }
      }
    }

    function updateHitBursts(dt) {
      for (let index = hitBursts.length - 1; index >= 0; index -= 1) {
        hitBursts[index].age += dt;
        if (hitBursts[index].age > 0.66) hitBursts.splice(index, 1);
      }
      for (let index = victoryBroadcasts.length - 1; index >= 0; index -= 1) {
        const broadcast = victoryBroadcasts[index];
        broadcast.age += dt;
        broadcast.y -= 12 * dt;
        if (broadcast.age >= broadcast.duration) victoryBroadcasts.splice(index, 1);
      }
      aiScavs.forEach((npc) => {
        npc.hitShakeLeft = Math.max(0, Number(npc.hitShakeLeft || 0) - dt);
        if (npc.hitShakeLeft <= 0) npc.hitShakePower = 0;
      });
      pvpOpponent.hitShakeLeft = Math.max(0, Number(pvpOpponent.hitShakeLeft || 0) - dt);
      if (pvpOpponent.hitShakeLeft <= 0) pvpOpponent.hitShakePower = 0;
    }

    function updateHathorEffects(dt) {
      for (let index = hathorEffects.length - 1; index >= 0; index -= 1) {
        hathorEffects[index].age += dt;
        if (hathorEffects[index].age >= hathorEffects[index].duration) hathorEffects.splice(index, 1);
      }
    }

    function updateDamageNumbers(dt) {
      for (let index = damageNumbers.length - 1; index >= 0; index -= 1) {
        const number = damageNumbers[index];
        number.age += dt;
        number.x += number.vx * dt;
        number.y += number.vy * dt;
        if (number.age >= number.duration) damageNumbers.splice(index, 1);
      }
    }

    function activeTrailStyle() {
      if (selectedCharacter === "hero" && equippedHeroTrail === "hero-golden-trail") {
        return {
          name: "黄金拖尾",
          prompt: "已穿戴黄金拖尾，移动时两侧会留下金色光线。",
          shadow: "rgba(255, 226, 132, 0.72)",
          glowShadow: "rgba(255, 213, 105, 0.52)",
          stroke: "rgba(255, 226, 132, 0.88)",
          glow: "rgba(255, 213, 105, 0.48)",
          beam: "rgba(255, 226, 132, 0.74)",
          beamGlow: "rgba(255, 213, 105, 0.55)",
          particle: "rgba(255, 226, 132, 0.82)",
          particleGlow: "rgba(255, 213, 105, 0.72)"
        };
      }
      if (selectedCharacter === "cat" && equippedCatTrail === "cat-ninja-trail") {
        return {
          name: "影步拖尾",

          shadow: "rgba(238, 243, 255, 0.74)",
          glowShadow: "rgba(205, 214, 230, 0.56)",
          stroke: "rgba(244, 248, 255, 0.9)",
          glow: "rgba(205, 214, 230, 0.48)",
          beam: "rgba(238, 243, 255, 0.76)",
          beamGlow: "rgba(205, 214, 230, 0.56)",
          particle: "rgba(244, 248, 255, 0.82)",
          particleGlow: "rgba(205, 214, 230, 0.72)"
        };
      }
      return null;
    }

    function hasHeroGoldenTrailEquipped() {
      return Boolean(activeTrailStyle());
    }

    function cosmeticImpactStyle() {
      const trail = activeTrailStyle();
      if (trail) {
        return {
          name: trail.name,
          stroke: trail.stroke,
          glow: trail.glow,
          particle: trail.particle,

        };

        return {

          glow: "rgba(125, 220, 255, 0.5)",
          particle: "rgba(255, 226, 132, 0.78)",
          strength: 0.9
        };
      }
      if (hasHeroStarshineOuterOrbsEquipped()) {
        return {
          name: "星辉外圈",

          glow: "rgba(255, 213, 105, 0.52)",
          particle: "rgba(238, 243, 255, 0.76)",

        };
      }
      if (hasCatSilverTrail()) {

          particle: "rgba(244, 248, 255, 0.78)",

        };
      }

          particle: "rgba(235, 252, 255, 0.82)",
          strength: 0.9
        };
      }

    function cosmeticImpactStrength() {
      return cosmeticImpactStyle()?.strength || 0;
    }

    function impactBurstOptions(defaultColor, basePower = 0.34, skinPower = 0.96) {
      const style = cosmeticImpactStyle();
      if (!style) {
        return {
          power: basePower,
          color: defaultColor,
          skinImpact: false
        };
      }
      return {
        power: skinPower * style.strength,
        color: style.stroke,
        skinImpact: true,
        glow: style.glow,
        particle: style.particle
      };
    }

    function hasHeroDualCoreOrbsEquipped() {
      return selectedCharacter === "hero" && equippedHeroInnerOrb === "hero-dual-core-orbs";
    }

    function hasHeroStarshineOuterOrbsEquipped() {
      return selectedCharacter === "hero" && equippedHeroOuterOrb === "hero-starshine-outer-orbs";
    }

    function addHeroTrailParticle() {
      heroTrailParticles.push({
        x: player.x + (Math.random() - 0.5) * 18,
        y: player.y + 13 + (Math.random() - 0.5) * 10,
        r: 1.8 + Math.random() * 2.4,
        age: 0,
        duration: 0.95 + Math.random() * 0.45,
        driftX: (Math.random() - 0.5) * 7,
        driftY: -4 - Math.random() * 5
      });
      if (heroTrailParticles.length > 36) heroTrailParticles.shift();
    }

    function seedHeroTrailIntro() {
      if (!hasHeroGoldenTrailEquipped()) return;
      heroTrailSamples.length = 0;
      heroTrailSamples.push(
        { x: player.x, y: player.y + 34, age: 0, duration: 0.8 },
        { x: player.x, y: player.y + 16, age: 0, duration: 0.8 },
        { x: player.x, y: player.y, age: 0, duration: 0.8 }
      );
      [-1, 1].forEach((side) => {
        heroTrailBeams.push({
          x1: player.x + 19 * side,
          y1: player.y + 42,
          x2: player.x + 19 * side,
          y2: player.y + 4,
          age: 0,
          duration: 0.9
        });
      });
      for (let index = 0; index < 5; index += 1) addHeroTrailParticle();
    }

    function updateHeroTrail(dt, movingIntent) {
      if (!hasHeroGoldenTrailEquipped()) {
        heroTrailParticles.length = 0;
        heroTrailBeams.length = 0;
        heroTrailSamples.length = 0;
        return;
      }
      for (let index = heroTrailBeams.length - 1; index >= 0; index -= 1) {
        const beam = heroTrailBeams[index];
        beam.age += dt;
        if (beam.age >= beam.duration) heroTrailBeams.splice(index, 1);
      }
      for (let index = heroTrailSamples.length - 1; index >= 0; index -= 1) {
        const sample = heroTrailSamples[index];
        sample.age += dt;
        if (sample.age >= sample.duration) heroTrailSamples.splice(index, 1);
      }
      for (let index = heroTrailParticles.length - 1; index >= 0; index -= 1) {
        const particle = heroTrailParticles[index];
        particle.age += dt;
        particle.x += particle.driftX * dt;
        particle.y += particle.driftY * dt;

    function catExecutionUnlocked() {
      return selectedCharacter === "cat" && hasCatPentagramExecution;
    }

    function catExecutionActive() {
      return Boolean(catExecutionState);
    }

    function catExecutionStarPoints(cx, cy, radius = catExecutionStarRadius) {
      const outer = Array.from({ length: 5 }, (_, index) => {
        const angle = -Math.PI / 2 + index * (Math.PI * 2 / 5);
        return {
          x: cx + Math.cos(angle) * radius,
          y: cy + Math.sin(angle) * radius
        };
      });
      const order = [0, 2, 4, 1, 3, 0];
      return order.map((index) => outer[index]);
    }

    function executionStandPoint(npc) {
      const baseAngle = Math.atan2(player.y - npc.y, player.x - npc.x);
      const candidates = [0, 0.7, -0.7, 1.35, -1.35, Math.PI].map((offset) => baseAngle + offset);
      for (const angle of candidates) {
        const point = {
          x: npc.x + Math.cos(angle) * 92,
          y: npc.y + Math.sin(angle) * 92
        };
        if (canStandAt(point.x, point.y)) return point;
      }
      return { x: player.x, y: player.y };
    }

    function pointOnPolyline(points, ratio) {
      if (!points.length) return { x: player.x, y: player.y };
      if (points.length === 1) return points[0];
      const lengths = [];
      let total = 0;
      for (let index = 1; index < points.length; index += 1) {
        const distance = Math.hypot(points[index].x - points[index - 1].x, points[index].y - points[index - 1].y);
        lengths.push(distance);
        total += distance;
      }
      let remaining = clamp(ratio, 0, 1) * total;
      for (let index = 1; index < points.length; index += 1) {
        const length = lengths[index - 1] || 1;
        if (remaining <= length) {
          const t = remaining / length;
          return {
            x: points[index - 1].x + (points[index].x - points[index - 1].x) * t,
            y: points[index - 1].y + (points[index].y - points[index - 1].y) * t
          };
        }
        remaining -= length;
      }
      return points[points.length - 1];
    }

    function startCatExecution(npc) {
      if (!catExecutionUnlocked() || catExecutionState || runEnded || !npc || npc.dead || npc.active === false) return false;
      const stand = executionStandPoint(npc);
      const starPoints = catExecutionStarPoints(npc.x, npc.y);
      const mark = {
        x: npc.x,
        y: npc.y,
        points: starPoints,
        progress: 0,
        age: 0,
        duration: catExecutionMarkDuration,
        complete: false
      };
      catExecutionMarks.push(mark);
      catExecutionState = {
        target: npc,
        age: 0,
        startX: player.x,
        startY: player.y,
        standX: stand.x,
        standY: stand.y,
        starPoints,
        mark,
        finished: false
      };
      npc.target = null;
      npc.wait = Math.max(npc.wait || 0, catExecutionDuration);
      npc.aggro = 0;
      npc.attackCooldown = Math.max(npc.attackCooldown || 0, catExecutionDuration);
      if (npc.isBoss) {
        npc.dashCharge = 0;
        npc.dashDuration = 0;
        npc.laserCooldown = Math.max(npc.laserCooldown || 0, catExecutionDuration);
        npc.meleeCooldown = Math.max(npc.meleeCooldown || 0, catExecutionDuration);
      }
      recordInvestigatorSkillUse("cat");
          promptEl.innerHTML = `<strong>${npc.name}</strong> 已锁定。`;
      renderHud();
      return true;
    }

    function finishCatExecution() {
      const state = catExecutionState;
      if (!state || state.finished) return;
      const npc = state.target;
      state.finished = true;
      state.mark.complete = true;
      state.mark.progress = 1;
      if (npc && !npc.dead && npc.active !== false) {
        if (npc.isPvpOpponent) {
          damagePvpOpponent(catExecutionPvpDamage, "定点处决");
          if (!npc.dead && npc.active !== false) {
            hitBursts.push({ x: npc.x, y: npc.y, age: 0, label: "重创" });
            promptEl.innerHTML = `<strong>${npc.name}</strong> 被定点阵重创。`;
          }
        } else if (npc.isBoss) {
          damageNpc(npc, catExecutionBossDamage, "定点处决", true);
          if (!npc.dead) {
            npc.stunLeft = Math.max(npc.stunLeft || 0, catExecutionBossStunSeconds);
            npc.dashCharge = 0;
            npc.dashDuration = 0;
            npc.laserCooldown = Math.max(npc.laserCooldown || 0, catExecutionBossStunSeconds);
            npc.meleeCooldown = Math.max(npc.meleeCooldown || 0, catExecutionBossStunSeconds);
            hitBursts.push({ x: npc.x, y: npc.y, age: 0, label: "眩晕" });
            promptEl.innerHTML = `<strong>${npc.name}</strong> 定点命中。`;
          }
        } else {
          npc.dead = true;
          npc.target = null;
          npc.hp = 0;
          npc.aggro = 0;
          npc.attackCooldown = 0;
          recordInvestigatorDefeat("cat");
          hitBursts.push({ x: npc.x, y: npc.y, age: 0, label: "处决" });
          promptEl.innerHTML = `<strong>${npc.name}</strong> 被处决。`;
        }
      }
      updateNearbyThing();
      renderHud();
      checkSecondWaveTrigger();
    }

    function updateCatExecution(dt) {
      for (let index = catExecutionMarks.length - 1; index >= 0; index -= 1) {
        const mark = catExecutionMarks[index];
        if (mark.complete) mark.age += dt;
        if (mark.complete && mark.age >= mark.duration) catExecutionMarks.splice(index, 1);
      }
      if (!catExecutionState) return;
      const state = catExecutionState;
      const npc = state.target;
      state.age += dt;
      if (!npc || npc.dead || npc.active === false) {
        catExecutionState = null;
        return;
      }
      const drawStart = catExecutionApproachSeconds;
      const drawEnd = drawStart + catExecutionDrawSeconds;
      const shurikenEnd = drawEnd + catExecutionShurikenSeconds;
      if (state.age < drawStart) {
        const t = smoothStep(state.age / drawStart);
        player.x = state.startX + (state.standX - state.startX) * t;
        player.y = state.startY + (state.standY - state.startY) * t;
      } else if (state.age < drawEnd) {
        const t = (state.age - drawStart) / catExecutionDrawSeconds;
        const point = pointOnPolyline(state.starPoints, t);
        player.x = point.x;
        player.y = point.y;
        state.mark.progress = clamp(t, 0, 1);
      } else {
        player.x = state.starPoints[state.starPoints.length - 1].x;
        player.y = state.starPoints[state.starPoints.length - 1].y;
        state.mark.progress = 1;
      }
      if (state.age >= shurikenEnd && !state.finished) finishCatExecution();
      if (state.age >= catExecutionDuration) catExecutionState = null;
    }

    function catExecutionNpcOffset(npc) {
      if (!catExecutionState || catExecutionState.target !== npc) return { x: 0, y: 0 };
      const state = catExecutionState;
      const impactStart = catExecutionApproachSeconds + catExecutionDrawSeconds + catExecutionShurikenSeconds;
      if (state.age < impactStart || state.age > impactStart + 0.34) return { x: 0, y: 0 };
      const shake = Math.sin(state.age * 96) * 5;
      return { x: shake, y: -shake * 0.45 };
    }

    function entityHitShakeOffset(entity) {
      const left = Number(entity?.hitShakeLeft || 0);
      if (left <= 0) return { x: 0, y: 0, rotation: 0 };
      const power = Number(entity.hitShakePower || 1);
      const t = Math.min(1, left / 0.18);
      const wobble = Math.sin(performance.now() / 18) * power * t;
      return {
        x: wobble * 4.8,
        y: Math.cos(performance.now() / 24) * power * t * 1.7,
        rotation: wobble * 0.035
      };
    }

    function combinedNpcOffset(npc) {
      const execution = catExecutionNpcOffset(npc);
      const hit = entityHitShakeOffset(npc);
      return {
        x: execution.x + hit.x,
        y: execution.y + hit.y,
        rotation: hit.rotation
      };
    }

    function catExecutionBlocksMelee(npc) {
      if (!catExecutionState || !npc || npc === catExecutionState.target) return false;
      return Math.hypot(player.x - npc.x, player.y - npc.y) <= catExecutionGuardRadius + (npc.r || 0);
    }

    function pushNpcOutOfCatExecution(npc, dt) {
      if (!catExecutionBlocksMelee(npc)) return;
      const dx = npc.x - player.x;
      const dy = npc.y - player.y;
      const distance = Math.hypot(dx, dy) || 1;
      const ux = dx / distance;
      const uy = dy / distance;
      const targetDistance = catExecutionGuardRadius + (npc.r || 0);
      const step = Math.min(targetDistance - distance + 8, 360 * dt);
      const nextX = npc.x + ux * step;
      const nextY = npc.y + uy * step;
      if (canStandAt(nextX, nextY)) {
        npc.x = nextX;
        npc.y = nextY;
      }
      npc.target = { x: npc.x + ux * 180, y: npc.y + uy * 180 };
      npc.wait = Math.max(npc.wait || 0, 0.08);
    }

    function updateTeleportSkill(dt) {
      teleportCooldownLeft = Math.max(0, teleportCooldownLeft - dt);
      for (let index = teleportBursts.length - 1; index >= 0; index -= 1) {
        teleportBursts[index].age += dt;
        if (teleportBursts[index].age > 0.62) teleportBursts.splice(index, 1);
      }
    }

    function rectVisible(rect, margin = 120) {
      return rect.x + rect.w >= camera.x - margin &&
        rect.x <= camera.x + camera.width + margin &&
        rect.y + rect.h >= camera.y - margin &&
        rect.y <= camera.y + camera.height + margin;
    }

    function pointVisible(item, margin = 160) {
      const radius = Number(item.r ?? item.radius ?? 0);
      return item.x + radius >= camera.x - margin &&
        item.x - radius <= camera.x + camera.width + margin &&
        item.y + radius >= camera.y - margin &&
        item.y - radius <= camera.y + camera.height + margin;
    }

    function drawWorldRect(rect, fill, stroke = null) {
      if (!rectVisible(rect)) return;
      ctx.fillStyle = fill;
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.w - 1, rect.h - 1);
      }
    }

    function drawBackground() {
      ctx.fillStyle = "#17211d";
      ctx.fillRect(camera.x, camera.y, camera.width, camera.height);

      const grid = 80;
      const startX = Math.floor(camera.x / grid) * grid;
      const startY = Math.floor(camera.y / grid) * grid;
      ctx.strokeStyle = "rgba(230, 221, 200, 0.035)";
      ctx.lineWidth = 1;
      for (let x = startX; x <= camera.x + camera.width; x += grid) {
        ctx.beginPath();
        ctx.moveTo(x, camera.y);
        ctx.lineTo(x, camera.y + camera.height);
        ctx.stroke();
      }
      for (let y = startY; y <= camera.y + camera.height; y += grid) {
        ctx.beginPath();
        ctx.moveTo(camera.x, y);
        ctx.lineTo(camera.x + camera.width, y);
        ctx.stroke();
      }

      ctx.strokeStyle = mapDisplayAccent.strokeStrong;
      ctx.lineWidth = 8;
      ctx.strokeRect(world.margin, world.margin, world.width - world.margin * 2, world.height - world.margin * 2);
    }

    function drawRoads() {
      parkingSurfaces.forEach((surface) => {
        drawWorldRect(surface, routeFill, "rgba(230, 221, 200, 0.08)");
      });

      roads.forEach((road) => drawWorldRect(road, routeFill, "rgba(230, 221, 200, 0.08)"));

      ctx.strokeStyle = "rgba(230, 221, 200, 0.34)";
      ctx.lineWidth = 3;
      ctx.setLineDash([24, 24]);
      roads.forEach((road) => {
        if (!rectVisible(road)) return;
        ctx.beginPath();
        if (road.h > road.w) {
          ctx.moveTo(road.x + road.w / 2, road.y + 20);
          ctx.lineTo(road.x + road.w / 2, road.y + road.h - 20);
        } else {
          ctx.moveTo(road.x + 20, road.y + road.h / 2);
          ctx.lineTo(road.x + road.w - 20, road.y + road.h / 2);
        }
        ctx.stroke();
      });
      ctx.setLineDash([]);
    }

    function drawBuildings() {
      buildings.forEach((item) => {
        if (!rectVisible(item)) return;
        const gradient = ctx.createLinearGradient(item.x, item.y, item.x, item.y + item.h);
        gradient.addColorStop(0, mapDisplayAccent.fill);
        gradient.addColorStop(1, "rgba(10, 23, 19, 0.94)");
        drawWorldRect(item, gradient, mapDisplayAccent.stroke);
        ctx.fillStyle = mapDisplayAccent.text;
        ctx.font = "24px serif";
        ctx.textAlign = "center";
        ctx.fillText(item.label, item.x + item.w / 2, item.y + item.h / 2 + 8);

        if (item.kind === "dropoff") {
          ctx.beginPath();
          ctx.arc(item.x + item.w / 2, item.y + item.h / 2 + 18, 48, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(77, 139, 118, 0.28)";
          ctx.fill();
          ctx.strokeStyle = "rgba(77, 139, 118, 0.74)";
          ctx.stroke();
        }
      });
    }

    function drawProps() {
      props.forEach((prop) => {
        if (!rectVisible(prop, 80)) return;

        if (prop.type === "electronicSign") {
          ctx.fillStyle = "rgba(7, 16, 13, 0.92)";
          ctx.fillRect(prop.x, prop.y, prop.w, prop.h);
          ctx.strokeStyle = "rgba(125, 191, 164, 0.8)";
          ctx.lineWidth = 2;
          ctx.strokeRect(prop.x + 0.5, prop.y + 0.5, prop.w - 1, prop.h - 1);
          ctx.fillStyle = "#7dbfa4";
          ctx.font = "13px serif";
          ctx.textAlign = "center";
          ctx.fillText("G.T.I.停车场", prop.x + prop.w / 2, prop.y + 24);
          return;
        }

        if (prop.type === "specialStall") {
          ctx.fillStyle = routeFill;
          ctx.fillRect(prop.x, prop.y, prop.w, prop.h);
          ctx.strokeStyle = mapDisplayAccent.strokeStrong;
          ctx.lineWidth = 3;
          ctx.strokeRect(prop.x + 0.5, prop.y + 0.5, prop.w - 1, prop.h - 1);
          ctx.fillStyle = mapDisplayAccent.fill;
          ctx.fillRect(prop.x + 8, prop.y + 8, prop.w - 16, prop.h - 16);
          ctx.fillStyle = mapDisplayAccent.text;
          ctx.font = "15px serif";
          ctx.textAlign = "center";
          ctx.fillText("总部", prop.x + prop.w / 2, prop.y + prop.h / 2);
          return;
        }

        if (prop.type === "alienDevice") {
          ctx.beginPath();
          ctx.arc(prop.x, prop.y, prop.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(77, 139, 118, 0.26)";
          ctx.fill();
          ctx.strokeStyle = "rgba(125, 191, 164, 0.9)";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(prop.x, prop.y, prop.r * 0.42, 0, Math.PI * 2);
          ctx.strokeStyle = mapDisplayAccent.strokeStrong;
          ctx.stroke();
          return;
        }

        if (prop.type === "oldGreenCar") {
          ctx.fillStyle = "#18372e";
          ctx.fillRect(prop.x + 8, prop.y + 16, prop.w - 16, prop.h - 24);
          ctx.fillStyle = "rgba(230, 221, 200, 0.12)";
          ctx.fillRect(prop.x + 24, prop.y + 34, prop.w - 48, 28);
          ctx.strokeStyle = mapDisplayAccent.stroke;
          ctx.lineWidth = 2;
          ctx.strokeRect(prop.x + 8.5, prop.y + 16.5, prop.w - 17, prop.h - 25);
          return;
        }

        if (prop.type === "garageDoor") {
          ctx.fillStyle = "rgba(12, 18, 16, 0.95)";
          ctx.fillRect(prop.x, prop.y, prop.w, prop.h);
          ctx.strokeStyle = "rgba(230, 221, 200, 0.18)";
          ctx.lineWidth = 2;
          for (let y = prop.y + 16; y < prop.y + prop.h; y += 18) {
            ctx.beginPath();
            ctx.moveTo(prop.x, y);
            ctx.lineTo(prop.x + prop.w, y);
            ctx.stroke();
          }
          ctx.fillStyle = "rgba(230, 221, 200, 0.78)";
          ctx.font = "18px serif";
          ctx.textAlign = "center";
          ctx.fillText("B1 / B2 / B3", prop.x + prop.w / 2, prop.y + prop.h / 2 + 7);
          return;
        }

        if (prop.type === "scanner") {
          ctx.fillStyle = "rgba(7, 16, 13, 0.94)";
          ctx.fillRect(prop.x, prop.y, prop.w, prop.h);
          ctx.strokeStyle = "rgba(125, 191, 164, 0.72)";
          ctx.strokeRect(prop.x + 0.5, prop.y + 0.5, prop.w - 1, prop.h - 1);
          ctx.fillStyle = "#7dbfa4";
          ctx.fillRect(prop.x + 17, prop.y + 15, 24, 24);
          return;
        }

        ctx.strokeStyle = "rgba(230, 221, 200, 0.2)";
        ctx.lineWidth = 2;
        ctx.strokeRect(prop.x + 0.5, prop.y + 0.5, prop.w - 1, prop.h - 1);
        if (prop.occupied) {
          ctx.fillStyle = prop.tint;
          ctx.fillRect(prop.x + 8, prop.y + 12, prop.w - 16, prop.h - 22);
          ctx.fillStyle = "rgba(230, 221, 200, 0.08)";
          ctx.fillRect(prop.x + 16, prop.y + 22, prop.w - 32, 16);
        }
      });
    }

    function drawThings() {
      things.forEach((thing) => {
        if (!pointVisible(thing)) return;
        const near = thing === nearbyThing;
        const isExit = thing.type === "exit";
        const isBreaker = thing.type === "eventBreaker";
        const isSss = thing.density === "sss";
        const searched = searchedThings.has(thing.name);
        const investigated = investigatedThings.has(thing.name);
        const locked = Boolean(thing.lockedCard && !investigated && !searched);
        if (isSss && !searched) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          const pulse = 0.5 + Math.sin(performance.now() / 260) * 0.18;
          const glow = ctx.createRadialGradient(thing.x, thing.y, 8, thing.x, thing.y, thing.r + 52);
          glow.addColorStop(0, `rgba(229, 143, 112, ${0.28 + pulse * 0.18})`);
          glow.addColorStop(1, "rgba(229, 143, 112, 0)");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(thing.x, thing.y, thing.r + 52, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.beginPath();
        ctx.arc(thing.x, thing.y, thing.r, 0, Math.PI * 2);
        ctx.fillStyle = isBreaker
          ? worldEvent.blackoutActive ? "rgba(111, 36, 34, 0.86)" : "rgba(77, 139, 118, 0.24)"
          : isSss && !searched
          ? near ? "rgba(111, 36, 34, 0.88)" : "rgba(72, 30, 30, 0.88)"
          : isExit
          ? near ? "rgba(77, 139, 118, 0.28)" : "rgba(77, 139, 118, 0.14)"
          : locked
          ? near ? "rgba(76, 62, 38, 0.9)" : "rgba(34, 30, 24, 0.88)"
          : searched
          ? "rgba(77, 139, 118, 0.2)"
          : near
            ? mapDisplayAccent.fillStrong
            : "rgba(7, 16, 13, 0.72)";
        ctx.fill();
        ctx.strokeStyle = isBreaker
          ? worldEvent.blackoutActive ? "rgba(255, 118, 118, 0.9)" : "rgba(125, 191, 164, 0.88)"
          : isSss && !searched
          ? near ? "rgba(255, 220, 135, 0.98)" : "rgba(229, 143, 112, 0.82)"
          : isExit
          ? near ? "rgba(125, 191, 164, 0.95)" : "rgba(77, 139, 118, 0.62)"
          : locked
          ? near ? "rgba(255, 220, 135, 0.94)" : "rgba(199, 169, 107, 0.68)"
          : searched
          ? "rgba(77, 139, 118, 0.78)"
          : near
            ? mapDisplayAccent.strokeStrong
            : investigated
              ? mapDisplayAccent.strokeStrong
              : mapDisplayAccent.stroke;
        ctx.lineWidth = near ? 3 : 1;
        ctx.stroke();
        ctx.fillStyle = isBreaker && worldEvent.blackoutActive ? "#ffdddd" : isSss && !searched ? "#ffdc87" : locked ? "#f0d994" : near ? "#eef4ef" : mapDisplayAccent.dimText;
        ctx.font = isSss ? "17px serif" : "20px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(thing.icon, thing.x, thing.y);

        if (searchState?.thing === thing) {
          drawMagnifier(thing.x, thing.y - thing.r - 20, performance.now() / 1000);
        }
      });
    }

    function drawWheelTracks() {
      wheelTracks.forEach((track) => {
        if (!pointVisible(track, 80)) return;
        const t = track.age / track.duration;
        ctx.save();
        ctx.translate(track.x, track.y);
        ctx.rotate(track.angle);
        ctx.globalAlpha = Math.max(0, 0.72 - t * 0.62);
        ctx.fillStyle = "rgba(32, 18, 13, 0.88)";
        ctx.fillRect(-48, -24, 96, 12);
        ctx.fillRect(-48, 12, 96, 12);
        ctx.strokeStyle = "rgba(229, 143, 112, 0.62)";
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 8]);
        ctx.strokeRect(-50, -25, 100, 50);
        ctx.setLineDash([]);
        ctx.restore();
      });
    }

    function drawAttackWarnings() {
      aiScavs.forEach((npc) => {
        if (!npc.isBoss || !npc.active || npc.dead || npc.dashCharge <= 0) return;
        if (!pointVisible(npc, 900)) return;
        const progress = 1 - clamp(npc.dashCharge / 1.1, 0, 1);
        ctx.save();
        ctx.translate(npc.x, npc.y);
        ctx.rotate(Math.atan2(npc.dashVy || 0, npc.dashVx || 1));
        ctx.globalAlpha = 0.24 + progress * 0.34;
        ctx.fillStyle = "rgba(255, 118, 118, 0.24)";
        ctx.fillRect(38, -38, 560, 76);
        ctx.strokeStyle = "rgba(255, 220, 135, 0.88)";
        ctx.lineWidth = 3 + progress * 3;
        ctx.setLineDash([24, 18]);
        ctx.strokeRect(38, -38, 560, 76);
        ctx.setLineDash([]);
        ctx.restore();
      });

      attackWarnings.forEach((warning) => {
        const source = warning.source || warning;
        if (!source || !pointVisible(source, 900)) return;
        const progress = clamp(warning.age / warning.duration, 0, 1);
        const pulse = 0.55 + Math.sin(performance.now() / 70) * 0.12;
        ctx.save();
        ctx.globalAlpha = 0.2 + progress * 0.48;
        if (warning.kind === "ranged" || warning.kind === "laser" || warning.kind === "guardianShot") {
          const x = source.x;
          const y = source.y;
          const vx = warning.vx || 1;
          const vy = warning.vy || 0;
          const range = warning.range || 520;
          const width = warning.width || 18;
          ctx.translate(x, y);
          ctx.rotate(Math.atan2(vy, vx));
          ctx.fillStyle = warning.kind === "laser" ? "rgba(255, 80, 80, 0.18)" : "rgba(255, 220, 135, 0.15)";
          ctx.fillRect(12, -width / 2, range, width);
          ctx.strokeStyle = warning.color || "rgba(229, 143, 112, 0.86)";
          ctx.lineWidth = warning.kind === "laser" ? 4 + progress * 4 : 2 + progress * 3;
          ctx.beginPath();
          ctx.moveTo(12, 0);
          ctx.lineTo(range, 0);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(Math.min(range, Math.hypot((warning.targetX || x) - x, (warning.targetY || y) - y)), 0, 8 + progress * 12, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          const radius = warning.radius || warning.hitRange || 72;
          ctx.beginPath();
          ctx.arc(source.x, source.y, radius, 0, Math.PI * 2);
          ctx.fillStyle = warning.kind === "guardianPulse" ? "rgba(125, 191, 164, 0.12)" : "rgba(255, 220, 135, 0.12)";
          ctx.fill();
          ctx.strokeStyle = warning.color || "rgba(255, 220, 135, 0.86)";
          ctx.lineWidth = 2 + progress * 5;
          ctx.setLineDash([12 + progress * 16, 10]);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.arc(source.x, source.y, Math.max(8, radius * progress), 0, Math.PI * 2);
          ctx.globalAlpha = Math.min(0.76, 0.18 + pulse * progress);
          ctx.stroke();
        }
        ctx.restore();
      });
    }

    function drawFreezeBar(npc) {
      if (!npc || npc.dead || npc.active === false) return;
      const ratio = npc.frozen ? 1 : clamp((npc.freeze || 0) / freezeMax(npc), 0, 1);
      if (ratio <= 0) return;
      const barWidth = npc.isBoss ? 108 : 48;
      const y = npc.y + npc.r + 10;
      ctx.save();
      ctx.fillStyle = "rgba(7, 16, 13, 0.82)";
      ctx.fillRect(npc.x - barWidth / 2, y, barWidth, 6);
      ctx.fillStyle = npc.frozen ? "rgba(215, 245, 255, 0.96)" : "rgba(125, 220, 255, 0.92)";
      ctx.fillRect(npc.x - barWidth / 2, y, barWidth * ratio, 6);
      ctx.strokeStyle = "rgba(125, 220, 255, 0.55)";
      ctx.lineWidth = 1;
      ctx.strokeRect(npc.x - barWidth / 2, y, barWidth, 6);
      ctx.restore();
    }

    function drawBurnBar(npc) {
      if (!npc || npc.dead || npc.active === false || !npc.burnLeft) return;
      const ratio = clamp((npc.burnLeft || 0) / (nightBurnDurationSeconds + 2), 0, 1);
      if (ratio <= 0) return;
      const radius = Number(npc.r || npc.radius || 18);
      const barWidth = npc.isBoss ? 112 : 52;
      const y = npc.y + radius + 19 + ((npc.freeze || npc.frozen) ? 8 : 0);
      const pulse = 0.5 + Math.sin(performance.now() / 85 + npc.x) * 0.5;
      ctx.save();
      ctx.fillStyle = "rgba(24, 11, 10, 0.88)";
      ctx.fillRect(npc.x - barWidth / 2, y, barWidth, 7);
      const burnGradient = ctx.createLinearGradient(npc.x - barWidth / 2, y, npc.x + barWidth / 2, y);
      burnGradient.addColorStop(0, "rgba(132, 32, 30, 0.96)");
      burnGradient.addColorStop(0.58, "rgba(229, 88, 62, 0.98)");
      burnGradient.addColorStop(1, "rgba(255, 190, 96, 0.98)");
      ctx.fillStyle = burnGradient;
      ctx.fillRect(npc.x - barWidth / 2, y, barWidth * ratio, 7);
      ctx.strokeStyle = `rgba(255, 176, 88, ${0.68 + pulse * 0.22})`;
      ctx.lineWidth = 1.4;
      ctx.strokeRect(npc.x - barWidth / 2, y, barWidth, 7);
      for (let index = 0; index < 4; index += 1) {
        const x = npc.x - barWidth / 2 + barWidth * ratio * (0.18 + index * 0.21);
        ctx.globalAlpha = 0.42 + pulse * 0.28;
        ctx.fillStyle = index % 2 ? "rgba(255, 190, 96, 0.88)" : "rgba(132, 124, 110, 0.7)";
        ctx.beginPath();
        ctx.arc(x, y - 2 - index % 2, 1.4 + (index % 2), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawEntityHealthBar(entity, options = {}) {
      if (!entity || entity.dead || entity.active === false) return;
      const maxHp = Number(entity.maxHp || entity.baseHp || 3);
      const hp = Number(entity.hp ?? maxHp);
      if (!Number.isFinite(maxHp) || maxHp <= 0 || !Number.isFinite(hp)) return;
      const x = Number(options.x ?? entity.x);
      const y = Number(options.y ?? entity.y);
      const radius = Number(options.r ?? entity.r ?? entity.radius ?? 18);
      const width = Number(options.width ?? Math.max(44, Math.min(128, radius * 2.35)));
      const height = Number(options.height ?? 5);
      const top = y - radius - Number(options.offset ?? 17);
      const ratio = clamp(hp / maxHp, 0, 1);
      const color = options.color || (ratio > 0.45 ? "rgba(125, 191, 164, 0.94)" : "rgba(229, 143, 112, 0.94)");
      ctx.save();
      if (options.label) {
        ctx.fillStyle = options.labelColor || "#e6ddc8";
        ctx.font = options.labelFont || "12px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText(options.label, x, top - 4);
      }
      ctx.fillStyle = "rgba(7, 16, 13, 0.84)";
      ctx.beginPath();
      ctx.roundRect(x - width / 2, top, width, height, height / 2);
      ctx.fill();
      ctx.fillStyle = color;
      if (ratio > 0) {
        ctx.beginPath();
        ctx.roundRect(x - width / 2, top, width * ratio, height, height / 2);
        ctx.fill();
      }
      ctx.strokeStyle = options.stroke || "rgba(199, 169, 107, 0.44)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x - width / 2, top, width, height);
      ctx.restore();
    }

    function drawBossCarbot(boss, near) {
      ctx.save();
      const executionOffset = combinedNpcOffset(boss);
      ctx.translate(boss.x + executionOffset.x, boss.y + executionOffset.y);
      ctx.rotate(executionOffset.rotation || 0);
      if (boss.dead) {
        ctx.rotate(-0.22);
        ctx.fillStyle = near ? "rgba(164, 138, 82, 0.28)" : "rgba(55, 44, 36, 0.82)";
        ctx.strokeStyle = boss.searched ? "rgba(77, 139, 118, 0.72)" : near ? "rgba(199, 169, 107, 0.95)" : "rgba(164, 138, 82, 0.58)";
        ctx.lineWidth = near ? 4 : 3;
        ctx.fillRect(-54, -28, 108, 56);
        ctx.strokeRect(-54, -28, 108, 56);
        ctx.fillStyle = near ? "#e6ddc8" : "#a48a52";
        ctx.font = "20px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(boss.searched ? "空" : "残骸", 0, 0);
        ctx.restore();
        return;
      }

      const charging = boss.dashCharge > 0;
      const dashing = boss.dashDuration > 0;
      ctx.rotate(dashing ? Math.atan2(boss.dashVy, boss.dashVx) : Math.sin(performance.now() / 220) * 0.04);
      ctx.fillStyle = boss.frozen ? "rgba(58, 100, 115, 0.94)" : boss.phase === 2 ? "rgba(111, 36, 34, 0.94)" : "rgba(47, 76, 73, 0.94)";
      ctx.strokeStyle = boss.frozen ? "rgba(215, 245, 255, 0.96)" : charging ? "rgba(255, 220, 135, 0.96)" : boss.phase === 2 ? "rgba(229, 143, 112, 0.96)" : "rgba(125, 191, 164, 0.94)";
      ctx.lineWidth = near || charging ? 4 : 3;
      ctx.beginPath();
      ctx.roundRect(-58, -38, 116, 76, 12);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "rgba(7, 16, 13, 0.72)";
      ctx.fillRect(-34, -24, 68, 20);
      ctx.fillStyle = boss.frozen ? "#d7f5ff" : charging ? "#ffdc87" : boss.phase === 2 ? "#f0d0bd" : "#d9eadf";
      ctx.font = "24px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("牛", 0, 5);

      ctx.strokeStyle = "rgba(199, 169, 107, 0.9)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(34, 24);
      ctx.lineTo(72, 46);
      ctx.stroke();
      ctx.fillStyle = "rgba(199, 169, 107, 0.95)";
      ctx.beginPath();
      ctx.moveTo(76, 48);
      ctx.lineTo(56, 42);
      ctx.lineTo(68, 28);
      ctx.closePath();
      ctx.fill();

      if (charging) {
        ctx.beginPath();
        ctx.arc(0, 0, 76 + Math.sin(performance.now() / 70) * 6, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255, 220, 135, 0.44)";
        ctx.lineWidth = 5;
        ctx.stroke();
      }
      ctx.restore();

      drawEntityHealthBar(boss, {
        x: boss.x + executionOffset.x,
        y: boss.y + executionOffset.y,
        r: boss.r,
        width: 128,
        height: 8,
        offset: 18,
        color: boss.phase === 2 ? "rgba(229, 143, 112, 0.95)" : "rgba(125, 191, 164, 0.95)",
        stroke: "rgba(199, 169, 107, 0.5)",
        label: `${boss.name}${boss.phase === 2 ? " · 二阶段" : ""}`,
        labelFont: "14px serif"
      });
      drawFreezeBar(boss);
      drawBurnBar(boss);
    }

    function drawAiScavs() {
      aiScavs.forEach((npc) => {
        if (npc.active === false) return;
        drawGuardianBlinkPreview(npc);
        if (!pointVisible(npc, 180)) return;
        const near = npc === nearbyNpc;
        if (npc.isBoss) {
          drawBossCarbot(npc, near);
          if (searchState?.thing === npc) {
            drawMagnifier(npc.x, npc.y - npc.r - 22, performance.now() / 1000);
          }
          return;
        }
      const executionOffset = combinedNpcOffset(npc);
      ctx.save();
      ctx.translate(npc.x + executionOffset.x, npc.y + executionOffset.y);
      ctx.rotate(executionOffset.rotation || 0);
        if (npc.dead) {
          ctx.rotate(-0.32);
          ctx.fillStyle = near ? "rgba(164, 138, 82, 0.24)" : "rgba(60, 50, 42, 0.72)";
          ctx.strokeStyle = npc.searched ? "rgba(77, 139, 118, 0.7)" : near ? "rgba(199, 169, 107, 0.92)" : "rgba(164, 138, 82, 0.5)";
          ctx.lineWidth = near ? 3 : 2;
          ctx.fillRect(-24, -12, 48, 24);
          ctx.strokeRect(-24, -12, 48, 24);
          ctx.fillStyle = near ? "#e6ddc8" : "#a48a52";
          ctx.font = "17px serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(npc.searched ? "空" : "包", 0, 0);
        } else {
          const guardian = Boolean(npc.guardian);
          const secondWave = Boolean(npc.secondWave);
          ctx.beginPath();
          ctx.arc(0, 0, npc.r, 0, Math.PI * 2);
          ctx.fillStyle = npc.frozen
            ? "rgba(58, 100, 115, 0.88)"
            : guardian
            ? near ? "rgba(180, 54, 54, 0.38)" : "rgba(85, 42, 38, 0.9)"
            : secondWave
            ? near ? "rgba(215, 245, 255, 0.34)" : "rgba(46, 72, 92, 0.9)"
            : npc.attackType === "ranged"
            ? near ? "rgba(125, 191, 164, 0.3)" : "rgba(39, 84, 74, 0.82)"
            : near ? "rgba(180, 95, 72, 0.3)" : "rgba(94, 53, 45, 0.82)";
          ctx.fill();
          ctx.strokeStyle = npc.frozen
            ? "rgba(215, 245, 255, 0.95)"
            : guardian

          ctx.restore();

        drawFreezeBar(npc);

          drawMagnifier(npc.x, npc.y - npc.r - 22, performance.now() / 1000);

    }

        ctx.lineTo(-112, -16);

        ctx.fill();
        ctx.beginPath();

        ctx.lineTo(112, -42);

    function drawBreakerArrow() {
      if (!worldEvent.blackoutActive || !worldEvent.breaker) return;
      const dx = worldEvent.breaker.x - player.x;
      const dy = worldEvent.breaker.y - player.y;
      const distance = Math.hypot(dx, dy);
      if (distance < 150) return;
      const angle = Math.atan2(dy, dx);
      const x = player.x + Math.cos(angle) * 150;
      const y = player.y + Math.sin(angle) * 150;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.globalCompositeOperation = "source-over";
      ctx.shadowColor = "rgba(255, 72, 72, 0.95)";
      ctx.shadowBlur = 18;
      ctx.strokeStyle = "rgba(255, 88, 88, 0.95)";
      ctx.fillStyle = "rgba(255, 88, 88, 0.95)";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-24, 0);
      ctx.lineTo(24, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(28, 0);
      ctx.lineTo(4, -15);
      ctx.lineTo(4, 15);

      const distance = Math.hypot(dx, dy);
      if (distance < zone.r + 120) return;
      const angle = Math.atan2(dy, dx);
      const proximity = timedExtractProximity();

      const x = player.x + Math.cos(angle) * 132;
      const y = player.y + Math.sin(angle) * 132;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.globalAlpha = alpha;
      ctx.shadowColor = "rgba(255, 88, 88, 0.55)";
      ctx.shadowBlur = 10;
      ctx.strokeStyle = "rgba(255, 118, 118, 0.95)";
      ctx.fillStyle = "rgba(255, 118, 118, 0.88)";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-34, 0);
      ctx.lineTo(22, 0);

      ctx.beginPath();
      ctx.moveTo(28, 0);
      ctx.lineTo(6, -13);
      ctx.lineTo(6, 13);

    function drawBlackoutOverlay() {
      if (!worldEvent.blackoutActive) return;
      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      let blackoutAlpha = 0.82;
      if (worldEvent.blackoutRestoring) {
        const elapsed = 1.25 - worldEvent.blackoutFlickerLeft;
        const phase = Math.floor(elapsed / 0.24);
        blackoutAlpha = phase === 1 || phase === 3 ? 0.26 : 0.82;
      }
      ctx.fillStyle = `rgba(0, 0, 0, ${blackoutAlpha})`;
      ctx.fillRect(camera.x, camera.y, camera.width, camera.height);
      ctx.globalCompositeOperation = "destination-out";
      const glow = ctx.createRadialGradient(player.x, player.y, 35, player.x, player.y, 205);
      glow.addColorStop(0, "rgba(0, 0, 0, 0.95)");
      glow.addColorStop(0.46, "rgba(0, 0, 0, 0.52)");
      glow.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(player.x, player.y, 205, 0, Math.PI * 2);
      ctx.fill();
      if (heroSkillHaloActive()) {
        const haloRadius = heroSkillHaloRadius + 22;
        const haloGlow = ctx.createRadialGradient(player.x, player.y, heroSkillHaloRadius * 0.48, player.x, player.y, haloRadius);
        haloGlow.addColorStop(0, "rgba(0, 0, 0, 0)");
        haloGlow.addColorStop(0.6, "rgba(0, 0, 0, 0.42)");
        haloGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = haloGlow;
        ctx.beginPath();
        ctx.arc(player.x, player.y, haloRadius, 0, Math.PI * 2);
        ctx.fill();
      }
      if (selectedCharacter === "hero") {
        heroOrbPositions().forEach((orb) => {
          ctx.save();
          ctx.globalAlpha = orb.alpha ?? 1;
          const lightRadius = orb.ring === "inner" ? heroOrbLightRadius * 1.32 : heroOrbLightRadius * 1.12;
          const orbGlow = ctx.createRadialGradient(orb.x, orb.y, 8, orb.x, orb.y, lightRadius);
          orbGlow.addColorStop(0, "rgba(0, 0, 0, 0.82)");
          orbGlow.addColorStop(0.42, "rgba(0, 0, 0, 0.38)");
          orbGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = orbGlow;
          ctx.beginPath();
          ctx.arc(orb.x, orb.y, lightRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }
      ctx.globalCompositeOperation = "source-over";
      drawBreakerArrow();
      if (selectedCharacter === "hero") drawHeroOrb();
      ctx.restore();
    }

    function heroTrailRibbonPoints(side) {
      const offset = 21 * side;
      return heroTrailSamples.map((sample, index) => {
        const prev = heroTrailSamples[Math.max(0, index - 1)];
        const next = heroTrailSamples[Math.min(heroTrailSamples.length - 1, index + 1)];
        const dx = next.x - prev.x;
        const dy = next.y - prev.y;
        const length = Math.hypot(dx, dy) || 1;
        const nx = -dy / length;
        const ny = dx / length;
        return {
          x: sample.x + nx * offset,
          y: sample.y + ny * offset,
          fade: Math.max(0, 1 - sample.age / sample.duration)
        };
      });
    }

    function strokeHeroTrailPath(points, glow = false) {
      if (points.length < 2) return;
      for (let index = 1; index < points.length; index += 1) {
        const prev = points[index - 1];
        const current = points[index];
        const next = points[Math.min(points.length - 1, index + 1)];
        const midX = (current.x + next.x) / 2;
        const midY = (current.y + next.y) / 2;
        const fade = Math.max(0, Math.min(1, current.fade));
        ctx.globalAlpha = glow ? fade * 0.18 : fade * 0.82;
        ctx.lineWidth = glow
          ? 4 + fade * 12
          : 1.1 + fade * 4.4;
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        if (index < points.length - 1) {
          ctx.quadraticCurveTo(current.x, current.y, midX, midY);
        } else {
          ctx.lineTo(current.x, current.y);
        }
        ctx.stroke();
      }
    }

    function drawHeroTrailRibbon(side, glow = false) {
      if (heroTrailSamples.length < 2) return;
      const style = activeTrailStyle();
      if (!style) return;
      const points = heroTrailRibbonPoints(side);
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = glow ? style.glowShadow : style.shadow;
      ctx.shadowBlur = glow ? 18 : 12;
      ctx.strokeStyle = glow ? style.glow : style.stroke;
      strokeHeroTrailPath(points, glow);
      ctx.restore();
    }

    function drawHeroTrail() {
      if (!heroTrailParticles.length && !heroTrailBeams.length && heroTrailSamples.length < 2) return;
      const style = activeTrailStyle();
      if (!style) return;
      drawHeroTrailRibbon(-1, true);
      drawHeroTrailRibbon(1, true);
      drawHeroTrailRibbon(-1, false);
      drawHeroTrailRibbon(1, false);
      heroTrailBeams.forEach((beam) => {
        const t = beam.age / beam.duration;
        const alpha = Math.max(0, 1 - t);
        ctx.save();
        ctx.globalAlpha = alpha * 0.78;
        ctx.lineCap = "round";
        ctx.shadowColor = style.beamGlow;
        ctx.shadowBlur = 18;
        ctx.strokeStyle = style.beam;
        ctx.lineWidth = 5.5 - t * 2.5;
        ctx.beginPath();
        ctx.moveTo(beam.x1, beam.y1);
        ctx.lineTo(beam.x2, beam.y2);
        ctx.stroke();
        ctx.globalAlpha = alpha * 0.26;
        ctx.strokeStyle = style.beamGlow;
        ctx.lineWidth = 12 - t * 5;
        ctx.beginPath();
        ctx.moveTo(beam.x1, beam.y1);
        ctx.lineTo(beam.x2, beam.y2);
        ctx.stroke();
        ctx.restore();
      });
      heroTrailParticles.forEach((particle) => {
        const t = particle.age / particle.duration;
        const alpha = Math.max(0, 1 - t);
        ctx.save();
        ctx.globalAlpha = alpha * 0.82;
        ctx.shadowColor = style.particleGlow;
        ctx.shadowBlur = 12 + particle.r * 2;
        ctx.fillStyle = style.particle;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.r * (1 - t * 0.35), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = alpha * 0.22;
        ctx.strokeStyle = style.beamGlow;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.r * (3.2 - t), 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });
    }

    function catTrailRibbonPoints() {
      return catTrailSamples.map((sample) => ({
        x: sample.x,
        y: sample.y,
        fade: Math.max(0, 1 - sample.age / sample.duration)
      }));
    }

    function drawCatTrailRibbon(glow = false) {
      if (catTrailSamples.length < 2) return;
      const points = catTrailRibbonPoints();
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = glow ? "rgba(92, 98, 112, 0.42)" : "rgba(140, 148, 164, 0.58)";
      ctx.shadowBlur = glow ? 12 : 7;
      ctx.strokeStyle = glow ? "rgba(92, 98, 112, 0.34)" : "rgba(136, 143, 158, 0.78)";
      for (let index = 1; index < points.length; index += 1) {
        const prev = points[index - 1];
        const current = points[index];
        const next = points[Math.min(points.length - 1, index + 1)];
        const midX = (current.x + next.x) / 2;
        const midY = (current.y + next.y) / 2;
        const fade = Math.max(0, Math.min(1, current.fade));
        ctx.globalAlpha = glow ? fade * 0.2 : fade * 0.68;
        ctx.lineWidth = glow ? 5 + fade * 15 : 1 + fade * 5.2;
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        if (index < points.length - 1) {
          ctx.quadraticCurveTo(current.x, current.y, midX, midY);
        } else {
          ctx.lineTo(current.x, current.y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawCatSkillShuriken(claw, large) {
      const spin = (claw.spinSeed || 0) + claw.distance * 0.055;
      const scale = large ? 1.35 : 0.94;
      ctx.save();
      ctx.rotate(spin);
      ctx.shadowColor = "rgba(238, 243, 255, 0.78)";
      ctx.shadowBlur = large ? 15 : 10;
      ctx.fillStyle = large ? "rgba(232, 237, 246, 0.96)" : "rgba(188, 196, 210, 0.9)";
      ctx.strokeStyle = large ? "rgba(95, 102, 118, 0.92)" : "rgba(75, 82, 96, 0.82)";
      ctx.lineWidth = large ? 1.8 : 1.35;
      for (let blade = 0; blade < 4; blade += 1) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(20 * scale, -5 * scale);
        ctx.lineTo(11 * scale, 9 * scale);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(8, 14, 13, 0.92)";
      ctx.beginPath();
      ctx.arc(0, 0, 3.6 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(238, 243, 255, 0.76)";
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = large ? 0.5 : 0.34;
      ctx.lineCap = "round";
      ctx.shadowColor = "rgba(238, 243, 255, 0.58)";
      ctx.shadowBlur = large ? 14 : 9;
      ctx.strokeStyle = "rgba(188, 196, 210, 0.74)";
      ctx.lineWidth = large ? 5 : 3.4;
      ctx.beginPath();
      ctx.moveTo(large ? -54 : -38, 0);
      ctx.lineTo(large ? -18 : -13, 0);
      ctx.stroke();
      ctx.globalAlpha = large ? 0.18 : 0.12;
      ctx.lineWidth = large ? 12 : 8;
      ctx.beginPath();
      ctx.moveTo(large ? -66 : -48, 0);
      ctx.lineTo(large ? -18 : -13, 0);
      ctx.stroke();
      ctx.restore();
    }

    function drawCatShuriken(shuriken) {
      const t = shuriken.age / shuriken.duration;
      const alpha = Math.max(0, 1 - t);
      ctx.save();
      ctx.translate(shuriken.x, shuriken.y);
      ctx.rotate(shuriken.angle);
      ctx.globalAlpha = alpha * 0.78;
      ctx.shadowColor = "rgba(238, 243, 255, 0.76)";
      ctx.shadowBlur = 8;
      ctx.strokeStyle = "rgba(238, 243, 255, 0.86)";
      ctx.fillStyle = "rgba(205, 214, 230, 0.35)";
      ctx.lineWidth = 1.4;
      for (let blade = 0; blade < 4; blade += 1) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(shuriken.size, -shuriken.size * 0.28);
        ctx.lineTo(shuriken.size * 0.66, shuriken.size * 0.32);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(0, 0, shuriken.size * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.82)";
      ctx.fill();

    function drawCatTrail() {
      if (selectedCharacter !== "cat" || (catTrailSamples.length < 2 && !catShurikenParticles.length)) return;
      drawCatTrailRibbon(true);
      drawCatTrailRibbon(false);
      catShurikenParticles.forEach(drawCatShuriken);
    }

    function eggTrailRibbonPoints(side) {
      const offset = 21 * side;
      return eggTrailSamples.map((sample, index) => {
        const prev = eggTrailSamples[Math.max(0, index - 1)];
        const next = eggTrailSamples[Math.min(eggTrailSamples.length - 1, index + 1)];
        const dx = next.x - prev.x;
        const dy = next.y - prev.y;
        const length = Math.hypot(dx, dy) || 1;
        const nx = -dy / length;
        const ny = dx / length;
        return {
          x: sample.x + nx * offset,
          y: sample.y + ny * offset,
          fade: Math.max(0, 1 - sample.age / sample.duration)
        };
      });
    }

    function drawEggTrailRibbon(side, glow = false) {
      if (!hasEggFrostTrailEquipped() || eggTrailSamples.length < 2) return;
      const points = eggTrailRibbonPoints(side);
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = glow ? "rgba(160, 226, 255, 0.48)" : "rgba(186, 235, 255, 0.58)";
      ctx.shadowBlur = glow ? 18 : 9;
      ctx.strokeStyle = glow ? "rgba(162, 226, 255, 0.3)" : "rgba(205, 242, 255, 0.84)";
      for (let index = 1; index < points.length; index += 1) {
        const prev = points[index - 1];
        const current = points[index];
        const next = points[Math.min(points.length - 1, index + 1)];
        const midX = (current.x + next.x) / 2;
        const midY = (current.y + next.y) / 2;
        const fade = Math.max(0, Math.min(1, current.fade));
        ctx.globalAlpha = glow ? fade * 0.22 : fade * 0.78;
        ctx.lineWidth = glow ? 5 + fade * 13 : 0.9 + fade * 4.9;
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        if (index < points.length - 1) {
          ctx.quadraticCurveTo(current.x, current.y, midX, midY);
        } else {
          ctx.lineTo(current.x, current.y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawEggSnowflakeCore(glow = false) {
      if (!hasEggSnowflakeTrailEquipped() || eggTrailSamples.length < 2) return;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = glow ? "rgba(64, 158, 198, 0.34)" : "rgba(64, 158, 198, 0.48)";
      ctx.shadowBlur = glow ? 13 : 8;
      ctx.strokeStyle = glow ? "rgba(70, 164, 205, 0.25)" : "rgba(82, 178, 216, 0.62)";
      for (let index = 1; index < eggTrailSamples.length; index += 1) {
        const prev = eggTrailSamples[index - 1];
        const current = eggTrailSamples[index];
        const next = eggTrailSamples[Math.min(eggTrailSamples.length - 1, index + 1)];
        const midX = (current.x + next.x) / 2;
        const midY = (current.y + next.y) / 2;
        const fade = Math.max(0, Math.min(1, 1 - current.age / current.duration));
        ctx.globalAlpha = glow ? fade * 0.26 : fade * 0.66;
        ctx.lineWidth = glow ? 6 + fade * 7 : 0.95 + fade * 2.2;
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        if (index < eggTrailSamples.length - 1) {
          ctx.quadraticCurveTo(current.x, current.y, midX, midY);
        } else {
          ctx.lineTo(current.x, current.y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawEggSnowflake(flake) {
      const t = flake.age / flake.duration;
      const alpha = Math.max(0, 1 - t);
      const radius = flake.r * (1 - t * 0.28);
      ctx.save();
      ctx.translate(flake.x, flake.y);
      ctx.rotate(flake.angle);
      ctx.globalAlpha = alpha * 0.92;
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(245, 253, 255, 0.96)";
      ctx.shadowColor = "rgba(111, 221, 255, 0.86)";
      ctx.shadowBlur = 14;
      ctx.lineWidth = 1.65;
      for (let arm = 0; arm < 3; arm += 1) {
        ctx.rotate(Math.PI / 3);
        ctx.beginPath();
        ctx.moveTo(-radius, 0);
        ctx.lineTo(radius, 0);
        ctx.stroke();
      }
      ctx.globalAlpha = alpha * 0.5;
      ctx.fillStyle = "rgba(111, 221, 255, 0.78)";
      ctx.beginPath();
      ctx.arc(0, 0, radius * 1.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = alpha * 0.95;
      ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(1.3, radius * 0.22), 0, Math.PI * 2);

    function drawEggTrail() {
      if (selectedCharacter !== "egg" || (eggTrailSamples.length < 2 && !eggSnowflakeParticles.length)) return;

      drawEggSnowflakeCore(false);
