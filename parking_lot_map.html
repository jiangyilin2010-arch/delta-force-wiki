    function unlockParkingAudio() {
      if (parkingAudioUnlocked) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      parkingAudioContext = parkingAudioContext || new AudioContextClass();
      parkingAudioContext.resume?.();
      parkingAudioUnlocked = true;
    }

    function timedExtractProximity() {
      const zone = worldEvent.timedExtract;
      if (!zone || zone.left <= 0) return 0;
      const distance = Math.hypot(player.x - zone.x, player.y - zone.y);
      return 1 - clamp(distance / 1650, 0, 1);
    }

    function sssCollectionActive() {
      return Boolean(worldEvent.thing && worldEvent.thing.density === "sss" && !searchedThings.has(worldEvent.thing.name));
    }

    function sssCollectionProximity() {
      if (!sssCollectionActive()) return 0;
      const thing = worldEvent.thing;
      const distance = Math.hypot(player.x - thing.x, player.y - thing.y);
      return 1 - clamp(distance / 1800, 0, 1);
    }

    function playTimedExtractPing(proximity) {
      if (!parkingAudioUnlocked || !parkingAudioContext) return;
      const now = parkingAudioContext.currentTime;
      const volume = 0.012 + proximity * 0.105;
      const frequency = 430 + proximity * 180;
      const oscillator = parkingAudioContext.createOscillator();
      const gain = parkingAudioContext.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(frequency, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.035);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      oscillator.connect(gain);
      gain.connect(parkingAudioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.24);
    }

    function playSssCollectionPing(proximity) {
      if (!parkingAudioUnlocked || !parkingAudioContext) return;
      const now = parkingAudioContext.currentTime;
      const volume = 0.01 + proximity * 0.08;
      [0, 0.11].forEach((offset, index) => {
        const oscillator = parkingAudioContext.createOscillator();
        const gain = parkingAudioContext.createGain();
        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime((index ? 620 : 520) + proximity * 80, now + offset);
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(volume * (index ? 0.72 : 1), now + offset + 0.035);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.26);
        oscillator.connect(gain);
        gain.connect(parkingAudioContext.destination);
        oscillator.start(now + offset);
        oscillator.stop(now + offset + 0.28);
      });
    }

    function spatialProximity(x, y, maxDistance = 1100) {
      const distance = Math.hypot(player.x - x, player.y - y);
      return 1 - clamp(distance / maxDistance, 0, 1);
    }

    function playTone(frequency, duration = 0.16, volume = 0.05, type = "sine", when = 0) {
      if (!parkingAudioUnlocked || !parkingAudioContext) return;
      if (parkingAudioContext.state === "suspended") parkingAudioContext.resume?.();
      const now = parkingAudioContext.currentTime + when;
      const oscillator = parkingAudioContext.createOscillator();
      const gain = parkingAudioContext.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), now + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      oscillator.connect(gain);
      gain.connect(parkingAudioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + 0.03);
    }

    function playCombatCue(kind, x = player.x, y = player.y, intensity = 1) {
      if (!parkingAudioUnlocked || !parkingAudioContext) return;
      const now = parkingAudioContext.currentTime;
      const key = `${kind}:${Math.round(x / 180)}:${Math.round(y / 180)}`;
      const cooldown = kind.includes("hit") || kind.includes("hurt") ? 0.06 : 0.18;
      if (combatCueCooldowns[key] && now < combatCueCooldowns[key]) return;
      combatCueCooldowns[key] = now + cooldown;
      const proximity = spatialProximity(x, y);
      if (proximity <= 0.03) return;
      const volume = (0.012 + proximity * 0.075) * intensity;
      if (kind === "bossCharge") {
        playTone(126, 0.34, volume * 1.15, "sawtooth");
        playTone(86, 0.42, volume * 0.58, "triangle", 0.05);
      } else if (kind === "laserWindup") {
        playTone(720, 0.18, volume, "sawtooth");
        playTone(960, 0.22, volume * 0.56, "sine", 0.08);
      } else if (kind === "rangedWindup") {
        playTone(520, 0.12, volume * 0.82, "square");
      } else if (kind === "meleeWindup") {
        playTone(190, 0.16, volume * 0.92, "triangle");
      } else if (kind === "guardian") {
        playTone(390, 0.15, volume, "triangle");
        playTone(650, 0.16, volume * 0.58, "sine", 0.07);
      } else if (kind === "hitHeavy") {
        playTone(96, 0.12, volume * 1.35, "triangle");
      } else if (kind === "hit") {
        playTone(220, 0.08, volume * 0.92, "square");
      } else if (kind === "hurt") {
        playTone(150, 0.16, volume * 1.1, "sawtooth");
      } else if (kind === "cardPass") {
        playTone(620, 0.08, volume * 0.78, "sine");
        playTone(880, 0.11, volume * 0.56, "sine", 0.08);
      } else if (kind === "cardFail") {
        playTone(180, 0.12, volume * 0.82, "square");
      } else if (kind === "search") {
        playTone(440, 0.1, volume * 0.42, "triangle");
      }
    }

    function updateWorldEvent(dt) {
      if (!worldEvent.initialized) {
        worldEvent.startsIn = Math.max(0, worldEvent.startsIn - dt);
        if (worldEvent.startsIn <= 0) initializeWorldEvent();
        return;
      }
      updateBlackoutRestoration(dt);
      if (worldEvent.type === "sssCollection" && worldEvent.thing && !searchedThings.has(worldEvent.thing.name)) {
        steerAiToEvent(worldEvent.thing, 5.5);
      } else {
        aiScavs.forEach((npc) => {
          npc.eventTarget = null;
          npc.eventPull = 0;
        });
      }
      if (worldEvent.timedExtract?.left > 0) {
        worldEvent.timedExtract.left = Math.max(0, worldEvent.timedExtract.left - dt);
        if (worldEvent.timedExtract.left <= 0 && !worldEvent.timedExtract.expired) {
          worldEvent.timedExtract.expired = true;
          worldEvent.notice = "🔴 限时撤离点已经关闭。";
        }
      }
      updateTimedExtractAudio();
      updateSssCollectionAudio();
    }

    function finishBreakerRestoration() {
      if (!worldEvent.breaker) return;
      worldEvent.blackoutActive = false;
      worldEvent.blackoutRestoring = false;
      worldEvent.blackoutFlickerLeft = 0;
      worldEvent.notice = "⚡ 电力恢复。";
      worldEvent.breaker.type = "repairedBreaker";
      worldEvent.breaker.actionText = "搜索";
      worldEvent.breaker.message = "电力恢复。检修箱还能搜。";
      investigatedThings.add(worldEvent.breaker.name);
      promptEl.innerHTML = "<strong>停车场电闸</strong>：电力恢复，可搜索。";
      updateNearbyThing();
      renderHud();
    }

    function updateBlackoutRestoration(dt) {
      if (!worldEvent.blackoutRestoring) return;
      worldEvent.blackoutFlickerLeft = Math.max(0, worldEvent.blackoutFlickerLeft - dt);
      if (worldEvent.blackoutFlickerLeft <= 0) finishBreakerRestoration();
    }

    function updateTimedExtractAudio() {
      if (!worldEvent.timedExtract || worldEvent.timedExtract.left <= 0 || !parkingAudioUnlocked || !parkingAudioContext) return;
      if (parkingAudioContext.state === "suspended") parkingAudioContext.resume?.();
      const now = parkingAudioContext.currentTime;
      if (now < timedExtractNextPingAt) return;
      const proximity = timedExtractProximity();
      playTimedExtractPing(proximity);
      timedExtractNextPingAt = now + 1.15 - proximity * 0.45;
    }

    function updateSssCollectionAudio() {
      if (!sssCollectionActive() || !parkingAudioUnlocked || !parkingAudioContext) return;
      if (parkingAudioContext.state === "suspended") parkingAudioContext.resume?.();
      const now = parkingAudioContext.currentTime;
      if (now < sssCollectionNextPingAt) return;
      const proximity = sssCollectionProximity();
      playSssCollectionPing(proximity);
      sssCollectionNextPingAt = now + 1.6 - proximity * 0.55;
    }

    function validThreatSource(source) {
      return Boolean(source && source.active !== false && !source.dead && !source.frozen && catExecutionState?.target !== source && (source.stunLeft || 0) <= 0);
    }

    function validThreatTarget(target) {
      if (target === player) return !runEnded && player.hp > 0;
      if (target === nightAfterimage) return Boolean(nightAfterimage);
      return Boolean(target && target.active !== false && !target.dead);
    }

    function threatTargetRadius(target) {
      return Number(target?.radius || target?.r || 18);
    }

    function damageThreatTarget(target, amount, sourceName) {
      if (target === nightAfterimage) return damageNightAfterimage(amount, sourceName);
      if (target?.isPvpOpponent) return damagePvpOpponent(amount, sourceName, true, true);
      return damagePlayer(amount, sourceName);
    }

    function shakeScreen(power = 1, duration = 0.16) {
      screenShakePower = Math.max(screenShakePower, power);
      screenShakeLeft = Math.max(screenShakeLeft, duration);
    }

    function addAttackWarning(warning) {
      attackWarnings.push({
        id: `warning-${attackWarningId += 1}`,
        age: 0,
        duration: 0.32,
        ...warning
      });
      playCombatCue(warning.sound || warning.kind || "meleeWindup", warning.x || warning.source?.x || player.x, warning.y || warning.source?.y || player.y, warning.intensity || 1);
    }

    function scheduleMeleeWarning(source, target, options = {}) {
      if (!validThreatSource(source) || !validThreatTarget(target)) return false;
      const hitRange = options.hitRange || source.r + threatTargetRadius(target) + 18;
      addAttackWarning({
        kind: options.kind || "melee",
        sound: options.sound || "meleeWindup",
        source,
        target,
        x: source.x,
        y: source.y,
        hitRange,
        radius: hitRange,
        duration: options.duration || 0.34,
        color: options.color || "rgba(255, 220, 135, 0.86)",
        intensity: options.intensity || 1,
        resolve(warning) {
          if (!validThreatSource(source) || !validThreatTarget(target)) return;
          const distance = Math.hypot(target.x - source.x, target.y - source.y);
          if (distance <= hitRange) {
            hitBursts.push({ x: target.x, y: target.y, age: 0, label: options.label || "命中", power: options.power || 1.1, color: options.color });
            playCombatCue(options.hitSound || "hitHeavy", target.x, target.y, options.intensity || 1);
            shakeScreen(options.shake || 0.65, 0.16);
            damageThreatTarget(target, options.damage || source.damage || 8, options.sourceName || source.name);
          }
        }
      });
      return true;
    }

    function scheduleShotWarning(source, target, options = {}) {
      if (!validThreatSource(source) || !validThreatTarget(target)) return false;
      const dx = target.x - source.x;
      const dy = target.y - source.y;
      const distance = Math.hypot(dx, dy) || 1;
      addAttackWarning({
        kind: options.kind || "ranged",
        sound: options.sound || "rangedWindup",
        source,
        x: source.x,
        y: source.y,
        targetX: target.x,
        targetY: target.y,
        vx: dx / distance,
        vy: dy / distance,
        range: options.range || 540,
        width: options.width || 18,
        duration: options.duration || 0.32,
        color: options.color || "rgba(229, 143, 112, 0.82)",
        intensity: options.intensity || 1,
        resolve() {
          if (!validThreatSource(source)) return;
          const aimTarget = { x: source.x + (dx / distance) * 600, y: source.y + (dy / distance) * 600 };
          options.fire?.(source, aimTarget);
        }
      });
      return true;
    }

    function updateAttackWarnings(dt) {
      if (backpackModal.classList.contains("show")) return;
      for (let index = attackWarnings.length - 1; index >= 0; index -= 1) {
        const warning = attackWarnings[index];
        warning.age += dt;
        if (warning.age < warning.duration) continue;
        attackWarnings.splice(index, 1);
        warning.resolve?.(warning);
      }
    }

    function updateScreenShake(dt) {
      screenShakeLeft = Math.max(0, screenShakeLeft - dt);
      if (screenShakeLeft <= 0) screenShakePower = 0;
    }

    function repairBreaker() {
      if (!worldEvent.blackoutActive || worldEvent.blackoutRestoring || nearbyThing !== worldEvent.breaker) return false;
      worldEvent.blackoutRestoring = true;
      worldEvent.blackoutFlickerLeft = 1.25;
      worldEvent.notice = "⚡ 合闸中。";
      investigatedThings.add(worldEvent.breaker.name);
      promptEl.innerHTML = "<strong>停车场电闸</strong>：合闸。";
      hitBursts.push({ x: worldEvent.breaker.x, y: worldEvent.breaker.y, age: 0, label: "电力" });
      renderHud();
      return true;
    }

    function bossCarbot() {
      return aiScavs.find((npc) => npc.isBoss);
    }

    function triggerBossFromCar() {
      const boss = bossCarbot();
      if (!boss || boss.dead) {
        promptEl.innerHTML = "<strong>废弃车辆</strong>：只剩空驾驶舱。";
        renderHud();
        return;
      }
      if (boss.active) {
        promptEl.innerHTML = "<strong>废弃车辆</strong> 仍在抖动。";
        renderHud();
        return;
      }
      boss.active = true;
      boss.x = 920;
      boss.y = 2090;
      boss.hp = boss.maxHp;
      boss.freeze = 0;
      boss.frozen = false;
      boss.frozenLeft = 0;
      boss.freezeTick = 0;
      boss.stunLeft = 0;
      boss.target = { x: player.x, y: player.y };
      boss.aggro = 999;
      boss.laserCooldown = 0.5;
      boss.dashCooldown = 2.8;
      danger = Math.max(danger, 72);
      hitBursts.push({ x: boss.x, y: boss.y, age: 0, label: "现身" });
      playCombatCue("bossCharge", boss.x, boss.y, 1.25);
      shakeScreen(0.9, 0.22);
      promptEl.innerHTML = "<strong>野牛星汽车人</strong> 出现。";
      renderHud();
    }

    function spawnBossMinions(boss) {
      const offsets = [
        { x: -118, y: -46 },
        { x: -64, y: 96 },
        { x: 122, y: 54 }
      ];
      offsets.forEach((offset, index) => {
        const x = clamp(boss.x + offset.x, world.margin + 24, world.width - world.margin - 24);
        const y = clamp(boss.y + offset.y, world.margin + 24, world.height - world.margin - 24);
        aiScavs.push({
          id: `boss-minion-${Date.now()}-${index}`,
          name: `野牛星小汽车人${index + 1}`,
          x: canStandAt(x, y) ? x : boss.x,
          y: canStandAt(x, y) ? y : boss.y,
          r: 20,
          speed: 126,
          icon: "车",
          area: "废弃车辆角落",
          density: "ai",
          container: "小汽车人背包",
          attackType: index === 1 ? "ranged" : "melee",
          damage: index === 1 ? 9 : 12,
          dead: false,
          searched: false,
          target: { x: player.x, y: player.y },
          wait: 0,
          maxHp: scaledCombatHp(baseNpcHp),
          hp: scaledCombatHp(baseNpcHp),
          orbHitCooldown: 0,
          haloHitCooldown: 0,
          attackCooldown: 0,
          aggro: 5,
          freeze: 0,
          frozen: false,
          frozenLeft: 0,
          freezeTick: 0,
          isBossMinion: true
        });
      });
      promptEl.innerHTML = "<strong>野牛星汽车人</strong> 召出小汽车人。";
      playCombatCue("bossCharge", boss.x, boss.y, 1.05);
      shakeScreen(0.7, 0.2);
    }

    function fireBossLaser(boss, target = player) {
      const dx = target.x - boss.x;
      const dy = target.y - boss.y;
      const distance = Math.hypot(dx, dy) || 1;
      npcProjectiles.push({
        x: boss.x,
        y: boss.y,
        vx: dx / distance,
        vy: dy / distance,
        speed: 650,
        range: 760,
        r: 8,
        damage: 17,
        source: boss.name,
        kind: "laser",
        distance: 0
      });
      hitBursts.push({ x: boss.x, y: boss.y, age: 0, label: "激光" });
      playCombatCue("laserWindup", boss.x, boss.y, 0.9);
    }

    function leaveWheelTrack(boss) {
      const angle = Math.atan2(boss.dashVy || 0, boss.dashVx || 1);
      wheelTracks.push({
        x: boss.x,
        y: boss.y,
        angle,
        age: 0,
        duration: 4.2,
        r: 44,
        damage: 8
      });
    }

    function startBossDash(boss, dx, dy, distance) {
      boss.dashCharge = 1.1;
      boss.dashDuration = 0;
      boss.dashVx = dx / distance;
      boss.dashVy = dy / distance;
      boss.dashTrailClock = 0;
      boss.dashHit = false;
      boss.dashCooldown = 7.5;
      promptEl.innerHTML = "<strong>野牛星汽车人</strong> 蓄力冲刺。";
      playCombatCue("bossCharge", boss.x, boss.y, 1.1);
    }

    function updateBoss(boss, dt) {
      if (!boss.active || boss.dead) return;
      if (catExecutionState?.target === boss || (boss.stunLeft || 0) > 0) {
        boss.dashCharge = 0;
        boss.dashDuration = 0;
        boss.laserCooldown = Math.max(boss.laserCooldown || 0, 0.35);
        boss.meleeCooldown = Math.max(boss.meleeCooldown || 0, 0.35);
        return;
      }
      if (boss.frozen) {
        boss.dashCharge = 0;
        boss.dashDuration = 0;
        return;
      }
      boss.aggro = 999;
      boss.laserCooldown = Math.max(0, boss.laserCooldown - dt);
      boss.meleeCooldown = Math.max(0, boss.meleeCooldown - dt);
      boss.dashCooldown = Math.max(0, boss.dashCooldown - dt);
      const playerTrackable = !nightStealthActive();

      if (!boss.summoned && boss.hp <= boss.maxHp / 2) {
        boss.summoned = true;
        boss.phase = 2;
        boss.speed = 146;
        boss.laserCooldown = Math.min(boss.laserCooldown, 0.3);
        spawnBossMinions(boss);
      }

      if (boss.dashCharge > 0) {
        boss.dashCharge -= dt;
        if (boss.dashCharge <= 0) {
          boss.dashDuration = 0.72;
          leaveWheelTrack(boss);
          promptEl.innerHTML = "<strong>野牛星汽车人</strong> 冲刺。";
          playCombatCue("hitHeavy", boss.x, boss.y, 1.1);
          shakeScreen(0.8, 0.18);
        }
        return;
      }

      if (boss.dashDuration > 0) {
        const step = 610 * dt;
        const nextX = boss.x + boss.dashVx * step;
        const nextY = boss.y + boss.dashVy * step;
        boss.dashDuration -= dt;
        boss.dashTrailClock -= dt;
        if (boss.dashTrailClock <= 0) {
          boss.dashTrailClock = 0.1;
          leaveWheelTrack(boss);
        }
        if (canStandAt(nextX, nextY)) {
          boss.x = nextX;
          boss.y = nextY;
        } else {
          boss.dashDuration = 0;
        }
        if ((heroSkillHaloActive() && Math.hypot(player.x - boss.x, player.y - boss.y) <= heroSkillHaloContactRadius(boss)) ||
          catExecutionBlocksMelee(boss)) {
          boss.dashDuration = 0;
        } else if (nightAfterimage && Math.hypot(nightAfterimage.x - boss.x, nightAfterimage.y - boss.y) <= nightAfterimage.r + boss.r + 18) {
          boss.dashDuration = 0;
          damageNightAfterimage(28, "野牛星汽车人冲刺");
        } else if (!boss.dashHit && Math.hypot(player.x - boss.x, player.y - boss.y) <= player.radius + boss.r + 18) {
          boss.dashHit = true;
          damagePlayer(28, "野牛星汽车人冲刺");
        }
        return;
      }

      const dx = player.x - boss.x;
      const dy = player.y - boss.y;
      const distance = Math.hypot(dx, dy) || 1;
      const nightThreat = nightAfterimageThreatFor(boss, nightAfterimageTauntRadius);
      const threatTarget = nightThreat || player;
      const threatRadius = nightThreat ? nightThreat.r : player.radius;
      const threatDx = threatTarget.x - boss.x;
      const threatDy = threatTarget.y - boss.y;
      const threatDistance = Math.hypot(threatDx, threatDy) || 1;
      if (!playerTrackable && !nightThreat) {
        boss.dashCharge = 0;
        return;
      }
      if (boss.dashCooldown <= 0 && threatDistance >= 170 && threatDistance <= 680) {
        startBossDash(boss, threatDx, threatDy, threatDistance);
        return;
      }
      const blockedByHeroHalo = heroSkillHaloActive() && distance <= heroSkillHaloContactRadius(boss);
      const blockedByCatExecution = catExecutionBlocksMelee(boss);
      if (!blockedByHeroHalo && !blockedByCatExecution && threatDistance <= boss.r + threatRadius + 42 && boss.meleeCooldown <= 0) {
        boss.meleeCooldown = boss.phase === 2 ? 0.75 : 0.95;
        scheduleMeleeWarning(boss, threatTarget, {
          kind: "bossMelee",
          label: "斧",
          hitRange: boss.r + threatRadius + 46,
          duration: boss.phase === 2 ? 0.3 : 0.38,
          damage: boss.phase === 2 ? 23 : 20,
          sourceName: "野牛星汽车人重斧",
          color: "rgba(255, 220, 135, 0.92)",
          intensity: 1.15,
          shake: 0.85
        });
        return;
      }
      if (threatDistance <= 690 && boss.laserCooldown <= 0) {
        boss.laserCooldown = boss.phase === 2 ? 0.9 : 1.25;
        scheduleShotWarning(boss, threatTarget, {
          kind: "laser",
          sound: "laserWindup",
          range: 760,
          width: 24,
          duration: boss.phase === 2 ? 0.34 : 0.42,
          color: "rgba(255, 118, 118, 0.84)",
          intensity: 1.05,
          fire: fireBossLaser
        });
      }

      const desiredDistance = blockedByCatExecution || threatDistance < 245 ? -1 : 1;
      const step = Math.min(threatDistance, boss.speed * iceSlowMultiplier(boss) * hathorFieldEnemySlowMultiplier(boss) * dt);
      const nextX = boss.x + (threatDx / threatDistance) * step * desiredDistance;
      const nextY = boss.y + (threatDy / threatDistance) * step * desiredDistance;
      if (canStandAt(nextX, nextY)) {
        boss.x = nextX;
        boss.y = nextY;
      }
    }

    function updateWheelTracks(dt) {
      if (backpackModal.classList.contains("show")) return;
      for (let index = wheelTracks.length - 1; index >= 0; index -= 1) {
        const track = wheelTracks[index];
        track.age += dt;
        if (track.age >= track.duration) {
          wheelTracks.splice(index, 1);
          continue;
        }
        if (Math.hypot(player.x - track.x, player.y - track.y) <= player.radius + track.r) {
          damagePlayer(track.damage, "灼热车轮印");
        }
      }
    }

    function fireGuardianShot(npc, target = player) {
      const dx = target.x - npc.x;
      const dy = target.y - npc.y;
      const distance = Math.hypot(dx, dy) || 1;
      npcProjectiles.push({
        x: npc.x,
        y: npc.y,
        vx: dx / distance,
        vy: dy / distance,
        speed: 520,
        range: 660,
        distance: 0,
        r: 13,
        damage: npc.damage,
        kind: "guardian",
        source: npc.name
      });
    }

    function guardianBlinkTarget(npc) {
      const dx = player.x - npc.x;
      const dy = player.y - npc.y;
      const distance = Math.hypot(dx, dy) || 1;
      const ux = dx / distance;
      const uy = dy / distance;
      const bases = [
        Math.atan2(uy, ux) + Math.PI,
        Math.atan2(uy, ux) + Math.PI * 0.62,
        Math.atan2(uy, ux) - Math.PI * 0.62,
        Math.random() * Math.PI * 2
      ];
      for (let attempt = 0; attempt < 36; attempt += 1) {
        const base = bases[attempt % bases.length];
        const angle = base + (Math.random() - 0.5) * 0.86;
        const radius = 154 + Math.random() * 86;
        const target = {
          x: player.x + Math.cos(angle) * radius,
          y: player.y + Math.sin(angle) * radius
        };
        const playerGap = Math.hypot(target.x - player.x, target.y - player.y);
        if (playerGap >= 145 && canStandAt(target.x, target.y)) return target;
      }
      return null;
    }

    function guardianBlink(npc) {
      if (npc.guardianBlinkPreview) return false;
      const target = guardianBlinkTarget(npc);
      if (!target) return false;
      hitBursts.push({ x: npc.x, y: npc.y, age: 0, label: "瞬步" });
      playCombatCue("guardian", npc.x, npc.y, 0.8);
      npc.guardianBlinkPreview = {
        x: target.x,
        y: target.y,
        age: 0,
        duration: 0.54
      };
      npc.target = { x: target.x, y: target.y };
      return true;
    }

    function updateGuardianBlinkPreview(npc, dt) {
      const preview = npc.guardianBlinkPreview;
      if (!preview) return false;
      preview.age += dt;
      if (preview.age < preview.duration) return true;
      if (canStandAt(preview.x, preview.y)) {
        npc.x = preview.x;
        npc.y = preview.y;
        npc.target = { x: player.x, y: player.y };
        npc.attackCooldown = Math.max(npc.attackCooldown || 0, 0.36);
        hitBursts.push({ x: npc.x, y: npc.y, age: 0, label: "瞬步" });
      }
      npc.guardianBlinkPreview = null;
      return true;
    }

    function updateGuardianNpc(npc, dt, playerDistance, dangerFactor) {
      npc.attackCooldown = Math.max(0, (npc.attackCooldown || 0) - dt);
      npc.guardianSkillCooldown = Math.max(0, (npc.guardianSkillCooldown || 0) - dt);
      npc.aggro = 999;
      if (updateGuardianBlinkPreview(npc, dt)) return;
      const nightThreat = nightAfterimageThreatFor(npc);
      const threatTarget = nightThreat || player;
      const threatRadius = nightThreat ? nightThreat.r : player.radius;
      const threatDistance = Math.hypot(threatTarget.x - npc.x, threatTarget.y - npc.y);
      const playerTrackable = !nightStealthActive();
      const home = npc.guardianHome || worldEvent.thing || { x: npc.x, y: npc.y };
      const nearHome = Math.hypot(npc.x - home.x, npc.y - home.y) <= 380;
      const engageRange = nearHome ? 720 : 460;
      const engaging = Boolean(nightThreat) || (playerTrackable && playerDistance <= engageRange);

      if (npc.guardianSkill === "pulse" && threatDistance <= 190 && npc.guardianSkillCooldown <= 0) {
        npc.guardianSkillCooldown = 2.35;
        scheduleMeleeWarning(npc, threatTarget, {
          kind: "guardianPulse",
          sound: "guardian",
          label: "结界",
          hitRange: 190,
          duration: 0.44,
          damage: npc.damage + 4,
          sourceName: `${npc.name}的结界脉冲`,
          color: "rgba(125, 191, 164, 0.9)",
          intensity: 0.9,
          shake: 0.45
        });
      }
      if (npc.guardianSkill === "blink" && engaging && threatDistance > 150 && threatDistance <= 560 && npc.guardianSkillCooldown <= 0) {
        if (guardianBlink(npc)) npc.guardianSkillCooldown = 3.2;
      }
      if (npc.guardianSkill === "lance" && engaging && threatDistance <= 640 && npc.guardianSkillCooldown <= 0) {
        npc.guardianSkillCooldown = 1.12;
        scheduleShotWarning(npc, threatTarget, {
          kind: "guardianShot",
          sound: "guardian",
          range: 660,
          width: 22,
          duration: 0.36,
          color: "rgba(125, 191, 164, 0.84)",
          intensity: 0.9,
          fire: fireGuardianShot
        });
      }

      if (engaging) {
        npc.target = { x: threatTarget.x, y: threatTarget.y };
      } else if (!npc.target || Math.hypot(npc.target.x - npc.x, npc.target.y - npc.y) < 18) {
        npc.target = { x: home.x + randomInt(-90, 90), y: home.y + randomInt(-90, 90) };
      }

      if (npc.attackType !== "ranged" && threatDistance <= npc.r + threatRadius + 16 && npc.attackCooldown <= 0) {
        npc.attackCooldown = 0.82;
        scheduleMeleeWarning(npc, threatTarget, {
          label: "击打",
          hitRange: npc.r + threatRadius + 18,
          duration: 0.28,
          damage: npc.damage,
          sourceName: npc.name,
          intensity: 0.72,
          shake: 0.38
        });
      }

      const dx = npc.target.x - npc.x;
      const dy = npc.target.y - npc.y;
      const distance = Math.hypot(dx, dy) || 1;
      const slowMultiplier = iceSlowMultiplier(npc) * hathorFieldEnemySlowMultiplier(npc);
      const step = Math.min(distance, npc.speed * (engaging ? 1.42 + dangerFactor * 0.35 : 1) * slowMultiplier * dt);
      const nextX = npc.x + (dx / distance) * step;
      const nextY = npc.y + (dy / distance) * step;
      if (canStandAt(nextX, nextY)) {
        npc.x = nextX;
        npc.y = nextY;
      } else {
        npc.target = home;
      }
    }

    function updateAiScavs(dt) {
      if (runEnded || backpackModal.classList.contains("show")) return;
      aiScavs.forEach((npc) => {
        if (npc.active === false) return;
        if (npc.isBoss) {
          updateBoss(npc, dt);
          return;
        }
        if (npc.dead) {
          npc.guardianBlinkPreview = null;
          return;
        }
        if (catExecutionState?.target === npc) {
          npc.guardianBlinkPreview = null;
          return;
        }
        pushNpcOutOfCatExecution(npc, dt);
        if (npc.frozen) {
          npc.guardianBlinkPreview = null;
          return;
        }
        npc.attackCooldown = Math.max(0, (npc.attackCooldown || 0) - dt);
        npc.aggro = Math.max(0, (npc.aggro || 0) - dt);
        const playerDistance = Math.hypot(player.x - npc.x, player.y - npc.y);
        const nightThreat = nightAfterimageThreatFor(npc);
        const threatTarget = nightThreat || player;
        const threatRadius = nightThreat ? nightThreat.r : player.radius;
        const threatDistance = Math.hypot(threatTarget.x - npc.x, threatTarget.y - npc.y);
        const playerTrackable = !nightStealthActive();
        const dangerFactor = danger / 120;
        if (npc.guardian) {
          updateGuardianNpc(npc, dt, playerDistance, dangerFactor);
          return;
        }
        const attractionRange = 240 + dangerFactor * 420;
        const attractionChance = (0.08 + dangerFactor * 0.42) * dt;
        const stealthBlocked = selectedCharacter === "cat" && catAttackAggroLeft <= 0 && npc.aggro <= 0;
        const attracted = nightThreat || (playerTrackable && playerDistance <= attractionRange && (npc.aggro > 0 || (!stealthBlocked && Math.random() < attractionChance)));
        const contestTarget = npc.eventTarget && Math.hypot(npc.eventTarget.x - npc.x, npc.eventTarget.y - npc.y) > 72
          ? npc.eventTarget
          : null;
        if (attracted) npc.aggro = 2.4 + dangerFactor * 2.2;
        if (!playerTrackable && !contestTarget && !nightThreat) npc.aggro = 0;
        if (npc.wait > 0) {
          npc.wait -= dt;
          if (npc.aggro <= 0 && !contestTarget) return;
        }
        if (npc.attackType === "ranged" && npc.aggro > 0 && threatDistance <= 520) {
          npc.target = { x: threatTarget.x, y: threatTarget.y };
          if (threatDistance <= 480 && npc.attackCooldown <= 0) {
            npc.attackCooldown = 1.55;
            scheduleShotWarning(npc, threatTarget, {
              kind: "ranged",
              sound: "rangedWindup",
              range: 520,
              width: 18,
              duration: 0.34,
              intensity: 0.75,
              fire: fireNpcShot
            });
          }
        } else if ((nightThreat || playerTrackable) && npc.aggro > 0) {
          npc.target = { x: threatTarget.x, y: threatTarget.y };
        } else if (contestTarget) {
          npc.target = contestTarget;
        } else if (!npc.target || Math.hypot(npc.target.x - npc.x, npc.target.y - npc.y) < 12) {
          npc.target = randomWalkPoint();
          npc.wait = Math.random() * 0.8;
          return;
        }

        const blockedByHeroHalo = heroSkillHaloActive() && playerDistance <= heroSkillHaloContactRadius(npc);
        const blockedByCatExecution = catExecutionBlocksMelee(npc);
        if (npc.attackType === "melee" && !blockedByHeroHalo && !blockedByCatExecution && threatDistance <= npc.r + threatRadius + 14 && npc.attackCooldown <= 0) {
          npc.attackCooldown = 1.05;
          scheduleMeleeWarning(npc, threatTarget, {
            label: "击打",
            hitRange: npc.r + threatRadius + 16,
            duration: 0.3,
            damage: npc.damage,
            sourceName: npc.name,
            intensity: 0.72,
            shake: 0.35
          });
        }

        const dx = npc.target.x - npc.x;
        const dy = npc.target.y - npc.y;
        const distance = Math.hypot(dx, dy) || 1;
        const wantsDistance = npc.attackType === "ranged" && npc.aggro > 0 && threatDistance < 230;
        const moveDirection = wantsDistance ? -1 : 1;
        const chaseBoost = npc.aggro > 0 ? 1 + dangerFactor * 0.9 : 1;
        const slowMultiplier = iceSlowMultiplier(npc) * hathorFieldEnemySlowMultiplier(npc);
        const step = Math.min(distance, npc.speed * chaseBoost * slowMultiplier * dt);
        const nextX = npc.x + (dx / distance) * step * moveDirection;
        const nextY = npc.y + (dy / distance) * step * moveDirection;
        if (canStandAt(nextX, nextY)) {
          npc.x = nextX;
          npc.y = nextY;
        } else {
          npc.target = randomWalkPoint();
        }
      });
    }

    function dangerDamageMultiplier() {
      return 1 + danger / 135;
    }

    function armorDamageReduction() {
      return Math.max(0, Math.min(0.9, Number(armorConfigs[armorTier]?.reduction || 0)));
    }

    function armorReductionText() {
      return `${Math.round(armorDamageReduction() * 100)}%`;
    }

    function effectiveDamage(baseDamage, options = {}) {
      const dangerMultiplier = options.ignoreDanger ? 1 : dangerDamageMultiplier();
      const heroGuardMultiplier = heroSkillHaloActive() ? 1 - heroSkillDamageReduction : 1;
      const hathorGuardMultiplier = hathorFieldDefenseMultiplier() * hathorFieldEnemyDamageMultiplier();
      return Math.max(1, Math.round(baseDamage * dangerMultiplier * (1 - armorDamageReduction()) * heroGuardMultiplier * hathorGuardMultiplier));
    }

    function damageNumberText(amount) {
      if (amount >= 10) return String(Math.round(amount));
      if (amount >= 1) return Number.isInteger(amount) ? String(amount) : amount.toFixed(1);
      return amount.toFixed(1);
    }

    function spawnDamageNumber(x, y, amount, target = "enemy") {
      if (!Number.isFinite(amount) || amount <= 0) return;
      damageNumbers.push({
        x: x + randomInt(-8, 8),
        y: y + randomInt(-8, 4),
        vx: randomInt(-8, 8),
        vy: -18 - Math.random() * 10,
        age: 0,
        duration: 0.78,
        text: `-${damageNumberText(amount)}`,
        target
      });
    }

    function damagePlayer(baseDamage, sourceName) {
      if (runEnded || player.hurtCooldown > 0) return;
      if (catExecutionState && selectedCharacter === "cat") return;
      if (tryBastetCounterBlock(sourceName)) return;
      let amount = effectiveDamage(baseDamage);
      amount = absorbWithPetShield(amount, sourceName);
      if (selectedCharacter === "hathor" && amount > 0) {
        markHathorCombat(sourceName);
        reduceSekhmetSunCooldown(amount);
        triggerHathorSekhmet();
      }
      if (selectedCharacter === "hathor" && hathorShield > 0 && amount > 0) {
        const blocked = Math.min(amount, hathorShield);
        hathorShield = Math.max(0, hathorShield - blocked);
        amount = Math.max(0, amount - blocked);
        hitBursts.push({ x: player.x, y: player.y, age: 0, label: "脉冲" });
      }
      if (amount <= 0) {
        player.hurtCooldown = 0.18;
        renderHud();
        return;
      }
      player.hp = clamp(player.hp - amount, 0, player.maxHp);
      player.hurtCooldown = 0.34;
      const hurtImpact = impactBurstOptions("rgba(229, 143, 112, 0.56)", 0.42, 0.92);
      spawnDamageNumber(player.x + player.radius + 14, player.y - 12, amount, "player");
      hitBursts.push({ x: player.x, y: player.y, age: 0, label: "受伤", ...hurtImpact });
      playCombatCue("hurt", player.x, player.y, hurtImpact.skinImpact ? 0.82 : 0.46);
      shakeScreen(hurtImpact.skinImpact ? 0.42 : 0.18, hurtImpact.skinImpact ? 0.14 : 0.07);
      promptEl.innerHTML = `<strong>${sourceName}</strong> 命中，-${amount}。`;
      renderHud();
      if (player.hp <= 0) {
        if (switchToAliveInvestigatorAfterDown()) return;
        if (pvpState.enabled) {
          finishPvpRound("opponent", `${sourceName}让你失去战斗能力。`);
          return;
        }
        failRun("你被人机逼到车灯里，生命耗尽。");
      }
    }

    function fireNpcShot(npc, target = player) {
      const dx = target.x - npc.x;
      const dy = target.y - npc.y;
      const distance = Math.hypot(dx, dy) || 1;
      npcProjectiles.push({
        x: npc.x,
        y: npc.y,
        vx: dx / distance,
        vy: dy / distance,
        speed: 410,
        range: 520,
        distance: 0,
        r: 11,
        damage: npc.damage,
        source: npc.name
      });
    }

    function heroHaloBlocksProjectile(shot) {
      return heroSkillHaloActive() &&
        Math.hypot(player.x - shot.x, player.y - shot.y) <= heroSkillHaloRadius + shot.r;
    }

    function updateNpcProjectiles(dt) {
      if (backpackModal.classList.contains("show")) return;
      for (let index = npcProjectiles.length - 1; index >= 0; index -= 1) {
        const shot = npcProjectiles[index];
        const step = shot.speed * dt;
        shot.x += shot.vx * step;
        shot.y += shot.vy * step;
        shot.distance += step;
        if (heroHaloBlocksProjectile(shot)) {
          npcProjectiles.splice(index, 1);
          hitBursts.push({ x: shot.x, y: shot.y, age: 0, label: shot.kind === "laser" ? "挡光" : "抵挡" });
          continue;
        }
        if (nightAfterimage && Math.hypot(nightAfterimage.x - shot.x, nightAfterimage.y - shot.y) <= nightAfterimage.r + shot.r) {
          npcProjectiles.splice(index, 1);
          damageNightAfterimage(shot.damage, shot.source);
          continue;
        }
        if (Math.hypot(player.x - shot.x, player.y - shot.y) <= player.radius + shot.r) {
          npcProjectiles.splice(index, 1);
          if (shot.freeze) addPlayerFreeze(shot.freeze, shot.source);
          damagePlayer(shot.damage, shot.source);
          continue;
        }
        if (shot.distance >= shot.range) {
          npcProjectiles.splice(index, 1);
        }
      }
    }

    function hasVictoryBirdEquipped() {
      const expectedVictoryBird = victoryBirdStorageIds[selectedCharacter] || "";
      return Boolean(expectedVictoryBird && ownedCosmetics.has(victoryBirdCosmeticIds[selectedCharacter]) && (
        parkingEntry.equippedVictoryBirds?.[selectedCharacter] === expectedVictoryBird ||
        (!parkingEntryHasVictoryBirdsFlag && savedVictoryBirds[selectedCharacter] === expectedVictoryBird)
      ));
    }

    function victoryBirdBroadcastLine() {
      if (!hasVictoryBirdEquipped()) return "";
      const characterLines = victoryBirdLines[selectedCharacter] || [];
      const lines = [...victoryBirdLines.shared, ...characterLines];
      return lines[Math.floor(Math.random() * lines.length)] || "";
    }

    function showVictoryBirdBroadcast(npc) {
      const text = victoryBirdBroadcastLine();
      if (!text) return "";
      victoryBroadcasts.push({
        x: npc.x,
        y: npc.y - (npc.r || 20) - 24,
        text,
        age: 0,
        duration: 2.6
      });
      if (victoryBroadcasts.length > 4) victoryBroadcasts.shift();
      hitBursts.push({ x: npc.x, y: npc.y, age: 0, label: "战绩播报", power: 0.32, color: "rgba(255, 226, 132, 0.62)" });
      return text;
    }

    function defeatNpc(npc, sourceName) {
      npc.dead = true;
      npc.target = null;
      npc.hp = 0;
      runDefeats += 1;
      if (!npc.isBoss) recordInvestigatorDefeat(selectedCharacter);
      hitBursts.push({ x: npc.x, y: npc.y, age: 0, label: sourceName });
      danger = Math.min(120, danger + (npc.isBoss ? 18 : 6));
      const broadcast = showVictoryBirdBroadcast(npc);
      promptEl.innerHTML = broadcast
        ? `<strong>战绩播报</strong> ${escapeHtml(broadcast)}`
        : npc.isBoss
          ? `<strong>${npc.name}</strong> 倒下。可搜残骸舱。`
          : npc.guardian
            ? `<strong>${npc.name}</strong> 倒下。可搜背包。`
          : `<strong>${npc.name}</strong> 倒下。可搜背包。`;
      updateNearbyThing();
      renderHud();
      checkSecondWaveTrigger();
    }

    function freezeMax(npc) {
      if (npc?.isPvpOpponent) return 78;
      return npc?.isBoss ? 220 : 100;
    }

    function frozenDurationFor(npc) {
      if (!npc) return 0;
      if (npc.isPvpOpponent) return 3.2;
      if (npc.isBoss) return 1.25;
      const strength = Number(npc.maxHp || npc.hp || 3) + Number(npc.damage || 0) / 8;
      if (npc.isBossMinion || strength >= 6) return 2.4;
      if (strength >= 4.5) return 3.1;
      return 4.2;
    }

    function addFreeze(npc, amount, sourceName = "冰冻") {
      if (!npc || npc.dead || npc.active === false || npc.frozen) return;
      npc.freeze = clamp((npc.freeze || 0) + amount, 0, freezeMax(npc));
      if (npc.freeze >= freezeMax(npc)) {
        npc.frozen = true;
        npc.frozenLeft = frozenDurationFor(npc);
        npc.aggro = 0;
        npc.target = null;
        npc.attackCooldown = 999;
        if (npc.isPvpOpponent) {
          pvpState.botAttackCooldown = Math.max(pvpState.botAttackCooldown || 0, npc.frozenLeft);
          pvpState.botSkillCooldown = Math.max(pvpState.botSkillCooldown || 0, npc.frozenLeft);
        }
        hitBursts.push({ x: npc.x, y: npc.y, age: 0, label: "冻结" });
        if (!searchState && !pendingLoot) {
          promptEl.innerHTML = `<strong>${npc.name}</strong> 冻住。`;
          renderHud();
        }
      }
    }

    function playerFreezeMax() {
      return 100;
    }

    function addPlayerFreeze(amount, sourceName = "冰冻") {
      if (runEnded || player.frozen) return;
      player.freeze = clamp((player.freeze || 0) + amount, 0, playerFreezeMax());
      if (player.freeze < playerFreezeMax()) return;
      player.frozen = true;
      player.frozenLeft = 2.2;
      hitBursts.push({ x: player.x, y: player.y, age: 0, label: "冻结", color: "rgba(215, 245, 255, 0.78)" });
      promptEl.innerHTML = `<strong>${sourceName}</strong> 冻住了你。`;
      renderHud();
    }

    function updatePlayerFrozenState(dt) {
      if (player.frozen) {
        player.frozenLeft = Math.max(0, (player.frozenLeft || 0) - dt);
        if (player.frozenLeft <= 0) {
          player.frozen = false;
          player.freeze = 0;
        }
        return;
      }
      player.freeze = Math.max(0, (player.freeze || 0) - dt * 18);
    }

    function playerIceSlowMultiplier() {
      if (player.frozen) return 0;
      return clamp(1 - clamp((player.freeze || 0) / playerFreezeMax(), 0, 1) * 0.48, 0.52, 1);
    }

    function updateFrozenStates(dt) {
      updatePlayerFrozenState(dt);
      aiScavs.forEach((npc) => {
        npc.stunLeft = Math.max(0, (npc.stunLeft || 0) - dt);
        if (!npc.frozen || npc.dead || npc.active === false) return;
        npc.frozenLeft = Math.max(0, (npc.frozenLeft || 0) - dt);
        if (npc.frozenLeft > 0) return;
        npc.frozen = false;
        npc.freeze = 0;
        npc.attackCooldown = 0;
        npc.freezeTick = 0;
        if (npc.isBoss) npc.aggro = 999;
      });
      if (pvpState.enabled) {
        pvpOpponent.stunLeft = Math.max(0, (pvpOpponent.stunLeft || 0) - dt);
        if (pvpOpponent.frozen && !pvpOpponent.dead && pvpOpponent.active !== false) {
          pvpOpponent.frozenLeft = Math.max(0, (pvpOpponent.frozenLeft || 0) - dt);
          if (pvpOpponent.frozenLeft <= 0) {
            pvpOpponent.frozen = false;
            pvpOpponent.freeze = 0;
            pvpOpponent.freezeTick = 0;
          }
        }
      }
    }

    function iceSlowMultiplier(npc) {
      if (npc?.frozen) return 0;
      const chillRatio = clamp((npc?.freeze || 0) / freezeMax(npc), 0, 1);
      return clamp(1 - chillRatio * 0.62, 0.38, 1);
    }

    function scaledCharacterDamage(amount, sourceName) {
      const baseAmount = Math.max(0, Number(amount || 0));
      return sourceName === "支援无人机" ? baseAmount : baseAmount * characterDamageMultiplier;
    }

    function frozenDamageMultiplier(npc) {
      return npc?.frozen ? 1.5 : 1;
    }

    function damageNpc(npc, amount, sourceName, quiet = false) {
      if (!npc || npc.dead || npc.active === false) return;
      if (npc.isPvpOpponent) {
        damagePvpOpponent(amount, sourceName, true, quiet);
        return;
      }
      const beforeHp = Number(npc.hp ?? 3);
      markHathorCombat(sourceName);
      let finalDamage = scaledCharacterDamage(amount, sourceName) * frozenDamageMultiplier(npc) * hathorFieldAttackMultiplier();
      const critical = hathorFieldActive() && sourceName !== "灼烧" && sourceName !== "赤砂领域" && Math.random() < hathorFieldCritChance();
      if (critical) finalDamage *= hathorFieldCritDamageMultiplier();
      const appliedDamage = Math.min(beforeHp, finalDamage);
      npc.hp = Math.max(0, beforeHp - finalDamage);
      if (npc.isBoss) npc.aggro = 999;
      const impact = quiet ? null : impactBurstOptions(
        npc.isBoss ? "rgba(215, 245, 255, 0.52)" : "rgba(230, 221, 200, 0.44)",
        npc.isBoss ? 0.52 : 0.26,
        npc.isBoss ? 1.18 : 0.86
      );
      npc.hitShakeLeft = npc.isBoss
        ? impact?.skinImpact ? 0.22 : 0.11
        : impact?.skinImpact ? 0.17 : 0.08;
      npc.hitShakePower = Math.max(Number(npc.hitShakePower || 0), npc.isBoss
        ? impact?.skinImpact ? 1.32 : 0.62
        : impact?.skinImpact ? 0.86 : 0.28);
      spawnDamageNumber(npc.x + npc.r + 10, npc.y - npc.r * 0.35, appliedDamage, npc.isBoss ? "boss" : "enemy");
      hitBursts.push({ x: npc.x, y: npc.y, age: 0, label: sourceName, ...(impact || { power: npc.isBoss ? 0.32 : 0.18, color: "rgba(230, 221, 200, 0.34)", skinImpact: false }) });
      if (critical) hitBursts.push({ x: npc.x, y: npc.y - npc.r - 10, age: 0, label: "暴击", power: 0.58, color: "rgba(255, 226, 132, 0.74)" });
      playCombatCue(npc.isBoss ? "hitHeavy" : "hit", npc.x, npc.y, npc.isBoss
        ? impact?.skinImpact ? 0.82 : 0.34
        : impact?.skinImpact ? 0.58 : 0.22);
      shakeScreen(npc.isBoss
        ? impact?.skinImpact ? 0.34 : 0.1
        : impact?.skinImpact ? 0.18 : 0.025,
        impact?.skinImpact ? 0.1 : 0.04);
      if (npc.hp <= 0) {
        defeatNpc(npc, sourceName);
      } else if (npc.isBoss && npc.hp <= npc.maxHp / 2 && !npc.summoned) {
        promptEl.innerHTML = `<strong>${npc.name}</strong> 进入二阶段。`;
        renderHud();
      } else if (!quiet && !searchState && !pendingLoot) {
        promptEl.innerHTML = `<strong>${npc.name}</strong> 受击。`;
        renderHud();
      }
    }

    function nightBloodActive() {
      return selectedCharacter === "night" && nightBloodModeLeft > 0;
    }

    function nightHpRatio() {
      return player.maxHp > 0 ? clamp(player.hp / player.maxHp, 0, 1) : 1;
    }

    function nightBloodReflectionActive() {
      return selectedCharacter === "night" && nightHpRatio() < 0.5;
    }

    function nightMirrorShardDamageMultiplier() {
      return nightBloodReflectionActive() ? 1.7 : 1;
    }

    function nightBodyBackShardDamageMultiplier() {
      return selectedCharacter === "night" && nightHpRatio() < 0.25 ? 1.9 : 1;
    }

    function nightStealthActive() {
      return selectedCharacter === "night" && Boolean(nightAfterimage);
    }

    function hathorSekhmetActive() {
      return selectedCharacter === "hathor" && hathorSekhmetLeft > 0;
    }

    function hathorTransformActive() {
      return selectedCharacter === "hathor" && hathorTransformLeft > 0;
    }

    function hathorReturnActive() {
      return selectedCharacter === "hathor" && hathorReturnLeft > 0;
    }

    function hathorFieldActive() {
      return hathorBellFieldLeft > 0;
    }

    function hathorFieldTouches(x, y, radius = 0) {
      return hathorFieldActive() && Math.hypot(x - player.x, y - player.y) <= 230 + radius;
    }

    function hathorFieldSpeedMultiplier() {
      return hathorFieldActive() ? 1.18 : 1;
    }

    function hathorFieldEnemySlowMultiplier(npc) {
      return hathorFieldTouches(npc.x, npc.y, npc.r || 0) ? 0.58 : 1;
    }

    function hathorFieldDefenseMultiplier() {
      return hathorFieldActive() ? 0.84 : 1;
    }

    function hathorFieldEnemyDamageMultiplier() {
      return hathorFieldActive() ? 0.82 : 1;
    }

    function hathorFieldAttackMultiplier() {
      return hathorFieldActive() ? 1.22 : 1;
    }

    function hathorFieldCritChance() {
      return hathorFieldActive() ? 0.18 : 0;
    }

    function hathorFieldCritDamageMultiplier() {
      return hathorFieldActive() ? 1.55 : 1;
    }

    function markHathorCombat(sourceName = "") {
      if (selectedCharacter !== "hathor") return;
      if (["灼烧", "赤砂领域", "赤砂声波", "声波"].includes(sourceName)) return;
      hathorQuietTime = 0;
    }

    function extendHathorFieldAfterChange() {
      if (hathorBellFieldLeft > 0) hathorBellFieldLeft = Math.max(hathorBellFieldLeft, hathorBellPersistSeconds);
    }

    function reduceSekhmetSunCooldown(amount = 0) {
      const reduction = clamp(2 + Number(amount || 0) * 0.08, 2, 4.5);
      sekhmetBurstCooldownLeft = Math.max(0, sekhmetBurstCooldownLeft - reduction);
      if (selectedCharacter === "hathor") {
        hitBursts.push({ x: player.x, y: player.y, age: 0, label: "日轮", power: 0.44, color: "rgba(229, 88, 62, 0.64)" });
      }
    }

    function hathorFormInfo(characterId = selectedCharacter) {
      const sekhmet = characterId === selectedCharacter && hathorSekhmetActive();
      return {
        active: sekhmet,
        name: sekhmet ? "赤砂 · 赤砂祭司" : "烈阳 · 双模支援",
        symbol: sekhmet ? "塞" : "哈",
        iconColor: sekhmet ? "#e5583e" : "#f1cf7a",
        iconGlow: sekhmet ? "rgba(229, 88, 62, 0.82)" : "rgba(241, 207, 122, 0.62)"
      };
    }

    function characterDisplayInfo(characterId = selectedCharacter) {
      const base = characterDefs[characterId] || characterDefs.hero;
      if (characterId !== "hathor") return base;
      return { ...base, ...hathorFormInfo(characterId) };
    }

    function hathorSkillForCurrentForm(skill) {
      const sekhmet = hathorSekhmetActive();
      const accentColor = sekhmet ? "#e5583e" : "#f1cf7a";
      const activeIcon = sekhmet ? "bloodmirror" : "orbs";
      if (skill.id === "hathor-mask") {
        return { ...skill, name: sekhmet ? "赤砂形态" : "烈阳形态", short: sekhmet ? "塞" : "哈", icon: activeIcon, accentColor };
      }
      if (skill.id === "hathor-bell") {
        return {
          ...skill,
          name: sekhmet ? "赤砂声波" : "压制声波",
          short: sekhmet ? "赤铃" : "声波",
          icon: activeIcon,
          accentColor,
          cooldownLeft: () => hathorBellFieldLeft > 0 ? hathorBellFieldLeft : (sekhmet ? sekhmetBellCooldownLeft : hathorBellCooldownLeft)
        };
      }
      if (skill.id === "hathor-cup") {
        return {
          ...skill,
          name: sekhmet ? "烈阳轰击" : "补给脉冲",
          short: sekhmet ? "日轮" : "脉冲",
          icon: activeIcon,
          accentColor,
          cooldownLeft: () => sekhmet ? sekhmetBurstCooldownLeft : hathorBurstCooldownLeft
        };
      }
      return skill;
    }

    function triggerHathorSekhmet() {
      if (selectedCharacter !== "hathor" || hathorSekhmetLeft > 0 || hathorTransformLeft > 0) return;
      extendHathorFieldAfterChange();
      hathorTransformLeft = hathorTransformSeconds;
      hathorReturnLeft = 0;
      hathorStillTime = 0;
      hathorQuietTime = 0;
      hitBursts.push({ x: player.x, y: player.y, age: 0, label: "翻面", ...impactBurstOptions("rgba(229, 88, 62, 0.62)", 0.72, 1.1) });
      hathorEffects.push({ type: "form", x: player.x, y: player.y, age: 0, duration: hathorTransformSeconds, radius: 250 });
      shakeScreen(0.45, 0.14);
      promptEl.innerHTML = `<strong>烈阳</strong> 赤日双冕开始翻面。`;
      renderHud();
    }

    function completeHathorSekhmetTransform() {
      if (selectedCharacter !== "hathor") return;
      hathorSekhmetLeft = hathorSekhmetSeconds;
      hathorRage = 0;
      hathorTransformLeft = 0;
      hitBursts.push({ x: player.x, y: player.y, age: 0, label: "赤砂", ...impactBurstOptions("rgba(229, 88, 62, 0.72)", 0.76, 1.16) });
      promptEl.innerHTML = `<strong>赤砂</strong> 赤日双冕翻面。`;
      renderHud();
    }

    function startHathorReturn() {
      if (selectedCharacter !== "hathor" || hathorReturnLeft > 0 || hathorSekhmetLeft <= 0) return;
      extendHathorFieldAfterChange();
      hathorReturnLeft = hathorReturnSeconds;
      hathorEffects.push({ type: "pomegranate", x: player.x, y: player.y, age: 0, duration: hathorReturnSeconds, radius: 170 });
      hitBursts.push({ x: player.x, y: player.y, age: 0, label: "石榴", power: 0.38, color: "rgba(166, 54, 62, 0.62)" });
      renderHud();
    }

    function completeHathorReturn() {
      if (selectedCharacter !== "hathor") return;
      hathorSekhmetLeft = 0;
      hathorReturnLeft = 0;
      hathorStillTime = 0;
      hathorQuietTime = 0;
      hitBursts.push({ x: player.x, y: player.y, age: 0, label: "烈阳", power: 0.42, color: "rgba(241, 207, 122, 0.64)" });
      promptEl.innerHTML = `<strong>烈阳</strong> 脉冲能量回流。`;
      renderHud();
    }

    function hathorHealAmount() {
      return hathorSekhmetActive() ? 0 : Math.max(10, Math.round(player.maxHp * 0.18));
    }

    function canUseHathorSkills() {
      return selectedCharacter === "hathor" && !runEnded && !searchState && !pendingLoot && !backpackModal.classList.contains("show");
    }

    function castHathorBellField() {
      if (!canUseHathorSkills()) return;
      const sekhmet = hathorSekhmetActive();
      const cooldownLeft = sekhmet ? sekhmetBellCooldownLeft : hathorBellCooldownLeft;
      if (cooldownLeft > 0) {
        promptEl.innerHTML = `<strong>${sekhmet ? "赤砂" : "烈阳"}</strong> 冷却 ${Math.ceil(cooldownLeft)} 秒。`;
        renderHud();
        return;
      }
      hathorBellFieldLeft = hathorBellFieldSeconds;
      hathorBellFieldKind = sekhmet ? "sekhmet" : "hathor";
      if (sekhmet) sekhmetBellCooldownLeft = hathorBellCooldownSeconds;
      else hathorBellCooldownLeft = hathorBellCooldownSeconds;
      if (!sekhmet) {
        const heal = Math.min(player.maxHp - player.hp, Math.round(player.maxHp * 0.12));
        if (heal > 0) player.hp = clamp(player.hp + heal, 0, player.maxHp);
      }
      if (sekhmet) applySekhmetBurnToNearby(player.x, player.y, 230, nightBurnDurationSeconds + 2);
      else addFreezeToNearbyEnemies(player.x, player.y, 220, 16);
      hathorEffects.push({ type: sekhmet ? "red-bell" : "bell", x: player.x, y: player.y, age: 0, duration: 1.05, radius: 230 });
      hitBursts.push({ x: player.x, y: player.y, age: 0, label: sekhmet ? "赤砂" : "声波" });
      recordInvestigatorSkillUse("hathor");
      promptEl.innerHTML = sekhmet
        ? `<strong>赤砂</strong> 赤砂声波压住周围敌人。`
        : `<strong>烈阳</strong> 压制声波展开。`;
      renderHud();
    }

    function addFreezeToNearbyEnemies(x, y, radius, amount) {
      availableIceTargets().forEach((npc) => {
        if (Math.hypot(npc.x - x, npc.y - y) <= radius + (npc.r || 0)) addFreeze(npc, amount, "声波");
      });
    }

    function applySekhmetBurnToNearby(x, y, radius, duration = nightBurnDurationSeconds) {
      availableIceTargets().forEach((npc) => {
        if (Math.hypot(npc.x - x, npc.y - y) > radius + (npc.r || 0)) return;
        applyNightBurn(npc, duration);
        damageNpc(npc, npc.isBoss ? 8 : 12, "赤砂声波", true);
        hitBursts.push({ x: npc.x, y: npc.y, age: 0, label: "燃", power: 0.34, color: "rgba(229, 88, 62, 0.72)" });
      });
    }

    function castHathorBurst() {
      if (!canUseHathorSkills()) return;
      const sekhmet = hathorSekhmetActive();
      const cooldownLeft = sekhmet ? sekhmetBurstCooldownLeft : hathorBurstCooldownLeft;
      if (cooldownLeft > 0) {
        promptEl.innerHTML = `<strong>${sekhmet ? "赤砂" : "烈阳"}</strong> 冷却 ${Math.ceil(cooldownLeft)} 秒。`;
        renderHud();
        return;
      }

    function nightAfterimageThreatFor(npc, radius = nightAfterimageTauntRadius) {
      if (!nightAfterimage || !npc || npc.dead || npc.active === false) return null;
      return Math.hypot(nightAfterimage.x - npc.x, nightAfterimage.y - npc.y) <= radius ? nightAfterimage : null;
    }

    function reflectAcrossNightMirror(x, y) {
      if (!nightAfterimage) return { x, y };
      const axis = nightAfterimage.axisAngle ?? 0;
      const ax = Math.cos(axis);
      const ay = Math.sin(axis);
      const vx = x - nightAfterimage.x;
      const vy = y - nightAfterimage.y;
      const projection = vx * ax + vy * ay;
      return {
        x: nightAfterimage.x + 2 * projection * ax - vx,
        y: nightAfterimage.y + 2 * projection * ay - vy
      };
    }

    function reflectVectorAcrossNightMirror(vx, vy) {
      if (!nightAfterimage) return { x: vx, y: vy };
      const axis = nightAfterimage.axisAngle ?? 0;
      const ax = Math.cos(axis);
      const ay = Math.sin(axis);
      const projection = vx * ax + vy * ay;
      return {
        x: 2 * projection * ax - vx,
        y: 2 * projection * ay - vy
      };
    }

    function nightMirrorClonePose() {
      if (!nightAfterimage) return null;
      const point = reflectAcrossNightMirror(player.x, player.y);
      const facing = reflectVectorAcrossNightMirror(playerFacing.x, playerFacing.y);
      const length = Math.hypot(facing.x, facing.y) || 1;
      return {
        x: point.x,
        y: point.y,
        facingX: facing.x / length,
        facingY: facing.y / length
      };
    }

    function canUseNightSkills() {
      return selectedCharacter === "night" && !runEnded && !searchState && !pendingLoot && !backpackModal.classList.contains("show");

    function nightBloodCost() {

    function applyNightBurn(npc, duration = nightBurnDurationSeconds) {
      if (!npc || npc.dead || npc.active === false) return;
      npc.burnLeft = Math.max(npc.burnLeft || 0, duration);
      npc.burnTick = Math.min(npc.burnTick || 0, 0.45);
    }

    function updateNightBurns(dt) {
      availableIceTargets().forEach((npc) => {
        if (!npc.burnLeft || npc.dead || npc.active === false) return;
        npc.burnLeft = Math.max(0, npc.burnLeft - dt);
        npc.burnTick = (npc.burnTick || 0) + dt;
        if (npc.burnTick < 0.5) return;
        const ticks = Math.floor(npc.burnTick / 0.5);
        npc.burnTick -= ticks * 0.5;
        const bossMultiplier = npc.isBoss ? 0.58 : 1;
        damageNpc(npc, nightBurnDamagePerSecond * 0.5 * ticks * bossMultiplier, "灼烧", true);

    function registerNightMirrorShardHit(npc, shard) {
      if (!npc || !shard?.comboId || !nightAfterimage) return;

      if (shard.mirror) combo.mirror = true;
      else combo.night = true;
      npc.nightMirrorCombos[shard.comboId] = combo;
      if (combo.triggered || !combo.night || !combo.mirror) return;
      combo.triggered = true;

      player.hp = clamp(player.hp + heal, 0, player.maxHp);

    function damageNightAfterimage(amount, sourceName) {

    function pushEnemyFromNightExplosion(npc, cx, cy, force) {
      const dx = npc.x - cx;
      const dy = npc.y - cy;
      const distance = Math.hypot(dx, dy) || 1;
      const ux = dx / distance;
      const uy = dy / distance;
      let nextX = npc.x;
      let nextY = npc.y;
      for (let step = force; step > 0; step -= 18) {
        const probeX = npc.x + ux * step;
        const probeY = npc.y + uy * step;
        if (canStandAt(probeX, probeY)) {
          nextX = probeX;
          nextY = probeY;
          break;
        }
      }
      npc.x = nextX;
      npc.y = nextY;

        damageNpc(npc, (npc.isBoss ? 8 : 13) * falloff, "镜面爆燃");

        pushEnemyFromNightExplosion(npc, boom.x, boom.y, npc.isBoss ? 80 : 220);

    function updateNightShards(dt) {
      nightShardCooldownLeft = Math.max(0, nightShardCooldownLeft - dt);

      nightBloodModeCooldownLeft = Math.max(0, nightBloodModeCooldownLeft - dt);
      if (backpackModal.classList.contains("show")) return;
      for (let index = nightShardProjectiles.length - 1; index >= 0; index -= 1) {
        const shard = nightShardProjectiles[index];
        if (shard.homing) {
          if (!shard.target || shard.target.dead || shard.target.active === false || shard.hitIds.has(shard.target.id)) {
            shard.target = nearestIceTarget(shard.x, shard.y, shard.hitIds, shard.seekRange);
          }
          if (shard.target) {
            const tx = shard.target.x - shard.x;
            const ty = shard.target.y - shard.y;
            const td = Math.hypot(tx, ty) || 1;
            const turn = Math.min(1, shard.turnRate * dt);
            shard.vx = shard.vx * (1 - turn) + (tx / td) * turn;
            shard.vy = shard.vy * (1 - turn) + (ty / td) * turn;
            const nd = Math.hypot(shard.vx, shard.vy) || 1;
            shard.vx /= nd;
            shard.vy /= nd;
          }
        }
        const step = shard.speed * dt;
        shard.x += shard.vx * step;
        shard.y += shard.vy * step;
        shard.distance += step;
        availableIceTargets(shard.hitIds).forEach((npc) => {
          if (Math.hypot(npc.x - shard.x, npc.y - shard.y) > (npc.r || npc.radius || 18) + shard.r) return;

          damageNpc(npc, shard.damage, shard.empowered ? "血棱碎片" : "镜片碎击");
          if (shard.empowered) applyNightBurn(npc);
          registerNightMirrorShardHit(npc, shard);
          if (!shard.pierce) shard.dead = true;

        if (shard.dead || shard.distance >= shard.range || !canStandAt(shard.x, shard.y)) {
          nightShardProjectiles.splice(index, 1);
        }
      }
    }

    function dashPlayerToward(target, maxDistance = 320) {

      const uy = dy / distance;
      let finalX = player.x;
      let finalY = player.y;
      const dashDistance = Math.min(maxDistance, Math.max(160, distance));
      for (let step = 24; step <= dashDistance; step += 24) {
        const probeX = player.x + ux * step;
        const probeY = player.y + uy * step;
        if (!canStandAt(probeX, probeY)) break;
        finalX = probeX;

    function updateBastetState(dt) {
      bastetStepCooldownLeft = Math.max(0, bastetStepCooldownLeft - dt);
      bastetCounterCooldownLeft = Math.max(0, bastetCounterCooldownLeft - dt);
      bastetCounterLeft = Math.max(0, bastetCounterLeft - dt);
      if (bastetCounterLeft <= 0) bastetCounterCharges = 0;
      if (bastetMoonShadow) {
        bastetMoonShadow.age += dt;
        if (bastetMoonShadow.age >= bastetMoonShadow.duration) {
          bastetMoonShadow = null;
          bastetStepCooldownLeft = Math.max(bastetStepCooldownLeft, bastetStepCooldownSeconds * 0.6);
        }
      }
      for (let index = bastetMoonBlades.length - 1; index >= 0; index -= 1) {
        const blade = bastetMoonBlades[index];
        blade.age += dt;
        blade.trail.push({ x: blade.x, y: blade.y, age: 0 });
        blade.trail.forEach((point) => { point.age += dt; });
        blade.trail = blade.trail.filter((point) => point.age < 0.28).slice(-9);
        if (!blade.pierced && blade.target && !blade.target.dead && blade.target.active !== false && !blade.hitIds.has(blade.target.id)) {
          const dx = blade.target.x - blade.x;
          const dy = blade.target.y - blade.y;
          const distance = Math.hypot(dx, dy) || 1;
          const turn = Math.min(1, 5.8 * dt);
          blade.vx = blade.vx * (1 - turn) + (dx / distance) * turn;
          blade.vy = blade.vy * (1 - turn) + (dy / distance) * turn;
          const length = Math.hypot(blade.vx, blade.vy) || 1;
          blade.vx /= length;
          blade.vy /= length;

        const step = blade.speed * dt;
        blade.x += blade.vx * step;
        blade.y += blade.vy * step;

    function heroOrbPositions() {
      const innerAngle = skillTime * heroInnerOrbSpeed;
      const outerAngle = -skillTime * heroOuterOrbSpeed;
      const focusAlpha = smoothStep(heroOrbFocusProgress);
      const innerOrbitRadius = heroSkillHaloActive() ? heroSkillHaloRadius : heroInnerOrbOrbitRadius;
      const positions = [0, Math.PI].map((offset, coreIndex) => ({
          ring: "inner",
          coreIndex,
          alpha: 1,
          x: player.x + Math.cos(innerAngle + offset) * innerOrbitRadius,
          y: player.y + Math.sin(innerAngle + offset) * innerOrbitRadius
      }));
      if (focusAlpha > 0.01) {
        positions.push({
          ring: "inner",
          alpha: focusAlpha,
          x: player.x + Math.cos(innerAngle + Math.PI * 1.5) * innerOrbitRadius,
          y: player.y + Math.sin(innerAngle + Math.PI * 1.5) * innerOrbitRadius
        });
      }
      if (heroOuterOrbActiveLeft > 0) {
        positions.push(...[0, (Math.PI * 2) / 3, (Math.PI * 4) / 3].map((offset) => ({
          ring: "outer",
          alpha: 1,
          x: player.x + Math.cos(outerAngle + offset) * heroOuterOrbOrbitRadius,
          y: player.y + Math.sin(outerAngle + offset) * heroOuterOrbOrbitRadius
        })));
      }
      return positions;

    function heroOrbSpinMultiplier(movingIntent = false) {
      if (selectedCharacter !== "hero" || runEnded) return 1;
      if (searchState) return heroOrbSearchSpinMultiplier;
      if (heroOrbFocusProgress > 0) {
        return 1 + (heroOrbIdleSpinMultiplier - 1) * smoothStep(heroOrbFocusProgress);
