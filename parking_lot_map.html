    function finishPvpRound(winner, reason = "") {
      if (!pvpState.enabled || !pvpState.roundActive || runEnded) return;
      pvpState.roundActive = false;
      keys.clear();
      if (winner === "player") pvpState.playerWins += 1;
      if (winner === "opponent") pvpState.opponentWins += 1;
      const playerWonMatch = pvpState.playerWins >= 2;
      const opponentWonMatch = pvpState.opponentWins >= 2;
      promptEl.innerHTML = winner === "player"
        ? `<strong>本局胜利</strong>：${reason || "对方倒下了。"}`
        : `<strong>本局失败</strong>：${reason || "你被击倒了。"}`;
      searchTitleEl.textContent = `模拟训练 ${pvpState.playerWins} : ${pvpState.opponentWins}`;
      searchHintEl.textContent = playerWonMatch || opponentWonMatch ? "三局对决结束。" : "短暂整备后进入下一局。";
      renderHud();
      if (playerWonMatch || opponentWonMatch || pvpState.round >= 3) {
        window.setTimeout(() => finishPvpMatch(pvpState.playerWins > pvpState.opponentWins), 900);
        return;
      }
      pvpState.round += 1;
      pvpState.nextRoundAt = performance.now() + 1600;
    }

    function applyPvpDamageToPlayer(amount, sourceName) {
      if (!pvpState.enabled || !pvpState.roundActive || runEnded) return;
      if (catExecutionState && selectedCharacter === "cat") return;
      let finalAmount = effectiveDamage(amount, { ignoreDanger: true });
      finalAmount = absorbWithPetShield(finalAmount, sourceName);
      if (finalAmount <= 0) {
        player.hurtCooldown = 0.18;
        renderHud();
        return;
      }
      player.hp = clamp(player.hp - finalAmount, 0, player.maxHp);
      player.hurtCooldown = 0.34;
      const hurtImpact = impactBurstOptions("rgba(229, 143, 112, 0.5)", 0.34, 0.82);
      spawnDamageNumber(player.x + player.radius + 14, player.y - 12, finalAmount, "player");
      hitBursts.push({ x: player.x, y: player.y, age: 0, label: "受伤", ...hurtImpact });
      playCombatCue("hurt", player.x, player.y, hurtImpact.skinImpact ? 0.72 : 0.36);
      shakeScreen(hurtImpact.skinImpact ? 0.32 : 0.12, hurtImpact.skinImpact ? 0.1 : 0.05);
      promptEl.innerHTML = `<strong>${sourceName}</strong> 命中，-${finalAmount}。`;
      renderHud();
      if (player.hp <= 0) {
        if (switchToAliveInvestigatorAfterDown()) return;
        finishPvpRound("opponent", "你被对方击倒。");
      }
    }

    function queuePvpHit(amount, round = pvpState.round) {
      if (!pvpState.online || !Number.isFinite(amount) || amount <= 0) return;
      const current = pvpState.pendingHit;
      if (current?.type === "hit" && Number(current.round) === Number(round)) {
        current.amount = Number(current.amount || 0) + amount;
        return;
      }
      pvpState.pendingHit = { type: "hit", amount, round };
    }

    function damagePvpOpponent(amount, sourceName, sendOnline = true, quiet = false) {
      if (!pvpState.enabled || !pvpState.roundActive || runEnded) return;
      markHathorCombat(sourceName);
      let finalAmount = scaledCharacterDamage(amount, sourceName) * frozenDamageMultiplier(pvpOpponent) * hathorFieldAttackMultiplier();
      if (hathorFieldActive() && sourceName !== "灼烧" && sourceName !== "赤砂领域" && Math.random() < hathorFieldCritChance()) {
        finalAmount *= hathorFieldCritDamageMultiplier();
        hitBursts.push({ x: pvpOpponent.x, y: pvpOpponent.y - pvpOpponent.r - 10, age: 0, label: "暴击", power: 0.58, color: "rgba(255, 226, 132, 0.74)" });
      }
      finalAmount = Math.max(1, Math.round(finalAmount));
      const applied = Math.min(pvpOpponent.hp, finalAmount);
      pvpOpponent.hp = clamp(pvpOpponent.hp - finalAmount, 0, pvpOpponent.maxHp);
      const impact = quiet ? null : impactBurstOptions("rgba(230, 221, 200, 0.52)", 0.3, 0.92);
      pvpOpponent.hitShakeLeft = impact?.skinImpact ? 0.18 : 0.09;
      pvpOpponent.hitShakePower = Math.max(Number(pvpOpponent.hitShakePower || 0), impact?.skinImpact ? 1.02 : 0.38);
      spawnDamageNumber(pvpOpponent.x + pvpOpponent.radius + 12, pvpOpponent.y - 12, applied, "enemy");
      hitBursts.push({ x: pvpOpponent.x, y: pvpOpponent.y, age: 0, label: sourceName, ...(impact || { power: 0.24, color: "rgba(230, 221, 200, 0.4)", skinImpact: false }) });
      playCombatCue("hit", pvpOpponent.x, pvpOpponent.y, impact?.skinImpact ? 0.68 : 0.34);
      shakeScreen(impact?.skinImpact ? 0.2 : 0.04, impact?.skinImpact ? 0.08 : 0.04);
      if (sendOnline && pvpState.online) {
        queuePvpHit(finalAmount);
      }
      if (!quiet) {
        promptEl.innerHTML = `<strong>${pvpState.opponentName}</strong> 受击。`;
        renderHud();
      }
      if (pvpOpponent.hp <= 0) {
        pvpOpponent.dead = true;
        pvpOpponent.active = false;
        finishPvpRound("player", "对方干员被击倒。");
      }
    }

    function pvpStrikeOpponent() {
      if (!nearbyPvpTarget || !pvpState.roundActive || pvpState.strikeCooldown > 0) return;
      pvpState.strikeCooldown = 0.62;
      damagePvpOpponent(34, "近身重击");
    }

    function pvpBotStats() {
      const characterId = pvpOpponent.characterId || "hero";
      if (characterId === "cat") return { speed: 248, preferredRange: 82, cooldown: 0.9, damage: 18 };
      if (characterId === "egg") return { speed: 168, preferredRange: 430, cooldown: 1.45, damage: 12 };
      if (characterId === "night") return { speed: 205, preferredRange: 520, cooldown: 1.0, damage: 15 };
      return { speed: 188, preferredRange: 500, cooldown: 1.15, damage: 14 };
    }

    function firePvpBotShot(target, options = {}) {
      const dx = target.x - pvpOpponent.x;
      const dy = target.y - pvpOpponent.y;
      const distance = Math.hypot(dx, dy) || 1;
      npcProjectiles.push({
        x: pvpOpponent.x,
        y: pvpOpponent.y,
        vx: dx / distance,
        vy: dy / distance,
        speed: options.speed || 470,
        range: options.range || 720,
        distance: 0,
        r: options.r || 11,
        damage: options.damage || 12,
        source: options.source || pvpState.opponentName,
        kind: options.kind || "pvp-investigator"
      });
      playCombatCue(options.sound || "rangedWindup", pvpOpponent.x, pvpOpponent.y, 0.55);
    }

    function movePvpBotToward(target, distance, dt, speed) {
      const dx = target.x - pvpOpponent.x;
      const dy = target.y - pvpOpponent.y;
      const step = Math.min(distance, speed * iceSlowMultiplier(pvpOpponent) * hathorFieldEnemySlowMultiplier(pvpOpponent) * dt);
      const nextX = pvpOpponent.x + (dx / distance) * step;
      const nextY = pvpOpponent.y + (dy / distance) * step;
      if (canStandAt(nextX, pvpOpponent.y)) pvpOpponent.x = nextX;
      if (canStandAt(pvpOpponent.x, nextY)) pvpOpponent.y = nextY;
    }

    function pvpBotHeroOrbPositions() {
      const innerAngle = skillTime * heroInnerOrbSpeed * 1.05;
      const positions = [0, Math.PI].map((offset) => ({
        x: pvpOpponent.x + Math.cos(innerAngle + offset) * heroInnerOrbOrbitRadius,
        y: pvpOpponent.y + Math.sin(innerAngle + offset) * heroInnerOrbOrbitRadius,
        r: heroOrbDamageRadius,
        damage: 1.1,
        ring: "inner"
      }));
      if (pvpBotSkill.heroOuterLeft > 0) {
        const outerAngle = -skillTime * heroOuterOrbSpeed;
        positions.push(...[0, (Math.PI * 2) / 3, (Math.PI * 4) / 3].map((offset) => ({
          x: pvpOpponent.x + Math.cos(outerAngle + offset) * heroOuterOrbOrbitRadius,
          y: pvpOpponent.y + Math.sin(outerAngle + offset) * heroOuterOrbOrbitRadius,
          r: heroOrbDamageRadius + 4,
          damage: 2.2,
          ring: "outer"
        })));
      }
      return positions;
    }

    function updatePvpBotHeroSkill(dt) {
      pvpBotSkill.heroOuterLeft = Math.max(0, pvpBotSkill.heroOuterLeft - dt);
      pvpBotSkill.heroOuterCooldown = Math.max(0, pvpBotSkill.heroOuterCooldown - dt);
      pvpBotSkill.heroOrbHitCooldown = Math.max(0, pvpBotSkill.heroOrbHitCooldown - dt);
      const distance = Math.hypot(player.x - pvpOpponent.x, player.y - pvpOpponent.y);
      if (distance < 420 && pvpBotSkill.heroOuterCooldown <= 0) {
        pvpBotSkill.heroOuterLeft = 4.6;
        pvpBotSkill.heroOuterCooldown = 8.5;
        hitBursts.push({ x: pvpOpponent.x, y: pvpOpponent.y, age: 0, label: "光球", color: "rgba(255, 226, 132, 0.68)" });
      }
      if (pvpBotSkill.heroOrbHitCooldown > 0) return;
      const touched = pvpBotHeroOrbPositions().find((orb) =>
        Math.hypot(player.x - orb.x, player.y - orb.y) <= player.radius + orb.r
      );
      if (!touched) return;
      pvpBotSkill.heroOrbHitCooldown = touched.ring === "outer" ? 0.42 : 0.65;
      applyPvpDamageToPlayer(touched.damage, touched.ring === "outer" ? "外圈光球" : "内圈光球");
    }

    function updatePvpBotEggBeam(dt, target) {
      pvpBotSkill.eggBeamCooldown = Math.max(0, pvpBotSkill.eggBeamCooldown - dt);
      if (pvpBotSkill.eggBeamLeft <= 0) {
        const distance = Math.hypot(target.x - pvpOpponent.x, target.y - pvpOpponent.y);
        if (distance < eggBeam.range * 0.92 && pvpBotSkill.eggBeamCooldown <= 0) {
          pvpBotSkill.eggBeamLeft = 2.8;
          pvpBotSkill.eggBeamCooldown = 6.2;
          pvpBotSkill.eggBeamTick = 0;
          pvpBotSkill.eggBeamAngle = Math.atan2(target.y - pvpOpponent.y, target.x - pvpOpponent.x);
          hitBursts.push({ x: pvpOpponent.x, y: pvpOpponent.y, age: 0, label: "冷冻射束", color: "rgba(143, 215, 255, 0.74)" });
        }
        return;
      }
      pvpBotSkill.eggBeamLeft = Math.max(0, pvpBotSkill.eggBeamLeft - dt);
      const targetAngle = Math.atan2(target.y - pvpOpponent.y, target.x - pvpOpponent.x);
      const turnStep = eggBeam.turnSpeed * 0.72 * dt;
      pvpBotSkill.eggBeamAngle += clamp(angleDelta(targetAngle, pvpBotSkill.eggBeamAngle), -turnStep, turnStep);
      const ux = Math.cos(pvpBotSkill.eggBeamAngle);
      const uy = Math.sin(pvpBotSkill.eggBeamAngle);
      const endX = pvpOpponent.x + ux * eggBeam.range;
      const endY = pvpOpponent.y + uy * eggBeam.range;
      const along = (player.x - pvpOpponent.x) * ux + (player.y - pvpOpponent.y) * uy;
      const distanceToBeam = pointSegmentDistance(player.x, player.y, pvpOpponent.x, pvpOpponent.y, endX, endY);
      if (along < -player.radius || along > eggBeam.range + player.radius || distanceToBeam > player.radius + eggBeam.width / 2) return;
      pvpBotSkill.eggBeamTick += dt;
      addPlayerFreeze(eggBeam.freezePerSecond * dt, "冷冻射束");
      if (pvpBotSkill.eggBeamTick >= eggBeam.damageTick) {
        pvpBotSkill.eggBeamTick = 0;
        applyPvpDamageToPlayer(eggBeam.damage, "冷冻射束");
      }
    }

    function pvpBotNightMirrorPoint() {
      if (!pvpBotSkill.nightMirror) return null;
      return pvpBotSkill.nightMirror;
    }

    function firePvpBotNightShardFrom(x, y, target, mirror = false) {
      const dx = target.x - x;
      const dy = target.y - y;
      const distance = Math.hypot(dx, dy) || 1;
      npcProjectiles.push({
        x,
        y,
        vx: dx / distance,
        vy: dy / distance,
        speed: mirror ? 610 : 560,
        range: 820,
        distance: 0,
        r: 9,
        damage: mirror ? 11 : 15,
        source: mirror ? `${pvpState.opponentName}的回烬镜片` : `${pvpState.opponentName}的镜片碎击`,
        kind: "night-shard"
      });
    }

    function updatePvpBotNightSkill(dt, target) {
      pvpBotSkill.nightMirrorCooldown = Math.max(0, pvpBotSkill.nightMirrorCooldown - dt);
      pvpBotSkill.nightShardCooldown = Math.max(0, pvpBotSkill.nightShardCooldown - dt);
      if (pvpBotSkill.nightMirror) {
        pvpBotSkill.nightMirror.left = Math.max(0, pvpBotSkill.nightMirror.left - dt);
        if (pvpBotSkill.nightMirror.left <= 0) pvpBotSkill.nightMirror = null;
      }
      if (!pvpBotSkill.nightMirror && pvpBotSkill.nightMirrorCooldown <= 0 && Math.hypot(target.x - pvpOpponent.x, target.y - pvpOpponent.y) < 520) {
        pvpBotSkill.nightMirror = { x: pvpOpponent.x, y: pvpOpponent.y, r: 22, left: 5.2 };
        pvpBotSkill.nightMirrorCooldown = 8.8;
        const dx = pvpOpponent.x - target.x;
        const dy = pvpOpponent.y - target.y;
        const distance = Math.hypot(dx, dy) || 1;
        const dash = 210;
        const nextX = pvpOpponent.x + (dx / distance) * dash;
        const nextY = pvpOpponent.y + (dy / distance) * dash;
        if (canStandAt(nextX, nextY)) {
          pvpOpponent.x = nextX;
          pvpOpponent.y = nextY;
        }
        hitBursts.push({ x: pvpBotSkill.nightMirror.x, y: pvpBotSkill.nightMirror.y, age: 0, label: "镜面", color: "rgba(238, 243, 255, 0.68)" });
      }
      if (pvpBotSkill.nightShardCooldown > 0) return;
      pvpBotSkill.nightShardCooldown = 1.05;
      firePvpBotNightShardFrom(pvpOpponent.x, pvpOpponent.y, target, false);
      const mirror = pvpBotNightMirrorPoint();
      if (mirror) firePvpBotNightShardFrom(mirror.x, mirror.y, target, true);
    }

    function updatePvpBot(dt) {
      if (!pvpState.bot || !pvpState.roundActive || backpackModal.classList.contains("show")) return;
      if (catExecutionState?.target === pvpOpponent || (pvpOpponent.stunLeft || 0) > 0) return;
      pvpState.botAttackCooldown = Math.max(0, pvpState.botAttackCooldown - dt);
      pvpState.botSkillCooldown = Math.max(0, pvpState.botSkillCooldown - dt);
      const target = nightAfterimage || player;
      const targetRadius = nightAfterimage ? nightAfterimage.r : player.radius;
      const dx = target.x - pvpOpponent.x;
      const dy = target.y - pvpOpponent.y;
      const distance = Math.hypot(dx, dy) || 1;
      pvpOpponent.facingX = dx / distance;
      pvpOpponent.facingY = dy / distance;
      if (pvpOpponent.frozen) return;
      const characterId = pvpOpponent.characterId || "hero";
      const stats = pvpBotStats();
      if (characterId === "hero") updatePvpBotHeroSkill(dt);
      if (characterId === "egg") updatePvpBotEggBeam(dt, target);
      if (characterId === "night") updatePvpBotNightSkill(dt, target);
      if (characterId === "cat") {
        if (distance > targetRadius + pvpOpponent.radius + 42) {
          if (distance < 520 && pvpState.botSkillCooldown <= 0) {
            const landingDistance = targetRadius + pvpOpponent.radius + 32;
            const nextX = target.x - (dx / distance) * landingDistance;
            const nextY = target.y - (dy / distance) * landingDistance;
            if (canStandAt(nextX, nextY)) {
              pvpOpponent.x = nextX;
              pvpOpponent.y = nextY;
              hitBursts.push({ x: pvpOpponent.x, y: pvpOpponent.y, age: 0, label: "瞬移", power: 0.5, color: "rgba(222, 230, 240, 0.62)" });
              pvpState.botSkillCooldown = 2.4;
            }
          } else {
            movePvpBotToward(target, distance, dt, stats.speed);
          }
        } else if (pvpState.botAttackCooldown <= 0) {
          pvpState.botAttackCooldown = stats.cooldown;
          [0.18, 0.28, 0.38].forEach((duration, index) => {
            scheduleMeleeWarning(pvpOpponent, target, {
              label: index === 2 ? "大影刃" : "小影刃",
              hitRange: pvpOpponent.radius + targetRadius + 44 + index * 6,
              duration,
              damage: index === 2 ? 9 : 5,
              sourceName: `${pvpState.opponentName}的三重影刃`,
              color: index === 2 ? "rgba(255, 226, 132, 0.86)" : "rgba(222, 230, 240, 0.86)",
              intensity: index === 2 ? 0.92 : 0.72,
              shake: index === 2 ? 0.42 : 0.24
            });
          });
        }
        return;
      }

      if (characterId !== "hero" && characterId !== "egg" && characterId !== "night" && distance > stats.preferredRange) {
        movePvpBotToward(target, distance, dt, stats.speed);
        return;
      }

      if ((characterId === "hero" || characterId === "egg" || characterId === "night") && distance > stats.preferredRange + 120) {
        movePvpBotToward(target, distance, dt, stats.speed);
        return;
      }

      if (distance <= targetRadius + pvpOpponent.radius + 42 && pvpState.botAttackCooldown <= 0) {
        pvpState.botAttackCooldown = 1.05;
        scheduleMeleeWarning(pvpOpponent, target, {
          label: "重击",
          hitRange: pvpOpponent.radius + targetRadius + 40,
          duration: 0.3,
          damage: 16,
          sourceName: pvpState.opponentName,
          color: "rgba(229, 143, 112, 0.86)",
          intensity: 0.78,
          shake: 0.42
        });
      }
    }

    async function syncOnlinePvp() {
      if (!pvpState.online || pvpState.syncBusy || !pvpState.matchId) return;
      pvpState.syncBusy = true;
      const event = pvpState.pendingHit;
      pvpState.pendingHit = null;
      try {
        const response = await fetch(pvpStateApiPath, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "sync",
            matchId: pvpState.matchId,
            seat: pvpState.seat,
            state: {
              x: player.x,
              y: player.y,
              hp: player.hp,
              maxHp: player.maxHp,
              round: pvpState.round,
              playerWins: pvpState.playerWins,
              opponentWins: pvpState.opponentWins,
              roundActive: pvpState.roundActive,
              eventCursor: pvpState.eventCursor
            },
            event
          })
        });
        if (!response.ok) throw new Error("sync failed");
        const data = await response.json();
        if (data.opponent) {
          if (catExecutionState?.target !== pvpOpponent) {
            pvpOpponent.x = Number(data.opponent.x || pvpOpponent.x);
            pvpOpponent.y = Number(data.opponent.y || pvpOpponent.y);
          }
          const syncedOpponentHp = clamp(Number(data.opponent.hp ?? pvpOpponent.hp), 0, pvpOpponent.maxHp);
          pvpOpponent.hp = pvpState.roundActive ? Math.min(pvpOpponent.hp, syncedOpponentHp) : syncedOpponentHp;
          pvpOpponent.lastSeenAt = performance.now();
        }
        (data.events || []).forEach((item) => {
          if (!item?.eventId || pvpState.seenEvents.has(item.eventId)) return;
          pvpState.seenEvents.add(item.eventId);
          pvpState.eventCursor = Math.max(pvpState.eventCursor, Number(item.createdAt || 0));
          if (Number(item.round) === pvpState.round && item.type === "hit") {
            applyPvpDamageToPlayer(Number(item.amount || 0), pvpState.opponentName);
          }
        });
      } catch {
        if (event?.type === "hit") queuePvpHit(Number(event.amount || 0), Number(event.round || pvpState.round));
      } finally {
        pvpState.syncBusy = false;
      }
    }

    function updatePvp(dt) {
      if (!pvpState.enabled || runEnded) return;
      pvpState.strikeCooldown = Math.max(0, pvpState.strikeCooldown - dt);
      if (!pvpState.roundActive && pvpState.nextRoundAt && performance.now() >= pvpState.nextRoundAt) {
        pvpState.nextRoundAt = 0;
        resetPvpRound();
      }
      updatePvpBot(dt);
      if (pvpState.online) {
        pvpState.syncClock -= dt;
        if (pvpState.syncClock <= 0) {
          pvpState.syncClock = 0.34;
          syncOnlinePvp();
        }
      }
    }

    function clampCamera() {
      camera.x = clamp(camera.x, 0, Math.max(0, world.width - camera.width));
      camera.y = clamp(camera.y, 0, Math.max(0, world.height - camera.height));
    }

    function pointInRect(x, y, rect, padding = 0) {
      return x >= rect.x + padding &&
        x <= rect.x + rect.w - padding &&
        y >= rect.y + padding &&
        y <= rect.y + rect.h - padding;
    }

    function canStandAt(x, y) {
      return walkableAreas.some((area) => pointInRect(x, y, area, player.radius));
    }

    function clampLocalCoopPlayerTwoToScreen() {
      if (!localCoopEnabled) return;
      const padding = playerTwo.radius + 10;
      playerTwo.x = clamp(playerTwo.x, camera.x + padding, camera.x + camera.width - padding);
      playerTwo.y = clamp(playerTwo.y, camera.y + padding, camera.y + camera.height - padding);
    }

    function updateLocalCoopPlayerTwo(dt) {
      if (!localCoopEnabled || runEnded) return;
      playerTwo.skillCooldown = Math.max(0, playerTwo.skillCooldown - dt);
      playerTwo.pulseCooldown = Math.max(0, playerTwo.pulseCooldown - dt);
      if (backpackModal.classList.contains("show") || searchState || pendingLoot) {
        clampLocalCoopPlayerTwoToScreen();
        return;
      }
      let dx = 0;
      let dy = 0;
      if (keys.has("ArrowUp")) dy -= 1;
      if (keys.has("ArrowDown")) dy += 1;
      if (keys.has("ArrowLeft")) dx -= 1;
      if (keys.has("ArrowRight")) dx += 1;
      if (!dx && !dy) {
        clampLocalCoopPlayerTwoToScreen();
        return;
      }
      const length = Math.hypot(dx, dy) || 1;
      playerTwo.facingX = dx / length;
      playerTwo.facingY = dy / length;
      const stepX = (dx / length) * playerTwo.speed * dt;
      const stepY = (dy / length) * playerTwo.speed * dt;
      const nextX = clamp(playerTwo.x + stepX, world.margin + playerTwo.radius, world.width - world.margin - playerTwo.radius);
      const nextY = clamp(playerTwo.y + stepY, world.margin + playerTwo.radius, world.height - world.margin - playerTwo.radius);
      if (canStandAt(nextX, playerTwo.y)) playerTwo.x = nextX;
      if (canStandAt(playerTwo.x, nextY)) playerTwo.y = nextY;
      clampLocalCoopPlayerTwoToScreen();
    }

    function nearestLocalCoopEnemy(origin, range = 82) {
      let best = null;
      let bestDistance = range;
      aiScavs.forEach((npc) => {
        if (npc.active === false || npc.dead) return;
        const distance = Math.hypot(npc.x - origin.x, npc.y - origin.y) - (npc.r || 18);
        if (distance < bestDistance) {
          best = npc;
          bestDistance = distance;
        }
      });
      return best;
    }

    function localCoopPlayerTwoStrike() {
      if (!localCoopEnabled || runEnded || backpackModal.classList.contains("show") || playerTwo.skillCooldown > 0) return;
      playerTwo.skillCooldown = 0.48;
      const target = nearestLocalCoopEnemy(playerTwo, 92);
      if (!target) {
        hitBursts.push({ x: playerTwo.x + playerTwo.facingX * 30, y: playerTwo.y + playerTwo.facingY * 30, age: 0, label: "2号" });
        return;
      }
      damageNpc(target, target.isBoss ? 3.2 : 7.5, "2号打击");
      promptEl.innerHTML = `<strong>2号</strong> 命中 ${escapeHtml(target.name)}。`;
      renderHud();
    }

    function localCoopPlayerTwoPulse() {
      if (!localCoopEnabled || runEnded || backpackModal.classList.contains("show") || playerTwo.pulseCooldown > 0) return;
      playerTwo.pulseCooldown = 3.2;
      let hits = 0;
      aiScavs.forEach((npc) => {
        if (npc.active === false || npc.dead) return;
        if (Math.hypot(npc.x - playerTwo.x, npc.y - playerTwo.y) <= (npc.r || 18) + 132) {
          hits += 1;
          damageNpc(npc, npc.isBoss ? 2.4 : 5.8, "2号脉冲", true);
        }
      });
      hitBursts.push({ x: playerTwo.x, y: playerTwo.y, age: 0, label: "脉冲", power: 0.42, color: "rgba(125, 220, 255, 0.58)" });
      promptEl.innerHTML = hits ? `<strong>2号</strong> 脉冲命中 ${hits} 个目标。` : "<strong>2号</strong> 脉冲挥空。";
      renderHud();
    }

    function randomWalkPoint() {
      for (let attempt = 0; attempt < 30; attempt += 1) {
        const area = pickOne(walkableAreas);
        const x = randomInt(Math.ceil(area.x + 34), Math.floor(area.x + area.w - 34));
        const y = randomInt(Math.ceil(area.y + 34), Math.floor(area.y + area.h - 34));
        if (canStandAt(x, y)) return { x, y };
      }
      return { x: player.x, y: player.y };
    }

    function distantWalkPoint(minDistance = 620) {
      let fallback = randomWalkPoint();
      for (let attempt = 0; attempt < 60; attempt += 1) {
        const point = randomWalkPoint();
        fallback = point;
        if (Math.hypot(point.x - player.x, point.y - player.y) >= minDistance) return point;
      }
      return fallback;
    }

    function firstWaveCleared() {
      return [...firstWaveNpcIds].every((id) => {
        const npc = aiScavs.find((candidate) => candidate.id === id);
        return !npc || npc.dead;
      });
    }

    function secondWaveActiveOrPending() {
      return secondWaveState.warned || secondWaveState.spawned;
    }

    function reroutePendingSssEvent() {
      if (worldEvent.initialized || worldEvent.type !== "sssCollection") return;
      worldEvent.type = Math.random() < 0.5 ? "blackout" : "timedExtract";
    }

    function secondWaveSpawnPoint(preferred, index) {
      const base = preferred || distantWalkPoint(640);
      if (canStandAt(base.x, base.y) && Math.hypot(base.x - player.x, base.y - player.y) >= 420) return base;
      for (let attempt = 0; attempt < 44; attempt += 1) {
        const angle = (index / 5) * Math.PI * 2 + (Math.random() - 0.5) * 0.9;
        const distance = 130 + Math.random() * 160;
        const point = {
          x: base.x + Math.cos(angle) * distance,
          y: base.y + Math.sin(angle) * distance
        };
        if (canStandAt(point.x, point.y) && Math.hypot(point.x - player.x, point.y - player.y) >= 360) return point;
      }
      return distantWalkPoint(560);
    }

    function spawnSecondWaveInvaders() {
      if (secondWaveState.spawned || runEnded || pvpState.enabled) return;
      if (sssCollectionActive()) {
        secondWaveState.warned = false;
        secondWaveState.spawnDelay = 0;
        return;
      }
      secondWaveState.spawned = true;
      secondWaveState.warned = false;
      reroutePendingSssEvent();
      const spawnBases = [
        { x: 1830, y: 260 },
        { x: 1160, y: 1020 },
        { x: 690, y: 1510 },
        { x: 2920, y: 1440 },
        { x: 2860, y: 2140 }
      ];
      const invaders = [
        { id: "second-wave-raider-00", name: "第二波入侵者 · 破门手", icon: "破", r: 23, speed: 112, damage: 15, maxHp: 6, attackType: "melee", area: "中央步道" },

    function randomLeftMiddleWalkPoint() {
      let fallback = randomWalkPoint();
      for (let attempt = 0; attempt < 80; attempt += 1) {
        const area = pickOne(walkableAreas);
        const minX = Math.ceil(area.x + 34);
        const maxX = Math.floor(Math.min(area.x + area.w - 34, timedExtractRightBoundaryX));
        if (maxX < minX) continue;
        const x = randomInt(minX, maxX);
        const y = randomInt(Math.ceil(area.y + 34), Math.floor(area.y + area.h - 34));
        if (canStandAt(x, y)) {
          fallback = { x, y };
          if (x <= timedExtractRightBoundaryX) return fallback;
        }
      }
      return fallback.x <= timedExtractRightBoundaryX ? fallback : { x: 1810, y: 2260 };
    }

    function timedExtractWalkPoint(minDistance = 760) {
      let fallback = randomLeftMiddleWalkPoint();
      for (let attempt = 0; attempt < 80; attempt += 1) {
        const point = randomLeftMiddleWalkPoint();
        fallback = point;
        if (Math.hypot(point.x - player.x, point.y - player.y) >= minDistance) return point;
      }
      return fallback;
    }

    function steerAiToEvent(point, aggro = 7) {
      availableIceTargets().forEach((npc) => {
        if (npc.dead || npc.active === false) return;
        npc.eventTarget = { x: point.x, y: point.y };
        npc.target = { x: point.x, y: point.y };
        npc.wait = 0;
        if (!npc.isBoss) npc.aggro = 0;
        npc.eventPull = Math.max(npc.eventPull || 0, aggro);
      });
    }

    function guardianSpawnPoint(center, index, total) {
      const angle = -Math.PI / 2 + (index - (total - 1) / 2) * 0.92;
      const distances = [92, 118, 104];
      const radius = distances[index] || 106;
      const base = {
        x: center.x + Math.cos(angle) * radius,
        y: center.y + Math.sin(angle) * radius
      };
      if (canStandAt(base.x, base.y)) return base;
      for (let attempt = 0; attempt < 32; attempt += 1) {
        const probeAngle = angle + (Math.random() - 0.5) * 1.8;
        const probeRadius = 78 + Math.random() * 110;
        const point = {
          x: center.x + Math.cos(probeAngle) * probeRadius,
          y: center.y + Math.sin(probeAngle) * probeRadius
        };
        if (canStandAt(point.x, point.y)) return point;
      }
      return center;
    }

    function eventStatusText() {
      if (secondWaveState.warned) return "G.T.I.行动站第二波入侵者正在接近。";
      if (secondWaveState.spawned && aiScavs.some((npc) => npc.secondWave && !npc.dead)) {
        return "第二波加强入侵者正在场内游荡。";
      }

        return "SSS高价值物资仍在场内，全图争夺中。";

      if (worldEvent.timedExtract?.left > 0) {
