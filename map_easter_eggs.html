<!doctype html>

<style>
  :root{--bg:#07100d;--line:#24382d;--green:#9fe870;--text:#e8f2ea;--muted:#8fa395;--warn:#d9c272;--shadow:0 18px 45px rgba(0,0,0,.35)}
  *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(rgba(159,232,112,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(159,232,112,.025) 1px,transparent 1px),radial-gradient(circle at 84% 5%,rgba(77,131,79,.15),transparent 28%),var(--bg);background-size:32px 32px,32px 32px,auto,auto;color:var(--text);font:14px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  a{color:inherit;text-decoration:none}.wrap{max-width:1440px;margin:auto;padding:0 28px}.topline{height:3px;background:linear-gradient(90deg,transparent 5%,var(--green) 40%,#5eae62 70%,transparent 96%)}
  header{position:sticky;top:0;z-index:20;background:rgba(6,14,11,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav{height:74px;display:flex;align-items:center;gap:26px}.brand{display:flex;align-items:center;gap:14px;min-width:260px}.mark{width:38px;height:38px;border:1px solid #79b46d;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(145deg,#203728,#0b1711);display:grid;place-items:center;color:var(--green);font-weight:900}.brand b{font-size:17px;letter-spacing:1px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2.4px;margin-top:-2px}nav{display:flex;gap:8px;flex:1}nav a{padding:10px 12px;color:#b9c7bc;border:1px solid transparent}nav a:hover{border-color:var(--line);background:#0d1813;color:var(--green)}.back{height:40px;border:1px solid var(--line);background:#08110d;display:flex;align-items:center;padding:0 12px;color:var(--muted);white-space:nowrap}
  .hero{padding:50px 0 22px}.hero-main{border:1px solid #2c4235;background:linear-gradient(135deg,#11231a,#08110d 70%);box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:320px}.hero-main:after{content:"EASTER EGGS";position:absolute;right:-28px;bottom:-44px;font-size:108px;font-weight:900;color:rgba(159,232,112,.045);letter-spacing:-5px;transform:rotate(-7deg)}.hero-copy{position:relative;z-index:1;padding:46px;max-width:760px}.eyebrow{color:var(--green);font:700 11px/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:3px}h1{font-size:60px;line-height:.96;margin:18px 0 14px;letter-spacing:-3px}.lead{max-width:680px;color:#b5c5b8;font-size:15px}.notice{margin-top:18px;border:1px solid #665b32;background:#15140c;color:#d9c272;padding:12px 14px;font-size:12px;max-width:760px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.tabs a{border:1px solid #34523c;background:#0d1913;color:#cfe0d2;padding:8px 10px;font:800 11px ui-monospace,monospace}.tabs a:hover{border-color:#77ae68;color:var(--green)}
  .section{padding:22px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:15px}.section h2{font-size:20px;margin:0;letter-spacing:.5px}.section h2:before{content:"// ";color:var(--green)}.section-head span{color:var(--muted);font:800 10px ui-monospace,monospace;letter-spacing:1.2px}.map-panel{border:1px solid var(--line);background:#0a140f;box-shadow:var(--shadow);margin-bottom:18px}.map-head{padding:20px;border-bottom:1px solid #1e3327;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}.map-head h3{font-size:30px;line-height:1;margin:8px 0 8px;letter-spacing:-1px}.map-head p{margin:0;color:#b5c5b8}.confidence{border:1px solid #446b4c;color:var(--green);font:900 10px ui-monospace,monospace;letter-spacing:1px;padding:6px 9px;white-space:nowrap}.entry-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}.entry{border:1px solid #22382b;background:#0d1913;padding:16px}.entry-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.entry h4{font-size:18px;line-height:1.25;margin:0}.pill{border:1px solid #3b5b43;color:#abc7ae;font:800 10px ui-monospace,monospace;padding:3px 7px;white-space:nowrap}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.meta div{border:1px solid #1d3126;background:#08110d;padding:9px}.meta span{display:block;color:var(--muted);font-size:10px}.meta strong{display:block;font-size:12px;margin-top:2px}.steps{margin:12px 0 0;padding-left:18px;color:#c6d3c9;font-size:12px}.steps li{margin:6px 0}.risk{margin-top:12px;color:#d9c272;font-size:12px;border-left:3px solid #665b32;padding-left:10px}.source-row{display:flex;gap:10px;flex-wrap:wrap;padding:0 16px 16px}.source-row a{color:var(--green);font-size:12px;border-bottom:1px solid rgba(159,232,112,.35)}.advanced{border:1px solid #665b32;background:linear-gradient(135deg,#15140c,#0a140f 72%);padding:18px}.advanced h3{font-size:26px;margin:8px 0}.advanced p{color:#c6d3c9}.footer{margin-top:36px;border-top:1px solid var(--line);padding:28px 0 50px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:20px}.warning{color:#a9b7ac;max-width:860px}
  @media(max-width:920px){nav{display:none}.brand{min-width:0}.entry-grid{grid-template-columns:1fr}.map-head{grid-template-columns:1fr}.meta{grid-template-columns:1fr}}
  @media(max-width:620px){.wrap{padding:0 18px}.hero-copy{padding:34px 24px}h1{font-size:40px}.footer{flex-direction:column}}
</style>
</head>
<body>
<div class="topline"></div>
<header><div class="wrap nav">
  <a class="brand" href="delta_force_wiki_home.html"><div class="mark">Δ</div><div><b>三角洲行动 WIKI</b><small>TACTICAL DATA ARCHIVE</small></div></a>
  <nav><a href="operations_fire.html">烽火地带</a><a href="#maps">地图彩蛋</a><a href="#advanced">黄金鸟窝</a><a href="#sources">来源</a><a href="community_forum.html">玩家交流</a></nav>
  <a class="back" href="delta_force_wiki_home.html">← 返回首页</a>
</div></header>
<main class="wrap">
  <section class="hero"><div class="hero-main"><div class="hero-copy"><div class="eyebrow">OPERATIONS // MAP EASTER EGGS</div><h1>地图彩蛋攻略</h1><p class="lead">按地图整理密码门、协议箱、隐藏奖励和跨图链路。先接入高查询价值路线，后续再按版本继续复核和补图。</p><div class="notice" id="disclaimer"></div><div class="tabs" id="mapTabs"></div></div></div></section>
  <section class="section" id="maps"><div class="section-head"><h2>地图彩蛋</h2><span>社区攻略 / 版本需复核</span></div><div id="mapGuides"></div></section>
  <section class="section" id="advanced"><div class="section-head"><h2>跨图高级彩蛋</h2><span>活动时效优先复核</span></div><div id="advancedGuides"></div></section>
  <section class="section" id="sources"><div class="section-head"><h2>来源</h2><span>点击查看原攻略</span></div><div class="source-row" id="sourceList"></div></section>
  <footer class="footer"><div class="warning">资料说明：本页整理公开社区攻略，不直接等同官方说明。每日密码、赛季活动和一次性奖励可能随版本变化，实操前请用当前版本来源复核。</div><div>MAP EASTER EGGS // 2026-08-31</div></footer>
</main>
<script src="assets/wiki-data.js"></script>
<script>
  const data = window.DELTA_WIKI_DATA || { sources: [], mapEasterEggs: { guides: [], advanced: [] } };
  const eggData = data.mapEasterEggs || { guides: [], advanced: [] };
  const sourceById = Object.fromEntries((data.sources || []).map((source)=>[source.id, source]));
  const escapeHtml = (value)=>String(value ?? '').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  document.querySelector('#disclaimer').textContent = eggData.disclaimer || '';
  document.querySelector('#mapTabs').innerHTML = (eggData.guides || []).map((guide)=>'<a href="#' + escapeHtml(guide.slug) + '">' + escapeHtml(guide.map) + '</a>').join('') + '<a href="#advanced">黄金鸟窝</a>';
  function sourcesHtml(ids){ return (ids || []).map((id)=>sourceById[id]).filter(Boolean).map((source)=>'<a href="' + escapeHtml(source.url) + '" target="_blank" rel="noreferrer">' + escapeHtml(source.name) + '</a>').join(''); }
  function entryHtml(entry){ return '<article class="entry"><div class="entry-top"><h4>' + escapeHtml(entry.title) + '</h4><span class="pill">' + escapeHtml(entry.difficulty) + '</span></div><div class="meta"><div><span>奖励</span><strong>' + escapeHtml(entry.reward) + '</strong></div><div><span>路线</span><strong>' + escapeHtml(entry.route) + '</strong></div></div><ol class="steps">' + (entry.steps || []).map((step)=>'<li>' + escapeHtml(step) + '</li>').join('') + '</ol><div class="risk">' + escapeHtml(entry.risk) + '</div></article>'; }
  document.querySelector('#mapGuides').innerHTML = (eggData.guides || []).map((guide)=>'<section class="map-panel" id="' + escapeHtml(guide.slug) + '"><div class="map-head"><div><div class="eyebrow">MAP FILE</div><h3>' + escapeHtml(guide.map) + '</h3><p>' + escapeHtml(guide.summary) + '</p></div><span class="confidence">' + escapeHtml(guide.confidence) + '</span></div><div class="entry-grid">' + (guide.entries || []).map(entryHtml).join('') + '</div><div class="source-row">' + sourcesHtml(guide.sourceIds) + '</div></section>').join('');
  document.querySelector('#advancedGuides').innerHTML = (eggData.advanced || []).map((guide)=>'<article class="advanced"><div class="eyebrow">ADVANCED CHAIN</div><h3>' + escapeHtml(guide.title) + '</h3><p>' + escapeHtml(guide.summary) + '</p><ol class="steps">' + (guide.steps || []).map((step)=>'<li>' + escapeHtml(step) + '</li>').join('') + '</ol><div class="risk">' + escapeHtml(guide.risk) + '</div><div class="source-row">' + sourcesHtml(guide.sourceIds) + '</div></article>').join('');
  const allSourceIds = new Set([...(eggData.guides || []).flatMap((guide)=>guide.sourceIds || []), ...(eggData.advanced || []).flatMap((guide)=>guide.sourceIds || [])]);
  document.querySelector('#sourceList').innerHTML = [...allSourceIds].map((id)=>sourceById[id]).filter(Boolean).map((source)=>'<a href="' + escapeHtml(source.url) + '" target="_blank" rel="noreferrer">' + escapeHtml(source.name) + ' · ' + escapeHtml(source.type) + '</a>').join('');
</script>
</body>
</html>
